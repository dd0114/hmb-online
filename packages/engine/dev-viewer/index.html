<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMB 엔진 디버그 뷰어</title>
    <style>
      :root {
        --bg: #0f1420; --panel: #1a2233; --ink: #e7edf6; --muted: #8ea0bd;
        --home: #3b82f6; --away: #ef4444; --accent: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg); color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px;
      }
      h1 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
      #scoreboard { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
      #scoreboard .home { color: var(--home); } #scoreboard .away { color: var(--away); }
      #minute { color: var(--muted); font-size: 14px; }
      #wrap { width: 100%; max-width: 1040px; position: relative; }
      canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #14532d; }
      #flash {
        position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center;
        padding-top: 10%; /* 골문(줌 시 화면 중앙)을 가리지 않게 위쪽에 표시 */
        font-size: 60px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 24px #000, 0 0 40px var(--accent);
        opacity: 0; pointer-events: none; letter-spacing: 4px;
      }
      #flash.show { animation: goalPop 1.9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes goalPop {
        0% { opacity: 0; transform: scale(.3) rotate(-6deg); }
        12% { opacity: 1; transform: scale(1.25) rotate(3deg); }
        26% { transform: scale(.95) rotate(-1deg); }
        40% { transform: scale(1.05); } 82% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.1); }
      }
      #banner {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(10,14,22,.85); border: 1px solid #33415f;
        padding: 7px 18px; border-radius: 20px; font-size: 15px; font-weight: 800;
        white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none;
        text-shadow: 0 1px 6px #000;
      }
      #banner.show { opacity: 1; }
      /* 상황 카드(선방/빗나감/파울/오프사이드/PK) — 골(거대 중앙 팝)과 명확히 구분되는 중간 크기 안내. */
      #situation {
        position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
        background: rgba(10,14,22,.9); border: 2px solid currentColor;
        padding: 8px 22px; border-radius: 12px; font-size: 30px; font-weight: 800;
        white-space: nowrap; opacity: 0; pointer-events: none; text-shadow: 0 1px 8px #000;
      }
      #situation.show { animation: sitIn 1.3s ease forwards; }
      @keyframes sitIn {
        0% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
        12% { opacity: 1; transform: translateX(-50%) translateY(0); }
        82% { opacity: 1; } 100% { opacity: 0; }
      }
      .controls {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: var(--panel); padding: 10px 12px; border-radius: 8px; width: 100%; max-width: 1040px;
      }
      button {
        background: #26324a; color: var(--ink); border: 1px solid #33415f;
        border-radius: 6px; padding: 6px 11px; cursor: pointer; font-family: inherit; font-size: 13px;
      }
      button:hover { background: #33415f; }
      button.active { background: var(--accent); color: #04220f; border-color: var(--accent); }
      #scrubwrap { position: relative; flex: 1 1 240px; display: flex; align-items: center; }
      #scrub { width: 100%; }
      #marks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
      #marks .gm { position: absolute; width: 3px; height: 16px; transform: translate(-50%, -50%); border-radius: 2px; box-shadow: 0 0 3px #000; }
      #clock { color: var(--ink); font-size: 13px; font-weight: 700; min-width: 84px; text-align: right; }
      .sp { color: var(--muted); font-size: 12px; }
      #ticker {
        width: 100%; max-width: 1040px; height: 90px; overflow-y: auto;
        background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.7;
      }
      .ev-goal { color: var(--accent); font-weight: 700; } .ev-shot { color: #fbbf24; }
      .ev-tackle, .ev-interception { color: var(--muted); }
      .ev-foul { color: #f59e0b; } .ev-offside { color: #a78bfa; }
      .ev-free_kick { color: #94a3b8; } .ev-penalty { color: #22c55e; font-weight: 700; }
      .ev-card { color: #eab308; } .ev-save { color: #38bdf8; }
      #status { color: var(--muted); font-size: 12px; min-height: 16px; }
      input[type="file"] { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>HMB TIER-B 엔진 · 디버그 뷰어</h1>
    <div id="scoreboard">
      <span class="home" id="homeName">HOME</span>
      <span id="score">0 : 0</span>
      <span class="away" id="awayName">AWAY</span>
      <span id="minute">0'</span>
    </div>
    <div id="wrap">
      <canvas id="pitch" width="1050" height="680"></canvas>
      <div id="flash"></div>
      <div id="situation"></div>
      <div id="banner"></div>
    </div>
    <div class="controls">
      <button id="playBtn">▶ 재생</button>
      <button id="restartBtn">⟲ 처음</button>
      <button id="followBtn">🔍 공 따라가기</button>
      <button id="trailBtn" class="active">✦ 선수 잔상</button>
      <button id="highlightBtn" class="active">🎬 하이라이트</button>
      <span class="sp">수동배속</span>
      <button data-speed="0.25">0.25x</button>
      <button data-speed="0.5">0.5x</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
    </div>
    <div class="controls">
      <button id="prevShot">◀ 이전 슛</button>
      <button id="nextShot">다음 슛 ▶</button>
      <button id="prevGoal">◀ 이전 골</button>
      <button id="nextGoal">다음 골 ▶</button>
      <div id="scrubwrap">
        <input id="scrub" type="range" min="0" max="100" value="0" step="0.01" />
        <div id="marks"></div>
      </div>
      <span id="clock">0' / 0'</span>
    </div>
    <div id="ticker"></div>
    <div id="status">match-log.json 로딩 중…</div>
    <input type="file" id="fileInput" accept="application/json" title="match-log.json 직접 불러오기" />

    <script type="module">
      import { buildPlayback, spansReposition, synthOutFlight, freezeSpanEndIdx } from "./playback.mjs";
      // ===== 뷰어 재생. 순수 로직은 playback.mjs(vitest 검증). 외부 CDN 없음. =====
      const PITCH_W = 105, PITCH_H = 68, MARGIN = 30; // MARGIN=피치 둘레 여백(surround)px. 경계(코너/터치라인) 위 taker·공이 잘리지 않게.
      const FOLLOW_ZOOM = 2.6;                 // 공 따라가기 확대율
      const CAM_SMOOTH = 0.12;                 // 정지(freeze) 중 카메라 팬 속도(0..1/frame). 정지→정지 줌 순간이동 방지.
      const CAM_MAX_PAN_PXPS = 900;            // #45: 카메라 팬 속도 상한(스크린px/s) — 와이드↔팔로우 급전환도 글라이드
      const CAM_MAX_ZOOM_PS = 2.2;             // #45: 줌 변화 속도 상한(zoom/s)
      const SYNTH_MS = 350;                    // #43: 세트피스 freeze 도입부 합성 아웃 비행 시간(ms)
      const BALL_TRAIL = 6, PLAYER_TRAIL = 10; // 잔상 길이(틱). 공 트레일은 짧은 최근 꼬리(피치 가로지르는 지그재그 클러터 방지).
      const TICKS_PER_SEC = 2;                  // 1x = 2 게임초/실초 (거의 실시간, 공이 눈에 따라감)
      const CRUISE_SPEED = 4, HL_SPEED = 1, HL_WINDOW = 8; // 하이라이트 자동페이싱: 빌드업 4x → 찬스 근처 1x

      const canvas = document.getElementById("pitch");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const scoreEl = document.getElementById("score");
      const minuteEl = document.getElementById("minute");
      const tickerEl = document.getElementById("ticker");
      const scrub = document.getElementById("scrub");
      const playBtn = document.getElementById("playBtn");
      const flashEl = document.getElementById("flash");
      const bannerEl = document.getElementById("banner");
      const situationEl = document.getElementById("situation");
      const marksEl = document.getElementById("marks");
      const clockEl = document.getElementById("clock");

      let log = null, snaps = [], playing = false, speed = 1, tickPos = 0, lastTs = 0;
      let follow = false, showTrail = true, autoPace = true, keyTicks = [], confetti = [];
      let shotFx = [], shotFxTicks = new Set(); // 유효슛 링 이펙트(정지 없음, 순수 시각)
      let annos = [], snapByTick = new Map(), restartTickSet = new Set(), ballCutTickSet = new Set(), totalMinutes = 0;
      let stoppages = [], hold = null; // 데드볼: freeze→skip 시퀀스
      let lastRender = null; // 마지막 draw()의 렌더된 공(보간 후) — Playwright 계약검증용(__viewer.render()).
      let lastGeom = null;   // 마지막 draw()의 화면좌표 기하(캔버스px) — taker/공 클리핑 계약검증용(__viewer.screenGeom()).
      let lastPlayers = [];  // 마지막 draw()의 렌더된(보간 후) 선수 피치좌표 — 세트피스 taker 슬라이드 검출용.
      let frameDt = 1 / 60;  // 직전 프레임 실경과(초). 카메라 팬을 주사율 무관하게(dt 정규화).
      const TOAST_TICKS = 5, BANNER_TICKS = 16;
      const idxOfTick = (tick) => { const i = snaps.findIndex((s) => s.tick >= tick); return i < 0 ? snaps.length - 1 : i; };
      // 가로·세로 양쪽에 MARGIN 이 남도록 letterbox-fit(작은 배율 채택). 예전엔 폭만 맞춰
      // 피치가 캔버스 상하를 거의 채워, 터치라인/코너 위 taker 마커와 공이 캔버스 끝에서 잘렸다(#26).
      const baseScale = Math.min(
        (canvas.width - 2 * MARGIN) / PITCH_W,
        (canvas.height - 2 * MARGIN) / PITCH_H,
      );
      let cam = { cx: PITCH_W / 2, cy: PITCH_H / 2, zoom: 1 };

      function sx(x) { return canvas.width / 2 + (x - cam.cx) * baseScale * cam.zoom; }
      function sy(y) { return canvas.height / 2 + (y - cam.cy) * baseScale * cam.zoom; }
      const lerp = (a, b, t) => a + (b - a) * t;

      function drawPitch() {
        ctx.fillStyle = "#14532d"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        const stripes = 12, sw = PITCH_W / stripes;
        for (let i = 0; i < stripes; i += 2) ctx.fillRect(sx(i * sw), sy(0), sx((i + 1) * sw) - sx(i * sw), sy(PITCH_H) - sy(0));
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
        ctx.strokeRect(sx(0), sy(0), sx(PITCH_W) - sx(0), sy(PITCH_H) - sy(0));
        ctx.beginPath(); ctx.moveTo(sx(PITCH_W / 2), sy(0)); ctx.lineTo(sx(PITCH_W / 2), sy(PITCH_H)); ctx.stroke();
        ctx.beginPath(); ctx.arc(sx(PITCH_W / 2), sy(PITCH_H / 2), (sx(9.15) - sx(0)), 0, Math.PI * 2); ctx.stroke();
        const boxD = 16.5, boxW = 40.3, gy0 = (PITCH_H - boxW) / 2;
        ctx.strokeRect(sx(0), sy(gy0), sx(boxD) - sx(0), sy(gy0 + boxW) - sy(gy0));
        ctx.strokeRect(sx(PITCH_W - boxD), sy(gy0), sx(PITCH_W) - sx(PITCH_W - boxD), sy(gy0 + boxW) - sy(gy0));
        const g0 = (PITCH_H - 7.32) / 2;
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillRect(sx(0) - 5, sy(g0), 5, sy(g0 + 7.32) - sy(g0));
        ctx.fillRect(sx(PITCH_W), sy(g0), 5, sy(g0 + 7.32) - sy(g0));
      }

      function draw() {
        if (snaps.length === 0) { drawPitch(); return; }
        const i = Math.min(Math.floor(tickPos), snaps.length - 1);
        const j = Math.min(i + 1, snaps.length - 1);
        const t = tickPos - i;
        const A = snaps[i], B = snaps[j];
        // 데드볼 재배치 구간만 보간 안 함(슛 궤적은 이벤트로 구분 → 부드럽게). playback.spansReposition.
        // #51: 공은 ballCutTickSet(순간이동만) 으로 컷 → 연속 아웃(스로인)은 라이브 이동. 선수는 restartTickSet 로 항상 컷(pt, 아래).
        const bt = spansReposition(A.tick, B.tick, ballCutTickSet) ? 0 : t;
        let bx = lerp(A.ball.x, B.ball.x, bt), by = lerp(A.ball.y, B.ball.y, bt);
        // #43: 세트피스 freeze 도입부 — 합성 아웃 비행. 엔진 데이터엔 공이 라인을 넘는 레그가
        // 없어서(재시작 틱에 곧장 스팟 파킹) 직전 속도 외삽 레그를 먼저 보여준 뒤 스팟에 놓는다.
        if (hold && hold.synth) {
          const sp = (performance.now() - hold.start) / SYNTH_MS;
          if (sp < 1) {
            const s = hold.synth;
            if (s.via) {
              // 코너 디플렉션 2레그: from→via(골라인 밖 wide 교차) → via→exit(깃발). 스팟에서 끝나 연속.
              if (sp < 0.5) { const u = sp / 0.5; bx = lerp(s.from.x, s.via.x, u); by = lerp(s.from.y, s.via.y, u); }
              else { const u = (sp - 0.5) / 0.5; bx = lerp(s.via.x, s.exit.x, u); by = lerp(s.via.y, s.exit.y, u); }
            } else { bx = lerp(s.from.x, s.exit.x, sp); by = lerp(s.from.y, s.exit.y, sp); }
          }
        }
        lastRender = { x: bx, y: by, bt, aTick: A.tick, bTick: B.tick, tickPos, zoom: hold ? !!hold.zoom : false };

        // 카메라: 수동 공따라가기 OR 하이라이트(찬스/골) 근처면 자동 줌인
        const curTick = A.tick;
        const nearKey = autoPace && keyTicks.some((kt) => Math.abs(kt - curTick) <= HL_WINDOW);
        // 골 세리머니 후반(트윈>0.4)엔 줌을 풀어 선수들이 포메이션으로 걸어 복귀하는 걸 전체뷰로 보여줌.
        const koTweening = hold && hold.koIdx != null && hold.tween > 0.4;
        // 골 freeze 중에는 공(골문)으로 줌해 '네트 인'을 보여준다(세이브처럼).
        // 데드볼 정지(hold.wide=세트피스/프리킥)면 전체뷰 강제 → 관객이 박스·선수 배치를 본다.
        const useFollow = !koTweening && !(hold && hold.wide) && (follow || nearKey || (hold ? !!hold.zoom : false));
        const camTarget = useFollow ? { cx: bx, cy: by, zoom: FOLLOW_ZOOM } : { cx: PITCH_W / 2, cy: PITCH_H / 2, zoom: 1 };
        // 재생 중 카메라를 항상 목표로 부드럽게 팬 → 정지 전환·하이라이트 줌인/줌아웃·정지 재개
        // (전체뷰↔줌) 모두 순간이동 없이 이어진다(코너-하이라이트 겹침 프레임 튐 방지).
        // 하이라이트 슬로모 중 공은 프레임당 <1m 이동이라 팬 랙 미미(공 중앙 유지). seek/일시정지는 스냅.
        // dt 정규화(60fps) → 팬 지속시간이 주사율(60/120Hz) 무관하게 일정.
        const cs = playing ? 1 - Math.pow(1 - CAM_SMOOTH, Math.min(3, frameDt * 60)) : 1;
        let ncx = cam.cx + (camTarget.cx - cam.cx) * cs;
        let ncy = cam.cy + (camTarget.cy - cam.cy) * cs;
        let nz = cam.zoom + (camTarget.zoom - cam.zoom) * cs;
        // #45: 프레임당 팬/줌 속도 상한 — 코너 와이드 직후 하이라이트 줌인이 걸리는 급전환(실측
        // 93px/frame 스텝)이 '한 번 튀는' 점프가 아니라 일정 속도 글라이드가 되게. seek 는 스냅 유지.
        if (playing) {
          const pxPerM = baseScale * cam.zoom;
          const maxPanM = (CAM_MAX_PAN_PXPS * frameDt) / pxPerM;
          const dxm = ncx - cam.cx, dym = ncy - cam.cy, dm = Math.hypot(dxm, dym);
          if (dm > maxPanM) { ncx = cam.cx + (dxm / dm) * maxPanM; ncy = cam.cy + (dym / dm) * maxPanM; }
          const maxDz = CAM_MAX_ZOOM_PS * frameDt;
          if (Math.abs(nz - cam.zoom) > maxDz) nz = cam.zoom + Math.sign(nz - cam.zoom) * maxDz;
        }
        cam = { cx: ncx, cy: ncy, zoom: nz };
        drawPitch();

        // 선수 잔상(옵션)
        if (showTrail) {
          for (let s = Math.max(0, i - PLAYER_TRAIL); s < i; s++) {
            const a = (s - (i - PLAYER_TRAIL)) / PLAYER_TRAIL * 0.18;
            for (const p of snaps[s].players) {
              ctx.beginPath(); ctx.arc(sx(p.pos.x), sy(p.pos.y), 3, 0, Math.PI * 2);
              ctx.fillStyle = p.team === "home" ? `rgba(59,130,246,${a})` : `rgba(239,68,68,${a})`; ctx.fill();
            }
          }
        }
        // 공 궤적: 짧은 comet 꼬리(오래될수록 흐리게). 데드볼 재배치 구간은 세그먼트를 건너뛰어
        // 피치를 가로지르는 지그재그 클러터를 없앤다.
        ctx.lineWidth = 2.5;
        for (let s = Math.max(1, i - BALL_TRAIL + 1); s <= i; s++) {
          if (spansReposition(snaps[s - 1].tick, snaps[s].tick, ballCutTickSet)) continue; // #51: 연속 아웃 공 트레일 유지
          const a = (s - (i - BALL_TRAIL)) / BALL_TRAIL; // 0..1 (최신일수록 1)
          ctx.strokeStyle = `rgba(255,230,0,${(0.12 + 0.45 * Math.max(0, a)).toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(sx(snaps[s - 1].ball.x), sy(snaps[s - 1].ball.y));
          ctx.lineTo(sx(snaps[s].ball.x), sy(snaps[s].ball.y));
          ctx.stroke();
        }

        // 선수 (실제 대비 비율감 위해 마커 축소). 번호는 외곽선으로 항상 읽히게.
        const R = useFollow ? 11 : 8;
        const fs = useFollow ? 12 : 9;
        ctx.font = `bold ${fs}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        let ownerDraw = null;
        const drawNum = (num, px, py) => {
          ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.strokeText(num, px, py);
          ctx.fillStyle = "#fff"; ctx.fillText(num, px, py);
        };
        // 골 세리머니 중이면 선수들을 킥오프 포메이션(koSnap)으로 트윈(순간이동 대신 걸어 복귀).
        const koSnap = hold && hold.koIdx != null ? snaps[hold.koIdx] : null;
        const koById = koSnap ? new Map(koSnap.players.map((q) => [q.playerId, q.pos])) : null;
        const ptw = koSnap ? hold.tween * hold.tween * (3 - 2 * hold.tween) : 0; // smoothstep
        const playerRender = [];

      function drawAnnos(curTick) {

          const s = snapByTick.get(a.at); if (!s) continue;
          const prog = age / TOAST_TICKS;

        b.classList.add("active");
      });
      scrub.oninput = () => { tickPos = (parseFloat(scrub.value) / 100) * (snaps.length - 1); lastGoalShown = -1; resetStops(); draw(); };

      function loadLog(data) {
        log = data; snaps = data.tickSnapshots;
        // 골 + 모든 슛(유효슛 포함) + 페널티 근처에서 하이라이트(슬로우+자동 줌인).
        keyTicks = data.events.filter((e) => e.type === "goal" || e.type === "penalty" || (e.type === "shot" && e.detail !== "saved" && e.detail !== "off_target")).map((e) => e.tick);
        // 유효슛(온타겟) = 골로 이어진/막힌/1대1/PK 슛(빗나감 제외) → 링 이펙트 대상.
        shotFxTicks = new Set(data.events.filter((e) => e.type === "shot" && e.detail !== "off_target").map((e) => e.tick));
        snapByTick = new Map(snaps.map((s) => [s.tick, s]));
        const pb = buildPlayback(data.events, snaps); // playback.mjs (vitest 검증)
        annos = pb.annos; stoppages = pb.stoppages; restartTickSet = pb.restartTicks; ballCutTickSet = pb.ballCutTicks;
        totalMinutes = snaps.length ? snaps[snaps.length - 1].minute : 0;
        // 타임라인 이벤트 핀(타입별 색·높이, 클릭 점프). 골>PK>선방>유효슛>코너 순으로 위에 그림.
        const mmss = (t) => `${Math.floor(t / 60)}'${String(Math.floor(t % 60)).padStart(2, "0")}"`;
        const PIN = {
          goal: (e) => ({ h: 16, w: 3, col: e.team === "home" ? "#3b82f6" : "#ef4444", z: 5, label: `${mmss(e.tick)} ${e.team} 골` }),
          penalty: () => ({ h: 14, w: 3, col: "#22c55e", z: 4, label: "PK" }),
          save: () => ({ h: 11, w: 2, col: "#38bdf8", z: 3, label: "선방" }),
          shot_on: () => ({ h: 8, w: 2, col: "#fbbf24", z: 2, label: "유효슛" }),
          corner: () => ({ h: 8, w: 2, col: "#94a3b8", z: 1, label: "코너" }),
        };
        const pins = [];
        for (const e of data.events) {
          let kind = null;
          if (e.type === "goal") kind = "goal";
          else if (e.type === "penalty") kind = "penalty";
          else if (e.type === "save") kind = "save";
          else if (e.type === "shot" && e.detail !== "off_target") kind = "shot_on";
          else if (e.type === "kickoff" && e.detail === "corner") kind = "corner";
          if (!kind) continue;
          const p = PIN[kind](e);
          const pct = (idxOfTick(e.tick) / Math.max(1, snaps.length - 1)) * 100;
          pins.push(`<div class="gm" data-tick="${e.tick}" style="left:${pct}%;width:${p.w}px;height:${p.h}px;background:${p.col};z-index:${p.z};cursor:pointer" title="${mmss(e.tick)} · ${p.label}"></div>`);
        }
        marksEl.innerHTML = pins.join("");
        marksEl.querySelectorAll("[data-tick]").forEach((el) => (el.onclick = () => jumpToTick(+el.dataset.tick)));
        renderTicker(); tickPos = 0; lastGoalShown = 0; setPlaying(true);
        statusEl.textContent = `로드 완료 · config ${data.configVersion} · seed ${data.seed} · ${snaps.length} ticks · 최종 ${data.finalScore.home}:${data.finalScore.away} · 팁: "공 따라가기" 켜고 "다음 슛"으로 점프해 보세요`;
      }

      if (window.__LOG__) {
        // 단일 파일(standalone) 모드: 데이터가 HTML 에 내장됨. 서버 불필요.
        loadLog(window.__LOG__);
      } else {
        fetch("./match-log.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(loadLog)
          .catch((err) => { statusEl.textContent = "match-log.json fetch 실패(" + err + "). 아래 파일 선택으로 열거나 standalone 파일을 여세요."; });
      }
      document.getElementById("fileInput").onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader(); reader.onload = () => loadLog(JSON.parse(reader.result)); reader.readAsText(f);
      };

      // 테스트/QA 훅(Playwright): 특정 틱으로 seek 후 프레임 렌더 + 자막 상태 조회.
      window.__viewer = {
        ready: () => !!log,
        events: () => (log ? log.events : []),
        seek: (tick) => { setPlaying(false); resetStops(); tickPos = idxOfTick(tick); draw(); },
        play: () => setPlaying(true),
        pause: () => setPlaying(false),
        autoPace: (on) => { autoPace = on; },
        // 정지 시퀀스처럼 원인에서 상황 자막을 강제 표시(스크린샷용).
        showSituationAt: (tick) => {
          const st = stoppages.find((s) => s.causeTick === tick);
          setPlaying(false); resetStops(); tickPos = idxOfTick(tick);
          if (st) situationCaption(st.big, st.bigCol);
          draw();
        },
        cur: () => { const s = snaps[Math.floor(tickPos)]; return { tickPosIdx: Math.floor(tickPos), tick: s.tick, ball: s.ball, follow }; },
        // 마지막 프레임의 렌더된(보간 후) 공 위치. cur()는 원시 스냅샷이라 보간 컷(순간이동)을 못 봄 → 이 훅으로 검출.
        render: () => (lastRender ? { ...lastRender } : null),
        // 임의 tickPos(분수 포함)로 렌더 후 렌더된 공 반환 — 슛 비행 보간 샘플링용.
        renderAt: (tp) => { setPlaying(false); resetStops(); tickPos = tp; draw(); return lastRender ? { ...lastRender } : null; },
        // 마지막 draw()의 화면좌표 기하(캔버스px): { cw, ch, ball:{px,py,r}, owner:{px,py,r}|null }. taker/공 클리핑 검출용.
        screenGeom: () => (lastGeom ? JSON.parse(JSON.stringify(lastGeom)) : null),
        // 임의 tickPos 로 렌더 후 렌더된(보간 후) 선수 피치좌표 배열 [{id,x,y}] 반환 — taker 슬라이드/순간이동 검출용.
        renderPlayersAt: (tp) => { setPlaying(false); resetStops(); tickPos = tp; draw(); return lastPlayers.map((p) => ({ ...p })); },
        // 현재 프레임의 렌더된 선수(리셋 없이) — 정지 재생/워크인 검출용(#52).
        curPlayers: () => lastPlayers.map((p) => ({ ...p })),
        // 현재 카메라 상태 {cx,cy,zoom} — 재생 중 카메라 점프/팬 검출용.
        cam: () => ({ cx: cam.cx, cy: cam.cy, zoom: cam.zoom }),
        idxOfTick: (tick) => idxOfTick(tick),
        // #47: 세트피스 정지의 합성 아웃 비행 레그 {from, via?, exit} 를 freeze 와 동일 경로로 계산.
        // null = 합성 안 함(컷). 코너·스로인 아웃 크로싱 계약 검증용(애니 wall-clock 의존 없이 결정론).
        synthAt: (causeTick) => {
          const st = stoppages.find((s) => s.causeTick === causeTick && s.setPiece);
          if (!st) return null;
          const ci = idxOfTick(st.causeTick);
          const p1 = snaps[ci - 1];
          if (!p1) return null;
          return synthOutFlight(p1.ball, snaps[ci].ball, { w: PITCH_W, h: PITCH_H }, st.kind) || null;
        },
        captions: () => ({
          flash: getComputedStyle(flashEl).opacity !== "0" ? flashEl.textContent : "",
          situation: getComputedStyle(situationEl).opacity !== "0" ? situationEl.textContent : "",
          banner: bannerEl.classList.contains("show") ? bannerEl.textContent : "",
          score: scoreEl.textContent, minute: minuteEl.textContent,
        }),
      };
      drawPitch(); requestAnimationFrame(tickLoop);
    </script>
  </body>
</html>
