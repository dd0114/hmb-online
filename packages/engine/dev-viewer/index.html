<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMB 엔진 디버그 뷰어</title>
    <style>
      :root {
        --bg: #0f1420; --panel: #1a2233; --ink: #e7edf6; --muted: #8ea0bd;
        --home: #3b82f6; --away: #ef4444; --accent: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg); color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px;
      }
      h1 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
      #scoreboard { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
      #scoreboard .home { color: var(--home); } #scoreboard .away { color: var(--away); }
      #minute { color: var(--muted); font-size: 14px; }
      #wrap { width: 100%; max-width: 1040px; position: relative; }
      canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #14532d; }
      #flash {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 68px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 24px #000, 0 0 40px var(--accent);
        opacity: 0; pointer-events: none; letter-spacing: 4px;
      }
      #flash.show { animation: goalPop 1.9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes goalPop {
        0% { opacity: 0; transform: scale(.3) rotate(-6deg); }
        12% { opacity: 1; transform: scale(1.25) rotate(3deg); }
        26% { transform: scale(.95) rotate(-1deg); }
        40% { transform: scale(1.05); } 82% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.1); }
      }
      #banner {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(10,14,22,.85); border: 1px solid #33415f;
        padding: 7px 18px; border-radius: 20px; font-size: 15px; font-weight: 800;
        white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none;
        text-shadow: 0 1px 6px #000;
      }
      #banner.show { opacity: 1; }
      .controls {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: var(--panel); padding: 10px 12px; border-radius: 8px; width: 100%; max-width: 1040px;
      }
      button {
        background: #26324a; color: var(--ink); border: 1px solid #33415f;
        border-radius: 6px; padding: 6px 11px; cursor: pointer; font-family: inherit; font-size: 13px;
      }
      button:hover { background: #33415f; }
      button.active { background: var(--accent); color: #04220f; border-color: var(--accent); }
      #scrub { flex: 1 1 200px; }
      .sp { color: var(--muted); font-size: 12px; }
      #ticker {
        width: 100%; max-width: 1040px; height: 90px; overflow-y: auto;
        background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.7;
      }
      .ev-goal { color: var(--accent); font-weight: 700; } .ev-shot { color: #fbbf24; }
      .ev-tackle, .ev-interception { color: var(--muted); }
      .ev-foul { color: #f59e0b; } .ev-offside { color: #a78bfa; }
      .ev-free_kick { color: #94a3b8; } .ev-penalty { color: #22c55e; font-weight: 700; }
      .ev-card { color: #eab308; } .ev-save { color: #38bdf8; }
      #status { color: var(--muted); font-size: 12px; min-height: 16px; }
      input[type="file"] { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>HMB TIER-B 엔진 · 디버그 뷰어</h1>
    <div id="scoreboard">
      <span class="home" id="homeName">HOME</span>
      <span id="score">0 : 0</span>
      <span class="away" id="awayName">AWAY</span>
      <span id="minute">0'</span>
    </div>
    <div id="wrap">
      <canvas id="pitch" width="1050" height="680"></canvas>
      <div id="flash"></div>
      <div id="banner"></div>
    </div>
    <div class="controls">
      <button id="playBtn">▶ 재생</button>
      <button id="restartBtn">⟲ 처음</button>
      <button id="followBtn">🔍 공 따라가기</button>
      <button id="trailBtn" class="active">✦ 선수 잔상</button>
      <button id="highlightBtn" class="active">🎬 하이라이트</button>
      <span class="sp">수동배속</span>
      <button data-speed="0.25">0.25x</button>
      <button data-speed="0.5">0.5x</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
    </div>
    <div class="controls">
      <button id="prevShot">◀ 이전 슛</button>
      <button id="nextShot">다음 슛 ▶</button>
      <button id="prevGoal">◀ 이전 골</button>
      <button id="nextGoal">다음 골 ▶</button>
      <input id="scrub" type="range" min="0" max="100" value="0" step="0.01" />
    </div>
    <div id="ticker"></div>
    <div id="status">match-log.json 로딩 중…</div>
    <input type="file" id="fileInput" accept="application/json" title="match-log.json 직접 불러오기" />

    <script>
      // ===== 완전 자기완결 vanilla JS. 외부 CDN 없음. =====
      const PITCH_W = 105, PITCH_H = 68, MARGIN = 20;
      const FOLLOW_ZOOM = 2.6;                 // 공 따라가기 확대율
      const BALL_TRAIL = 22, PLAYER_TRAIL = 10; // 잔상 길이(틱)
      const TICKS_PER_SEC = 2;                  // 1x = 2 게임초/실초 (거의 실시간, 공이 눈에 따라감)
      const CRUISE_SPEED = 4, HL_SPEED = 1, HL_WINDOW = 8; // 하이라이트 자동페이싱: 빌드업 4x → 찬스 근처 1x

      const canvas = document.getElementById("pitch");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const scoreEl = document.getElementById("score");
      const minuteEl = document.getElementById("minute");
      const tickerEl = document.getElementById("ticker");
      const scrub = document.getElementById("scrub");
      const playBtn = document.getElementById("playBtn");
      const flashEl = document.getElementById("flash");
      const bannerEl = document.getElementById("banner");

      let log = null, snaps = [], playing = false, speed = 1, tickPos = 0, lastTs = 0;
      let follow = false, showTrail = true, autoPace = true, keyTicks = [], confetti = [];
      let annos = [], snapByTick = new Map();
      let stoppages = [], hold = null; // 데드볼: freeze→skip 시퀀스
      const TOAST_TICKS = 5, BANNER_TICKS = 16, TELEPORT_CUT = 14;
      const idxOfTick = (tick) => { const i = snaps.findIndex((s) => s.tick >= tick); return i < 0 ? snaps.length - 1 : i; };
      const baseScale = (canvas.width - 2 * MARGIN) / PITCH_W;
      let cam = { cx: PITCH_W / 2, cy: PITCH_H / 2, zoom: 1 };

      function sx(x) { return canvas.width / 2 + (x - cam.cx) * baseScale * cam.zoom; }
      function sy(y) { return canvas.height / 2 + (y - cam.cy) * baseScale * cam.zoom; }
      const lerp = (a, b, t) => a + (b - a) * t;

      function drawPitch() {
        ctx.fillStyle = "#14532d"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255,255,255,0.035)";
        const stripes = 12, sw = PITCH_W / stripes;
        for (let i = 0; i < stripes; i += 2) ctx.fillRect(sx(i * sw), sy(0), sx((i + 1) * sw) - sx(i * sw), sy(PITCH_H) - sy(0));
        ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
        ctx.strokeRect(sx(0), sy(0), sx(PITCH_W) - sx(0), sy(PITCH_H) - sy(0));
        ctx.beginPath(); ctx.moveTo(sx(PITCH_W / 2), sy(0)); ctx.lineTo(sx(PITCH_W / 2), sy(PITCH_H)); ctx.stroke();
        ctx.beginPath(); ctx.arc(sx(PITCH_W / 2), sy(PITCH_H / 2), (sx(9.15) - sx(0)), 0, Math.PI * 2); ctx.stroke();
        const boxD = 16.5, boxW = 40.3, gy0 = (PITCH_H - boxW) / 2;
        ctx.strokeRect(sx(0), sy(gy0), sx(boxD) - sx(0), sy(gy0 + boxW) - sy(gy0));
        ctx.strokeRect(sx(PITCH_W - boxD), sy(gy0), sx(PITCH_W) - sx(PITCH_W - boxD), sy(gy0 + boxW) - sy(gy0));
        const g0 = (PITCH_H - 7.32) / 2;
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fillRect(sx(0) - 5, sy(g0), 5, sy(g0 + 7.32) - sy(g0));
        ctx.fillRect(sx(PITCH_W), sy(g0), 5, sy(g0 + 7.32) - sy(g0));
      }

      function draw() {
        if (snaps.length === 0) { drawPitch(); return; }
        const i = Math.min(Math.floor(tickPos), snaps.length - 1);
        const j = Math.min(i + 1, snaps.length - 1);
        const t = tickPos - i;
        const A = snaps[i], B = snaps[j];
        // 데드볼 재배치 등 공이 크게 튀는 구간은 보간 안 함(미끄러지는 궤적 illusion 제거).
        const bt = Math.hypot(B.ball.x - A.ball.x, B.ball.y - A.ball.y) > TELEPORT_CUT ? 0 : t;
        const bx = lerp(A.ball.x, B.ball.x, bt), by = lerp(A.ball.y, B.ball.y, bt);

        // 카메라: 수동 공따라가기 OR 하이라이트(찬스/골) 근처면 자동 줌인
        const curTick = A.tick;
        const nearKey = autoPace && keyTicks.some((kt) => Math.abs(kt - curTick) <= HL_WINDOW);
        const useFollow = follow || nearKey;
        cam = useFollow ? { cx: bx, cy: by, zoom: FOLLOW_ZOOM } : { cx: PITCH_W / 2, cy: PITCH_H / 2, zoom: 1 };
        drawPitch();

        // 선수 잔상(옵션)
        if (showTrail) {
          for (let s = Math.max(0, i - PLAYER_TRAIL); s < i; s++) {
            const a = (s - (i - PLAYER_TRAIL)) / PLAYER_TRAIL * 0.18;
            for (const p of snaps[s].players) {
              ctx.beginPath(); ctx.arc(sx(p.pos.x), sy(p.pos.y), 3, 0, Math.PI * 2);
              ctx.fillStyle = p.team === "home" ? `rgba(59,130,246,${a})` : `rgba(239,68,68,${a})`; ctx.fill();
            }
          }
        }
        // 공 궤적 (공 색과 맞춰 노랑)
        ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,230,0,0.45)"; ctx.beginPath();
        let started = false;
        for (let s = Math.max(0, i - BALL_TRAIL); s <= i; s++) {
          const p = sx(snaps[s].ball.x), q = sy(snaps[s].ball.y);
          // 순간이동(데드볼 재배치)에서는 궤적선을 끊는다.
          const teleport = s > 0 && Math.hypot(snaps[s].ball.x - snaps[s - 1].ball.x, snaps[s].ball.y - snaps[s - 1].ball.y) > TELEPORT_CUT;
          if (!started || teleport) { ctx.moveTo(p, q); started = true; } else ctx.lineTo(p, q);
        }
        ctx.stroke();

        // 선수 (실제 대비 비율감 위해 마커 축소). 번호는 외곽선으로 항상 읽히게.
        const R = useFollow ? 11 : 8;
        const fs = useFollow ? 12 : 9;
        ctx.font = `bold ${fs}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        let ownerDraw = null;
        const drawNum = (num, px, py) => {
          ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.strokeText(num, px, py);
          ctx.fillStyle = "#fff"; ctx.fillText(num, px, py);
        };
        for (let k = 0; k < A.players.length; k++) {
          const pa = A.players[k], pb = B.players[k] || pa;
          const x = lerp(pa.pos.x, pb.pos.x, t), y = lerp(pa.pos.y, pb.pos.y, t);
          const isHome = pa.team === "home", owner = A.ballOwner === pa.playerId;
          const px = sx(x), py = sy(y);
          ctx.beginPath(); ctx.arc(px, py, owner ? R + 2 : R, 0, Math.PI * 2);
          ctx.fillStyle = isHome ? "#3b82f6" : "#ef4444"; ctx.fill();
          if (owner) { ctx.strokeStyle = "#fde047"; ctx.lineWidth = 3; ctx.stroke(); }
          const num = pa.playerId.replace(/[HA]/, "");
          if (owner) ownerDraw = { num, px, py }; else drawNum(num, px, py);
        }
        // 공 (밝은 노랑 + 글로우). 소유자면 발 아래로 살짝 오프셋해 번호를 안 가림.
        const br = useFollow ? 7 : 5.5;
        const boy = ownerDraw ? R + br + 1 : 0; // 소유 시 공을 아래로
        ctx.save();
        ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(sx(bx), sy(by) + boy, br, 0, Math.PI * 2);
        ctx.fillStyle = "#ffe600"; ctx.fill();
        ctx.shadowBlur = 0; ctx.lineWidth = 1.5; ctx.strokeStyle = "#6b5200"; ctx.stroke();
        ctx.restore();
        // 소유자 번호는 공 위에 다시 그려 항상 보이게.
        if (ownerDraw) { ctx.font = `bold ${fs}px monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; drawNum(ownerDraw.num, ownerDraw.px, ownerDraw.py); }

        // 골 세리머니 색종이
        if (confetti.length) {
          for (const c of confetti) { c.x += c.vx; c.y += c.vy; c.vy += 0.16; c.life -= 0.012; }
          confetti = confetti.filter((c) => c.life > 0);
          for (const c of confetti) { ctx.globalAlpha = Math.max(0, c.life); ctx.fillStyle = c.col; ctx.fillRect(c.x, c.y, 4, 4); }
          ctx.globalAlpha = 1;
        }

        // 상황 배너 + 액션 토스트
        drawAnnos(A.tick);
        updateHud(A);
      }

      // 이벤트 → 상황배너/액션토스트 주석 빌드.
      function buildAnnos() {
        snapByTick = new Map(snaps.map((s) => [s.tick, s]));
        annos = [];
        const ev = log.events;
        for (const e of ev) e._k = e.type === "kickoff" ? (e.detail || "kickoff") : (e.type === "shot" && e.detail ? "shot_" + e.detail : e.type);
        const back = (tick, kinds, span) => ev.find((e) => kinds.includes(e._k) && e.tick <= tick && e.tick >= tick - span);
        for (const e of ev) {
          const k = e._k;
          const T = (text, col) => annos.push({ kind: "toast", tick: e.tick, at: e.tick, text, col });
          const B = (text, col) => annos.push({ kind: "banner", tick: e.tick, text, col });
          if (k === "shot") T("슛!", "#fbbf24");
          else if (k === "shot_one_on_one") T("1:1 찬스!", "#fbbf24");
          else if (k === "save") T("🧤 선방!", "#38bdf8");
          else if (k === "shot_off_target") T("빗나감", "#94a3b8");
          else if (k === "tackle") T("태클", "#cbd5e1");
          else if (k === "interception") T("차단", "#cbd5e1");
          else if (k === "foul") { T("파울", "#fb923c"); B("😠 파울 → 프리킥", "#fb923c"); }
          else if (k === "card") T(e.detail === "red" ? "🟥 레드!" : "🟨 옐로", e.detail === "red" ? "#ef4444" : "#fde047");
          else if (k === "offside") B("🚩 오프사이드", "#f59e0b");
          else if (k === "penalty") B("⚽ 페널티킥!", "#22c55e");
          else if (k === "corner") B("코너킥", "#e7edf6");
          else if (k === "goal_kick") B("골킥", "#e7edf6");
          else if (k === "throw_in") B("스로인", "#e7edf6");
          else if (k === "free_kick") B("프리킥", "#e7edf6");
          else if (k === "kickoff" && e.minute > 0) B("▶ 킥오프", "#e7edf6");
        }
        // 돌파(롱 드리블) 추론: 같은 소유자 유지 + 전진.
        let start = 0;
        for (let i = 1; i <= snaps.length; i++) {
          const prevO = snaps[i - 1] ? snaps[i - 1].ballOwner : null;
          const curO = snaps[i] ? snaps[i].ballOwner : null;
          if (curO !== prevO || i === snaps.length) {
            const run = i - start;
            if (prevO && run >= 6) {
              const a = snaps[start].ball, b = snaps[i - 1].ball;
              const fwd = prevO[0] === "H" ? b.x - a.x : a.x - b.x;
              const mid = snaps[start + Math.floor(run / 2)];
              if (fwd >= 9 && mid) annos.push({ kind: "toast", tick: mid.tick, at: mid.tick, text: "돌파!", col: "#a78bfa" });
            }
            start = i;
          }
        }
        // 데드볼 정지 시퀀스: 원인 이벤트에서 큰 자막 + freeze → 재시작으로 skip.
        stoppages = [];
        const CAUSE = {
          save: { big: "🧤 선방!", col: "#38bdf8", hold: 1300 },
          shot_off_target: { big: "빗나감!", col: "#94a3b8", hold: 1100 },
          foul: { big: "😠 파울!", col: "#fb923c", hold: 1100 },
          offside: { big: "🚩 오프사이드!", col: "#f59e0b", hold: 1300 },
          penalty: { big: "⚽ 페널티킥!", col: "#22c55e", hold: 1500 },
        };
        const RESTART = ["corner", "goal_kick", "throw_in", "free_kick", "kickoff"];
        for (let i = 0; i < ev.length; i++) {
          const c = CAUSE[ev[i]._k];
          if (!c) continue;
          let restartTick = ev[i].tick + 6;
          for (let j = i + 1; j < ev.length && ev[j].tick <= ev[i].tick + 45; j++) {
            if (RESTART.includes(ev[j]._k)) { restartTick = ev[j].tick; break; }
          }
          stoppages.push({ causeTick: ev[i].tick, restartTick, big: c.big, bigCol: c.col, hold: c.hold, done: false });
        }
      }

      function drawAnnos(curTick) {
        let banner = null;
        for (const a of annos) if (a.kind === "banner" && curTick >= a.tick && curTick <= a.tick + BANNER_TICKS) banner = a;
        if (banner) { bannerEl.textContent = banner.text; bannerEl.style.color = banner.col; bannerEl.classList.add("show"); }
        else bannerEl.classList.remove("show");
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "bold 15px sans-serif";
        for (const a of annos) {
          if (a.kind !== "toast") continue;
          const age = curTick - a.tick;
          if (age < 0 || age > TOAST_TICKS) continue;
          const s = snapByTick.get(a.at); if (!s) continue;
          const prog = age / TOAST_TICKS;
          const px = sx(s.ball.x), py = sy(s.ball.y) - 18 - prog * 22;
          ctx.globalAlpha = 1 - prog;
          ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.strokeText(a.text, px, py);
          ctx.fillStyle = a.col; ctx.fillText(a.text, px, py);
          ctx.globalAlpha = 1;
        }
      }

      function scoreAt(tick) {
        let h = 0, a = 0;
        for (const e of log.events) if (e.type === "goal" && e.tick <= tick) (e.team === "home" ? h++ : a++);
        return { h, a };
      }
      let lastGoalShown = -1;
      function bigCaption(text, col, withConfetti) {
        flashEl.textContent = text; flashEl.style.color = col;
        flashEl.classList.remove("show"); void flashEl.offsetWidth; flashEl.classList.add("show");
        if (withConfetti) {
          const cols = ["#22c55e", "#fde047", "#3b82f6", "#ef4444", "#ffffff"];
          for (let n = 0; n < 90; n++) {
            const ang = Math.random() * Math.PI * 2, spd = 2 + Math.random() * 7;
            confetti.push({ x: canvas.width / 2, y: canvas.height / 2, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 3, life: 1, col: cols[n % cols.length] });
          }
        }
      }
      function celebrate() { bigCaption("⚽ GOAL!", "#22c55e", true); }
      function updateHud(snap) {
        const s = scoreAt(snap.tick);
        scoreEl.textContent = `${s.h} : ${s.a}`;
        minuteEl.textContent = `${snap.minute}'`;
        scrub.value = ((tickPos / (snaps.length - 1)) * 100).toFixed(2);
        const totalGoals = s.h + s.a;
        if (totalGoals > lastGoalShown && lastGoalShown >= 0) celebrate();
        lastGoalShown = totalGoals;
      }

      const EV_LABEL = {
        goal: "⚽ 골", shot: "슛", tackle: "태클", interception: "인터셉트",
        foul: "파울", offside: "🚩 오프사이드", free_kick: "프리킥",
        penalty: "⚽ 페널티!", save: "🧤 세이브", card: "카드",
        half_whistle: "전반 종료", full_whistle: "경기 종료",
      };
      function renderTicker() {
        tickerEl.innerHTML = log.events
          .filter((e) => ["goal", "shot", "tackle", "interception", "kickoff", "foul", "offside", "free_kick", "penalty", "card", "save", "half_whistle", "full_whistle"].includes(e.type))
          // 세트피스(코너/스로인/골킥)는 type=kickoff + detail 로 표기됨.
          .filter((e) => !(e.type === "kickoff" && e.detail == null && e.minute > 0))
          .map((e) => {
            const who = e.playerId ? ` ${e.playerId}` : "";
            const xg = e.xg != null ? ` (xG ${e.xg.toFixed(2)})` : "";
            let label;
            if (e.type === "kickoff") label = e.detail || "kickoff";
            else if (e.type === "card") label = e.detail === "red" ? "🟥 레드카드" : "🟨 옐로카드";
            else if (e.type === "shot" && e.detail) label = `슛 (${e.detail})`;
            else if (e.type === "free_kick" && e.detail) label = `프리킥 (${e.detail})`;
            else label = EV_LABEL[e.type] || e.type;
            return `<div class="ev-${e.type}" data-tick="${e.tick}" style="cursor:pointer">${e.minute}' · ${label}${who}${e.team ? " [" + e.team + "]" : ""}${xg}</div>`;
          }).join("");
        tickerEl.querySelectorAll("[data-tick]").forEach((el) => el.onclick = () => jumpToTick(+el.dataset.tick));
      }

      function tickLoop(ts) {
        if (!lastTs) lastTs = ts;
        const dt = (ts - lastTs) / 1000; lastTs = ts;
        if (hold) {
          // 데드볼 정지: 큰 자막 유지하며 freeze. 시간 지나면 재시작으로 skip.
          if (ts < hold.until) { draw(); requestAnimationFrame(tickLoop); return; }
          tickPos = hold.jumpTo; hold = null;
        }
        if (playing && snaps.length > 1) {
          const beforeTick = snaps[Math.min(Math.floor(tickPos), snaps.length - 1)].tick;
          const nearKey = autoPace && keyTicks.some((kt) => Math.abs(kt - beforeTick) <= HL_WINDOW);
          const eff = autoPace ? (nearKey ? HL_SPEED : CRUISE_SPEED) : speed;
          tickPos += dt * TICKS_PER_SEC * eff;
          if (tickPos >= snaps.length - 1) { tickPos = snaps.length - 1; setPlaying(false); }
          const afterTick = snaps[Math.min(Math.floor(tickPos), snaps.length - 1)].tick;
          for (const st of stoppages) {
            if (!st.done && st.causeTick > beforeTick && st.causeTick <= afterTick) {
              st.done = true;
              tickPos = idxOfTick(st.causeTick); // 원인 프레임에서 멈춤
              bigCaption(st.big, st.bigCol, false); // 큰 자막
              hold = { until: ts + st.hold, jumpTo: idxOfTick(st.restartTick) }; // freeze 후 재시작으로 skip
              break;
            }
          }
        }
        draw();
        requestAnimationFrame(tickLoop);
      }
      function resetStops() { stoppages.forEach((s) => (s.done = false)); hold = null; }
      function setPlaying(p) { playing = p; playBtn.textContent = p ? "⏸ 일시정지" : "▶ 재생"; }
      function jumpToTick(tick) {
        const idx = snaps.findIndex((s) => s.tick >= tick);
        tickPos = idx < 0 ? snaps.length - 1 : Math.max(0, idx - 3);
        lastGoalShown = scoreAt(snaps[Math.floor(tickPos)].tick).h + scoreAt(snaps[Math.floor(tickPos)].tick).a;
        resetStops();
        draw();
      }
      function jumpEvent(type, dir) {
        const curTick = snaps[Math.min(Math.floor(tickPos), snaps.length - 1)].tick;
        const evs = log.events.filter((e) => e.type === type).map((e) => e.tick);
        const target = dir > 0 ? evs.find((t) => t > curTick + 2) : [...evs].reverse().find((t) => t < curTick - 2);
        if (target != null) jumpToTick(target);
      }

      playBtn.onclick = () => { if (tickPos >= snaps.length - 1) { tickPos = 0; resetStops(); } setPlaying(!playing); };
      document.getElementById("restartBtn").onclick = () => { tickPos = 0; lastGoalShown = 0; resetStops(); draw(); };
      const followBtn = document.getElementById("followBtn");
      followBtn.onclick = () => { follow = !follow; followBtn.classList.toggle("active", follow); draw(); };
      const trailBtn = document.getElementById("trailBtn");
      trailBtn.onclick = () => { showTrail = !showTrail; trailBtn.classList.toggle("active", showTrail); draw(); };
      const hlBtn = document.getElementById("highlightBtn");
      hlBtn.onclick = () => { autoPace = !autoPace; hlBtn.classList.toggle("active", autoPace); };
      document.getElementById("nextShot").onclick = () => jumpEvent("shot", 1);
      document.getElementById("prevShot").onclick = () => jumpEvent("shot", -1);
      document.getElementById("nextGoal").onclick = () => jumpEvent("goal", 1);
      document.getElementById("prevGoal").onclick = () => jumpEvent("goal", -1);
      document.querySelectorAll("[data-speed]").forEach((b) => b.onclick = () => {
        speed = parseFloat(b.dataset.speed);
        document.querySelectorAll("[data-speed]").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
      });
      scrub.oninput = () => { tickPos = (parseFloat(scrub.value) / 100) * (snaps.length - 1); lastGoalShown = -1; resetStops(); draw(); };

      function loadLog(data) {
        log = data; snaps = data.tickSnapshots;
        // 골 + 모든 슛(유효슛 포함) + 페널티 근처에서 하이라이트(슬로우+자동 줌인).
        keyTicks = data.events.filter((e) => e.type === "goal" || e.type === "penalty" || (e.type === "shot" && e.detail !== "saved" && e.detail !== "off_target")).map((e) => e.tick);
        buildAnnos();
        renderTicker(); tickPos = 0; lastGoalShown = 0; setPlaying(true);
        statusEl.textContent = `로드 완료 · config ${data.configVersion} · seed ${data.seed} · ${snaps.length} ticks · 최종 ${data.finalScore.home}:${data.finalScore.away} · 팁: "공 따라가기" 켜고 "다음 슛"으로 점프해 보세요`;
      }

      if (window.__LOG__) {
        // 단일 파일(standalone) 모드: 데이터가 HTML 에 내장됨. 서버 불필요.
        loadLog(window.__LOG__);
      } else {
        fetch("./match-log.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(loadLog)
          .catch((err) => { statusEl.textContent = "match-log.json fetch 실패(" + err + "). 아래 파일 선택으로 열거나 standalone 파일을 여세요."; });
      }
      document.getElementById("fileInput").onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader(); reader.onload = () => loadLog(JSON.parse(reader.result)); reader.readAsText(f);
      };

      drawPitch(); requestAnimationFrame(tickLoop);
    </script>
  </body>
</html>
