<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMB Engine Debug Viewer</title>
    <style>
      :root {
        --bg: #0f1420; --panel: #1a2233; --ink: #e7edf6; --muted: #8ea0bd;
        --home: #3b82f6; --away: #ef4444; --accent: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg); color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px;
      }
      h1 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
      #scoreboard { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 700; }
      #scoreboard .home { color: var(--home); } #scoreboard .away { color: var(--away); }
      #minute { color: var(--muted); font-size: 14px; }
      /* F1(#100) 실시간 통계 HUD */
      #hud {
        width: 100%; max-width: 1040px; background: var(--panel); border-radius: 8px;
        padding: 10px 14px; display: flex; flex-direction: column; gap: 7px;
      }
      .hud-top { display: flex; align-items: center; gap: 10px; }
      .poss-val { font-size: 15px; font-weight: 800; min-width: 42px; }
      .poss-val.home { color: var(--home); text-align: right; } .poss-val.away { color: var(--away); }
      .poss-bar { flex: 1; height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: #0d1220; }
      .poss-bar i { background: var(--home); transition: width .25s ease; }
      .poss-bar b { background: var(--away); transition: width .25s ease; }
      .hud-caption { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: -4px; text-transform: uppercase; }
      #hudGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 22px; }
      @media (max-width: 640px) { #hudGrid { grid-template-columns: 1fr; } }
      .srow { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; column-gap: 8px; row-gap: 2px; }
      .srow .sv { font-size: 13px; font-weight: 700; }
      .srow .sv.h { text-align: right; color: #dbe6f7; } .srow .sv.a { text-align: left; color: #f7dede; }
      .srow .slbl { text-align: center; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
      .srow .sbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; overflow: hidden; display: flex; background: #0d1220; }
      .srow .sbar i { background: var(--home); transition: width .25s ease; }
      .srow .sbar b { background: var(--away); transition: width .25s ease; }
      .mom-wrap { display: flex; align-items: center; gap: 10px; }
      .mom-cap { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; min-width: 74px; }
      .mom-track { position: relative; flex: 1; height: 10px; border-radius: 5px; background: #0d1220; overflow: hidden; }
      .mom-track .mom-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #33415f; }
      .mom-track i { position: absolute; top: 0; bottom: 0; transition: left .3s ease, width .3s ease, background .3s ease; }
      #wrap { width: 100%; max-width: 1040px; position: relative; }
      canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #14532d; }
      #flash {
        position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center;
        padding-top: 10%; /* 골문(줌 시 화면 중앙)을 가리지 않게 위쪽에 표시 */
        font-size: 60px; font-weight: 900; color: var(--accent); text-shadow: 0 2px 24px #000, 0 0 40px var(--accent);
        opacity: 0; pointer-events: none; letter-spacing: 4px;
      }
      #flash.show { animation: goalPop 1.9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes goalPop {
        0% { opacity: 0; transform: scale(.3) rotate(-6deg); }
        12% { opacity: 1; transform: scale(1.25) rotate(3deg); }
        26% { transform: scale(.95) rotate(-1deg); }
        40% { transform: scale(1.05); } 82% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.1); }
      }
      #banner {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: rgba(10,14,22,.85); border: 1px solid #33415f;
        padding: 7px 18px; border-radius: 20px; font-size: 15px; font-weight: 800;
        white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none;
        text-shadow: 0 1px 6px #000;
      }
      #banner.show { opacity: 1; }
      /* 상황 카드(선방/빗나감/파울/오프사이드/PK) — 골(거대 중앙 팝)과 명확히 구분되는 중간 크기 안내. */
      #situation {
        position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
        background: rgba(10,14,22,.9); border: 2px solid currentColor;
        padding: 8px 22px; border-radius: 12px; font-size: 30px; font-weight: 800;
        white-space: nowrap; opacity: 0; pointer-events: none; text-shadow: 0 1px 8px #000;
      }
      #situation.show { animation: sitIn 1.3s ease forwards; }
      @keyframes sitIn {
        0% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
        12% { opacity: 1; transform: translateX(-50%) translateY(0); }
        82% { opacity: 1; } 100% { opacity: 0; }
      }
      .controls {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: var(--panel); padding: 10px 12px; border-radius: 8px; width: 100%; max-width: 1040px;
      }
      button {
        background: #26324a; color: var(--ink); border: 1px solid #33415f;
        border-radius: 6px; padding: 6px 11px; cursor: pointer; font-family: inherit; font-size: 13px;
      }
      button:hover { background: #33415f; }
      button.active { background: var(--accent); color: #04220f; border-color: var(--accent); }
      #scrubwrap { position: relative; flex: 1 1 240px; display: flex; align-items: center; }
      #scrub { width: 100%; }
      #marks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
      #marks .gm { position: absolute; width: 3px; height: 16px; transform: translate(-50%, -50%); border-radius: 2px; box-shadow: 0 0 3px #000; }
      #clock { color: var(--ink); font-size: 13px; font-weight: 700; min-width: 84px; text-align: right; }
      .sp { color: var(--muted); font-size: 12px; }
      #ticker {
        width: 100%; max-width: 1040px; height: 116px; overflow-y: auto;
        background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.55;
      }
      #ticker > div { cursor: pointer; border-radius: 4px; padding: 0 4px; }
      #ticker > div:hover { background: rgba(255,255,255,0.05); }
      .ev-goal { color: var(--accent); } .ev-shot { color: #fbbf24; }
      .ev-tackle, .ev-interception { color: var(--muted); }
      .ev-foul { color: #f59e0b; } .ev-offside { color: #a78bfa; }
      .ev-free_kick { color: #94a3b8; } .ev-penalty { color: #22c55e; }
      .ev-card { color: #eab308; } .ev-save { color: #38bdf8; }
      .ev-substitution { color: #34d399; }
      .ev-half_whistle, .ev-full_whistle { color: #cbd5e1; }
      /* F2(#100) 중요도별 타이포(FM 코멘터리): major=굵게·크게+좌측 강조선, minor=작게·흐리게. */
      .tier-major { font-size: 13.5px; font-weight: 800; border-left: 3px solid currentColor; margin: 2px 0; padding-left: 7px; }
      .tier-normal { font-size: 12px; font-weight: 500; }
      .tier-minor { font-size: 10.5px; opacity: 0.6; }
      .ev-min { color: var(--muted); font-weight: 400; }
      #status { color: var(--muted); font-size: 12px; min-height: 16px; }
      input[type="file"] { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>HMB TIER-B ENGINE · DEBUG VIEWER</h1>
    <div id="scoreboard">
      <span class="home" id="homeName">HOME</span>
      <span id="score">0 : 0</span>
      <span class="away" id="awayName">AWAY</span>
      <span id="minute">0'</span>
    </div>
    <div id="wrap">
      <canvas id="pitch" width="1050" height="680"></canvas>
      <div id="flash"></div>
      <div id="situation"></div>
      <div id="banner"></div>
    </div>
    <div class="controls">
      <button id="playBtn">▶ Play</button>
      <button id="restartBtn">⟲ Restart</button>
      <button id="followBtn">🔍 Follow ball</button>
      <button id="trailBtn" class="active">✦ Player trails</button>
      <button id="highlightBtn" class="active">🎬 Highlights</button>
      <button id="statsBtn" class="active">📊 Stats</button>
      <button id="skinBtn" style="display:none;">🎭 Skin</button>
      <span class="sp">View</span>
      <button id="viewAutoBtn" class="active">🎥 Auto</button>
      <button id="viewFixBtn">📌 Fix</button>
      <span id="fixZoomWrap" style="display:none; align-items:center; gap:6px;">
        <span class="sp">Zoom</span>
        <input id="fixZoom" type="range" min="1" max="3" step="0.1" value="1" style="width:110px;" title="Fix 뷰 화면크기(줌)" />
        <span id="fixZoomVal" class="sp">1.0×</span>
      </span>
      <span class="sp">Speed</span>
      <button data-speed="0.25">0.25x</button>
      <button data-speed="0.5">0.5x</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="4">4x</button>
    </div>
    <div class="controls">
      <button id="prevShot">◀ Prev shot</button>
      <button id="nextShot">Next shot ▶</button>
      <button id="prevGoal">◀ Prev goal</button>
      <button id="nextGoal">Next goal ▶</button>
      <div id="scrubwrap">
        <input id="scrub" type="range" min="0" max="100" value="0" step="0.01" />
        <div id="marks"></div>
      </div>
      <span id="clock">0' / 0'</span>
    </div>
    <!-- F1(#100): 실시간 경기 통계 HUD — 피치 아래 분석 영역(hero: 게임 장면 밑으로). 재생 중 현재 틱까지 누적 갱신. -->
    <div id="hud">
      <div class="hud-top">
        <span class="poss-val home" id="possH">50%</span>
        <div class="poss-bar"><i id="possFillH"></i><b id="possFillA"></b></div>
        <span class="poss-val away" id="possA">50%</span>
      </div>
      <div class="hud-caption">Possession</div>
      <div id="hudGrid"></div>
      <div class="mom-wrap">
        <span class="mom-cap">Momentum</span>
        <div class="mom-track"><span class="mom-mid"></span><i id="momFill"></i></div>
      </div>
    </div>
    <div id="ticker"></div>
    <div id="status">Loading match-log.json…</div>
    <input type="file" id="fileInput" accept="application/json" title="Load match-log.json directly" />

    <script type="module">
      // ===== QA 셸(dev-viewer) — 렌더 엔진은 @hmb/viewer-core 가 소유(SoT). 이 파일은 캔버스에
      // 아무것도 그리지 않는다(캔버스 2D 컨텍스트 호출 0). 코어를 마운트하고 DOM 크롬(스코어보드·HUD 그리드·
      // 티커·상황자막·타임라인·컨트롤)만 제공 + window.__viewer 훅을 노출한다(#169 S2). =====
      import { createViewer } from "../../viewer-core/src/viewer.impl.mjs";
      import { logLines } from "../../viewer-core/src/log-lines.impl.mjs";

      // DOM refs (모두 QA 셸 소유).
      const canvas = document.getElementById("pitch");
      const statusEl = document.getElementById("status");
      const scoreEl = document.getElementById("score");
      const minuteEl = document.getElementById("minute");
      const tickerEl = document.getElementById("ticker");
      const scrub = document.getElementById("scrub");
      const playBtn = document.getElementById("playBtn");
      const flashEl = document.getElementById("flash");
      const bannerEl = document.getElementById("banner");
      const situationEl = document.getElementById("situation");
      const marksEl = document.getElementById("marks");
      const clockEl = document.getElementById("clock");
      const possHEl = document.getElementById("possH"), possAEl = document.getElementById("possA");
      const possFillHEl = document.getElementById("possFillH"), possFillAEl = document.getElementById("possFillA");
      const hudGridEl = document.getElementById("hudGrid"), momFillEl = document.getElementById("momFill");

      const mmss = (t) => `${Math.floor(t / 60)}'${String(Math.floor(t % 60)).padStart(2, "0")}"`;
      const teamTag = (t) => (t ? (t === "home" ? "H" : "A") : "");

      // 티커: 코어의 logLines 투영(SoT)으로 렌더 — 인라인 중복 제거(#169 S2).
      function renderTicker(events) {
        tickerEl.innerHTML = logLines(events).map((ln) => {
          const who = ln.number ? ` <b>#${ln.number}</b>` : "";
          const tag = ln.team ? ` <span class="ev-min">[${teamTag(ln.team)}]</span>` : "";
          const xg = ln.xg ? ` <span class="ev-min">xG ${ln.xg}</span>` : "";
          const extra = ln.score ? ` <b>${ln.score}</b>` : "";
          return `<div class="ev-${ln.type} tier-${ln.tier}" data-tick="${ln.tick}"><span class="ev-min">${ln.minute}'</span> ${ln.label}${who}${extra}${tag}${xg}</div>`;
        }).join("");
        tickerEl.querySelectorAll("[data-tick]").forEach((el) => (el.onclick = () => viewer.jumpToTick(+el.dataset.tick)));
      }

      // 타임라인 이벤트 핀(타입별 색·높이, 클릭 점프). 골>PK>선방>유효슛>코너 순.
      function buildMarks(events, snapCount) {
        const PIN = {
          goal: (e) => ({ h: 16, w: 3, col: e.team === "home" ? "#3b82f6" : "#ef4444", z: 5, label: `${mmss(e.tick)} ${e.team} GOAL` }),
          penalty: () => ({ h: 14, w: 3, col: "#22c55e", z: 4, label: "PK" }),
          save: () => ({ h: 11, w: 2, col: "#38bdf8", z: 3, label: "Save" }),
          shot_on: () => ({ h: 8, w: 2, col: "#fbbf24", z: 2, label: "On target" }),
          corner: () => ({ h: 8, w: 2, col: "#94a3b8", z: 1, label: "Corner" }),
        };
        const pins = [];
        for (const e of events) {
          let kind = null;
          if (e.type === "goal") kind = "goal";
          else if (e.type === "penalty") kind = "penalty";
          else if (e.type === "save") kind = "save";
          else if (e.type === "shot" && e.detail !== "off_target") kind = "shot_on";
          else if (e.type === "kickoff" && e.detail === "corner") kind = "corner";
          if (!kind) continue;
          const p = PIN[kind](e);
          const pct = (viewer.hooks.idxOfTick(e.tick) / Math.max(1, snapCount - 1)) * 100;
          pins.push(`<div class="gm" data-tick="${e.tick}" style="left:${pct}%;width:${p.w}px;height:${p.h}px;background:${p.col};z-index:${p.z};cursor:pointer" title="${mmss(e.tick)} · ${p.label}"></div>`);
        }
        marksEl.innerHTML = pins.join("");
        marksEl.querySelectorAll("[data-tick]").forEach((el) => (el.onclick = () => viewer.jumpToTick(+el.dataset.tick)));
      }

      // HUD 그리드(#hudGrid) — 코어가 준 수치로 셸이 렌더(QA 계약: statsBtn/hudGrid).
      function renderHudGrid({ home: h, away: a, possHome, momentum }) {
        possHEl.textContent = possHome + "%"; possAEl.textContent = 100 - possHome + "%";
        possFillHEl.style.width = possHome + "%"; possFillAEl.style.width = 100 - possHome + "%";
        const rows = [
          ["Shots", h.shots, a.shots],
          ["On target", h.onTarget, a.onTarget],
          ["xG", h.xg.toFixed(2), a.xg.toFixed(2), h.xg, a.xg],
          ["Pass %", h.passPct + "%", a.passPct + "%", h.passPct, a.passPct],
          ["Corners", h.corners, a.corners],
          ["Fouls", h.fouls, a.fouls],
          ["Cards", `${h.yellow}/${h.red}`, `${a.yellow}/${a.red}`, h.yellow + h.red, a.yellow + a.red],
        ];
        hudGridEl.innerHTML = rows.map(([label, hv, av, hw, aw]) => {
          const hn = hw != null ? hw : parseFloat(hv) || 0, an = aw != null ? aw : parseFloat(av) || 0;
          const tot = hn + an, hp = tot > 0 ? (hn / tot) * 100 : 50;
          return `<div class="srow"><span class="sv h">${hv}</span><span class="slbl">${label}</span><span class="sv a">${av}</span>` +
            `<div class="sbar"><i style="width:${hp.toFixed(1)}%"></i><b style="width:${(100 - hp).toFixed(1)}%"></b></div></div>`;
        }).join("");
        const m = momentum;
        const half = Math.min(1, Math.abs(m)) * 50;
        if (m >= 0) { momFillEl.style.left = 50 - half + "%"; momFillEl.style.background = "var(--home)"; }
        else { momFillEl.style.left = "50%"; momFillEl.style.background = "var(--away)"; }
        momFillEl.style.width = half + "%";
      }

      // 크롬 콜백 = 코어가 프레임/이벤트마다 호출하는 DOM 갱신 훅.
      const chrome = {
        onScore: (h, a) => { scoreEl.textContent = `${h} : ${a}`; },
        onMinute: (s) => { minuteEl.textContent = s; },
        onClock: (s) => { clockEl.textContent = s; },
        onScrub: (pct) => { scrub.value = pct.toFixed(2); },
        onHud: (data) => renderHudGrid(data),
        onBanner: (text, col) => {
          if (text != null) { bannerEl.textContent = text; bannerEl.style.color = col; bannerEl.classList.add("show"); }
          else bannerEl.classList.remove("show");
        },
        onBigCaption: (text, col) => {
          flashEl.textContent = text; flashEl.style.color = col;
          flashEl.classList.remove("show"); void flashEl.offsetWidth; flashEl.classList.add("show");
        },
        onSituation: (text, col) => {
          situationEl.textContent = text; situationEl.style.color = col;
          situationEl.classList.remove("show"); void situationEl.offsetWidth; situationEl.classList.add("show");
        },
        onClearCaptions: () => {
          flashEl.classList.remove("show"); situationEl.classList.remove("show"); bannerEl.classList.remove("show");
        },
        onPlaying: (p) => { playBtn.textContent = p ? "⏸ Pause" : "▶ Play"; },
        onLoaded: ({ events, snapCount, statusText }) => {
          renderTicker(events); buildMarks(events, snapCount); statusEl.textContent = statusText;
        },
        onStatus: (text) => { statusEl.textContent = text; },
      };

      const viewer = createViewer(canvas, chrome);

      // window.__viewer = 코어 읽기 훅 + captions(DOM 이라 셸 제공).
      window.__viewer = {
        ...viewer.hooks,
        captions: () => ({
          flash: getComputedStyle(flashEl).opacity !== "0" ? flashEl.textContent : "",
          situation: getComputedStyle(situationEl).opacity !== "0" ? situationEl.textContent : "",
          banner: bannerEl.classList.contains("show") ? bannerEl.textContent : "",
          score: scoreEl.textContent, minute: minuteEl.textContent,
        }),
      };

      // ===== 컨트롤 배선(버튼 → 코어) =====
      let follow = false, showTrail = true, autoPace = true;
      playBtn.onclick = () => viewer.togglePlay();
      document.getElementById("restartBtn").onclick = () => viewer.restart();
      const followBtn = document.getElementById("followBtn");
      followBtn.onclick = () => { follow = !follow; followBtn.classList.toggle("active", follow); viewer.setFollow(follow); };
      const trailBtn = document.getElementById("trailBtn");
      trailBtn.onclick = () => { showTrail = !showTrail; trailBtn.classList.toggle("active", showTrail); viewer.setTrail(showTrail); };
      const hlBtn = document.getElementById("highlightBtn");
      hlBtn.onclick = () => { autoPace = !autoPace; hlBtn.classList.toggle("active", autoPace); viewer.setAutoPace(autoPace); };

      // #114 Auto/Fix 뷰 모드 토글 + Fix 고정 줌 컨트롤(UI 는 셸, 카메라 로직은 코어).
      const viewAutoBtn = document.getElementById("viewAutoBtn");
      const viewFixBtn = document.getElementById("viewFixBtn");
      const fixZoomWrap = document.getElementById("fixZoomWrap");
      const fixZoomInput = document.getElementById("fixZoom");
      const fixZoomVal = document.getElementById("fixZoomVal");
      function setFixZoomUI(z) {
        const v = viewer.setFixZoom(z);
        fixZoomInput.value = String(v);
        fixZoomVal.textContent = v.toFixed(1) + "×";
      }
      function setViewModeUI(mode) {
        const fix = mode === "fix";
        viewer.setViewMode(mode);
        viewFixBtn.classList.toggle("active", fix);
        viewAutoBtn.classList.toggle("active", !fix);
        fixZoomWrap.style.display = fix ? "inline-flex" : "none";
        hlBtn.disabled = fix; followBtn.disabled = fix;
        hlBtn.style.opacity = fix ? "0.4" : ""; followBtn.style.opacity = fix ? "0.4" : "";
      }
      viewAutoBtn.onclick = () => setViewModeUI("auto");
      viewFixBtn.onclick = () => setViewModeUI("fix");
      fixZoomInput.oninput = () => setFixZoomUI(parseFloat(fixZoomInput.value));

      // 통계 HUD 온/오프 토글(순수 셸 — #hud display).
      const hudEl = document.getElementById("hud");
      const statsBtn = document.getElementById("statsBtn");
      let showStats = true;
      statsBtn.onclick = () => { showStats = !showStats; statsBtn.classList.toggle("active", showStats); hudEl.style.display = showStats ? "flex" : "none"; };

      // 캐릭터 스킨 토글(#169 S3) — 기본 off(엔진 디버그=단색 원). 켜면 게임화면과 같은 얼굴 스킨.
      // 스킨 페이로드(window.__SKIN__)는 build-standalone/build-test-viewer 가 임베드(에셋 있을 때만).
      const skinBtn = document.getElementById("skinBtn");
      const skinPayload = window.__SKIN__;
      if (skinPayload) {
        skinBtn.style.display = "";
        let skinOn = false;
        skinBtn.onclick = () => { skinOn = !skinOn; skinBtn.classList.toggle("active", skinOn); viewer.setSkin(skinOn ? skinPayload : null); };
      }

      document.getElementById("nextShot").onclick = () => viewer.jumpEvent("shot", 1);
      document.getElementById("prevShot").onclick = () => viewer.jumpEvent("shot", -1);
      document.getElementById("nextGoal").onclick = () => viewer.jumpEvent("goal", 1);
      document.getElementById("prevGoal").onclick = () => viewer.jumpEvent("goal", -1);
      document.querySelectorAll("[data-speed]").forEach((b) => (b.onclick = () => {
        viewer.setSpeed(b.dataset.speed);
        document.querySelectorAll("[data-speed]").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
      }));
      scrub.oninput = () => viewer.scrubTo(scrub.value);

      // ===== 로드 경로 =====
      // #65 소비 주입 계약: iframe 임베드 시 부모가 postMessage 로 MatchLog 주입.
      //   parent → iframe : {type:'loadMatchLog', matchLog}  → load(멱등 재초기화)
      //   iframe → parent : {type:'viewerReady'}
      const embedded = window.parent && window.parent !== window;
      window.addEventListener("message", (ev) => {
        const d = ev && ev.data;
        if (d && d.type === "loadMatchLog" && d.matchLog) {
          try { if (d.skins) viewer.setSkin(d.skins); viewer.load(d.matchLog); }
          catch (e) { statusEl.textContent = "Failed to load injected MatchLog: " + e; }
        }
      });
      if (window.__LOG__) {
        viewer.load(window.__LOG__);
      } else if (embedded) {
        statusEl.textContent = "Waiting for MatchLog injection from host…";
      } else {
        fetch("./match-log.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => viewer.load(d))
          .catch((err) => { statusEl.textContent = "match-log.json fetch failed (" + err + "). Use the file picker below or open the standalone file."; });
      }
      if (embedded) {
        const announceReady = () => { try { window.parent.postMessage({ type: "viewerReady" }, "*"); } catch (e) {} };
        announceReady();
        window.addEventListener("load", announceReady);
      }
      document.getElementById("fileInput").onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader(); reader.onload = () => viewer.load(JSON.parse(reader.result)); reader.readAsText(f);
      };

      viewer.start();
    </script>
  </body>
</html>
