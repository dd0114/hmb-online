<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>QA 콘솔 목업 v1 (#191)</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1c222b; --line:#2a323d;
    --ink:#e6ebf2; --dim:#93a0b1; --dimmer:#6b7787;
    --accent:#4da3ff; --ok:#3ecf8e; --warn:#f0b429; --bad:#ff6b6b; --pitch:#1c6b3a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  }
  .app{height:100vh;display:grid;grid-template-rows:auto 1fr}

  /* ── top bar ───────────────────────────── */
  .top{
    display:flex;align-items:center;gap:14px;padding:9px 14px;
    background:var(--panel);border-bottom:1px solid var(--line)
  }
  .brand{font-weight:700;letter-spacing:.2px}
  .brand small{color:var(--dimmer);font-weight:400;margin-left:6px}
  .counts{color:var(--dim);display:flex;gap:12px}
  .counts b{color:var(--ink)}
  .top .right{margin-left:auto;color:var(--dimmer);display:flex;gap:12px;align-items:center}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

  /* ── shell ─────────────────────────────── */
  .shell{display:grid;grid-template-columns:250px 1fr;min-height:0}
  .rail{
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:8px
  }
  .railHead{
    color:var(--dimmer);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 8px 4px
  }
  .tab{
    width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:inherit;font:inherit;border-radius:8px;padding:9px 10px;margin-bottom:3px;cursor:pointer
  }
  .tab:hover{background:var(--panel2)}
  .tab[aria-current="true"]{background:var(--panel2);border-color:#31435a}
  .tab .l1{display:flex;align-items:center;gap:7px}
  .tab .issue{color:var(--dim);font-variant-numeric:tabular-nums}
  .tab .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab .l2{display:flex;align-items:center;gap:7px;margin-top:4px;color:var(--dimmer);font-size:11px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.waiting{background:var(--accent)} .dot.resolved{background:var(--dimmer)}
  .dot.stale{background:var(--warn)} .dot.acked{background:var(--ok)}
  .badge{
    margin-left:auto;background:#2b3a4f;color:#cfe2ff;border-radius:9px;
    padding:0 6px;font-size:10.5px;font-weight:600
  }
  .badge.zero{background:transparent;color:var(--dimmer);font-weight:400}

  /* ── main ──────────────────────────────── */
  .main{display:grid;grid-template-rows:auto auto 1fr auto;min-height:0;min-width:0}
  .hd{padding:8px 16px 7px;border-bottom:1px solid var(--line)}
  .hd h1{margin:0;font-size:16px;display:flex;align-items:center;gap:9px}
  .chipState{
    font-size:11px;border:1px solid #31435a;border-radius:999px;padding:1px 9px;
    color:#cfe2ff;background:#22303f;font-weight:600
  }
  .meta{color:var(--dimmer);margin-top:3px;font-size:11px}
  .meta code{color:var(--dim);background:#12161c;padding:1px 5px;border-radius:4px}

  .brief{padding:7px 16px 8px;border-bottom:1px solid var(--line);display:grid;gap:4px}
  .row{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:start}
  .row .k{color:var(--dimmer);font-size:11.5px;padding-top:1px}
  .row .v{color:var(--ink)}
  .row .v.ask{color:#ffdca8}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:#202934;border:1px solid #31435a;color:#dbe7f5;border-radius:999px;
    padding:3px 10px;font:inherit;font-size:11.5px;cursor:pointer
  }
  .chip:hover{background:#2b3a4f}
  .chip b{font-variant-numeric:tabular-nums;color:#8fc4ff;margin-right:5px}

  .stage{display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:8px 16px 0;gap:6px}
  .views{display:flex;gap:6px;align-items:center}
  .view{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:4px 11px;font:inherit;font-size:11.5px;cursor:pointer
  }
  .view[aria-pressed="true"]{background:#22303f;border-color:#31435a;color:var(--ink);font-weight:600}
  .views .path{margin-left:auto;color:var(--dimmer);font-size:10.5px;font-family:ui-monospace,monospace}
  .canvasWrap{
    min-height:0;display:flex;align-items:center;justify-content:center;
    background:#0b0d11;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative
  }
  canvas{max-width:100%;max-height:100%;display:block}
  .coreTag{
    position:absolute;top:8px;left:10px;color:#7f8ea1;font-size:10.5px;
    background:#0b0d11cc;padding:2px 7px;border-radius:5px;border:1px solid #232b35
  }
  .ctrls{
    display:flex;align-items:center;gap:6px;padding:6px 0 7px;flex-wrap:wrap
  }
  .ctrls button{
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer
  }
  .ctrls button:hover{background:#25303d}
  .clock{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
    min-width:62px;text-align:center;color:#8fc4ff
  }
  .ctrls input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
  .ctrls .note{color:var(--dimmer);font-size:10.5px}

  /* ── feedback ──────────────────────────── */
  .fb{border-top:1px solid var(--line);background:var(--panel);padding:7px 16px 8px}
  .fbHead{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .fbHead .t{font-weight:600}
  .fbHead label{color:var(--dim);font-size:11.5px;display:flex;align-items:center;gap:5px;cursor:pointer}
  textarea{
    width:100%;min-height:36px;height:36px;resize:vertical;background:#11151b;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit
  }
  .acts{display:flex;gap:7px;margin-top:6px;align-items:center}
  .acts button{border:0;border-radius:7px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
  .approve{background:#1d5c42;color:#c6f4dd}
  .reject{background:#5c2020;color:#ffd2d2}
  .comment{background:#2b3a4f;color:#cfe2ff}
  .acts .hint{color:var(--dimmer);font-size:11px;margin-left:auto}

  .hist{margin-top:6px;border-top:1px solid var(--line);padding-top:5px}
  .hist[data-open="1"]{max-height:96px;overflow-y:auto}
  .histMore{background:transparent;border:0;color:var(--dim);font:inherit;font-size:11px;
    cursor:pointer;padding:2px 0;text-decoration:underline dotted}
  .fbItem{display:flex;gap:9px;padding:4px 0;font-size:11.5px;align-items:baseline}
  .fbItem .seq{color:var(--dimmer);font-variant-numeric:tabular-nums;min-width:22px}
  .fbItem .vd{font-weight:700;min-width:46px}
  .vd.approve{color:var(--ok)} .vd.reject{color:var(--bad)} .vd.comment{color:#8fc4ff}
  .fbItem .body{flex:1;color:var(--ink)}
  .fbItem .at{color:var(--dimmer);font-variant-numeric:tabular-nums}
  .ackTag{color:var(--ok);font-size:10.5px;white-space:nowrap}
  .ackTag.pending{color:var(--warn)}
  .empty{color:var(--dimmer);padding:6px 0;font-size:11.5px}
  .mockNote{color:#4a5563;font-size:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">HMB QA 콘솔 <small>127.0.0.1:8300/qa/console</small></div>
    <div class="counts">
      <span>탭 <b id="cTabs">0</b></span>
      <span>대기중 <b id="cWait">0</b></span>
      <span>내 확인 필요 <b id="cNeed">0</b></span>
    </div>
    <div class="right"><span class="mockNote">목업 v1 — 데이터 가짜·캔버스 정지 그림</span><span class="pulse"></span> 2초 자동갱신</div>
  </div>

  <div class="shell">
    <nav class="rail">
      <div class="railHead">세션 탭</div>
      <div id="rail"></div>
    </nav>

    <div class="main">
      <div class="hd">
        <h1><span id="hTitle"></span> <span class="chipState" id="hState"></span></h1>
        <div class="meta" id="hMeta"></div>
      </div>

      <div class="brief">
        <div class="row"><div class="k">무엇을 고쳤나</div><div class="v" id="bSummary"></div></div>
        <div class="row"><div class="k">봐줄 것</div><div class="v ask" id="bAsk"></div></div>
        <div class="row"><div class="k">확인 포인트</div><div class="chips" id="bPoints"></div></div>
      </div>

      <div class="stage">
        <div class="views" id="vViews"></div>
        <div class="canvasWrap">
          <span class="coreTag">viewer-core 직접 마운트 (packages/viewer-core)</span>
          <canvas id="pitch" width="1050" height="680"></canvas>
        </div>
        <div class="ctrls">
          <button title="처음으로">⏮</button>
          <button data-sec="-5">◀ 5s</button>
          <button data-sec="-1">◀ 1s</button>
          <button id="play">▶</button>
          <button data-sec="1">1s ▶</button>
          <button data-sec="5">5s ▶</button>
          <button title="마지막으로">⏭</button>
          <span class="clock" id="clock">0'00"</span>
          <input type="range" id="scrub" min="0" max="5400" value="0" />
          <button>0.1x</button><button>1x</button><button>4x</button>
          <span class="note">←/→ ∓1초 · Shift ∓5초 · , . 프레임 · Space (#180 재사용)</span>
        </div>
      </div>

      <div class="fb">
        <div class="fbHead">
          <span class="t">피드백</span>
          <label><input type="checkbox" id="attach" checked /> 지금 장면 첨부 <span id="attachWhat"></span></label>
        </div>
        <textarea id="body" placeholder="본 대로 적는다. 거부는 사유가 있어야 세션이 뭘 할지 안다."></textarea>
        <div class="acts">
          <button class="approve" data-vd="approve">✅ 승인</button>
          <button class="reject"  data-vd="reject">❌ 거부</button>
          <button class="comment" data-vd="comment">💬 코멘트</button>
          <span class="hint">→ <code>feedback/&lt;tab&gt;.jsonl</code> append · 세션의 <code>wait</code> 가 깨어난다</span>
        </div>
        <div class="hist" id="hist"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 가짜 레지스트리 (tabs/*.json 스키마와 같은 모양) ──────────────────
const TABS = [
  {
    tabId:"176-deadball-approach", issue:176, status:"waiting",
    title:"데드볼 접근 금지 규칙 + 정지 중 규칙기반 배치",
    session:"hmb:bug176", branch:"bug/176", checkout:"/Users/peter.park/spider6/hmb-online",
    updated:"3분 전",
    summary:"프리킥/스로인 정지 중에 상대가 공 옆까지 붙어 있었다. 접근 금지 반경(규칙) + 정지 중 규칙기반 배치로 물러나게 했다.",
    ask:"물러나는 모습이 '규칙 때문'으로 자연스럽게 보이나? 부자연스러운 미끄러짐 없나?",
    views:[{id:"after",label:"after (0.21.0)",path:"…/e2e/fixture-real.json"},
           {id:"before",label:"before (0.20.0)",path:"…/.qa/before-176.json"}],
    points:[{t:512,label:"프리킥 정지 — 수비 물러남"},{t:1874,label:"스로인 접근 금지"},{t:3120,label:"코너 배치"}],
    feedback:[
      {seq:1,at:"04:20",vd:"comment",body:"물러나는 건 되는데 두 명이 겹쳐서 한 명처럼 보인다",ack:"done"},
      {seq:2,at:"04:31",vd:"reject",body:"겹침 먼저 고쳐라",ack:"working"}
    ]
  },
  {
    tabId:"182-corner-stay", issue:182, status:"waiting",
    title:"코너 전원 전진 → 잔류 1~3명",
    session:"hmb:bug182", branch:"bug/182", checkout:"/Users/peter.park/spider12/hmb-online",
    updated:"1분 전",
    summary:"코너킥에서 11명 전원이 박스로 올라가 잔류 0명이었다. 팀축/선수축/롤백 3층 + 잔류 지터로 1~3명 잔류.",
    ask:"잔류 인원이 자연스러운가? 잔류 선수가 멍하니 서 있지 않은가?",
    views:[{id:"after",label:"after (fix)",path:"…/e2e/fixture-real.json"},
           {id:"before",label:"before (0.19.0)",path:"…/.qa/before-182.json"}],
    points:[{t:754,label:"첫 코너 — 잔류 확인"},{t:754,label:"같은 장면 before",view:"before"},{t:2042,label:"두 번째 코너"}],
    feedback:[]
  },
  {
    tabId:"181-ball-curve", issue:181, status:"resolved",
    title:"공이 빈 공간에서 스스로 휘는 현상",
    session:"hmb:bug181", branch:"bug/181", checkout:"/Users/peter.park/spider9/hmb-online",
    updated:"2시간 전",
    summary:"advanceBall 조기 도착 + giveBallTo 무제한 대입으로 마지막 틱이 점프했다. 정확 도착 + 리드패스 + controlRange 이전.",
    ask:"(완료) 승인 받음 — 꺾임 0 확인",
    views:[{id:"after",label:"after (0.19.0)",path:"…/e2e/fixture-real.json"}],
    points:[{t:93,label:"1'33\" 원 제보 장면"}],
    feedback:[{seq:1,at:"01:50",vd:"approve",body:"휨 안 보인다. 통과.",ack:"done"}]
  },
  {
    tabId:"188-fixture-freshness", issue:188, status:"stale",
    title:"픽스처 신선도 가드 — 낡은 픽스처 거짓 green",
    session:"hmb:qa188", branch:"qa/188", checkout:"/Users/peter.park/spider3/hmb-online",
    updated:"6시간 전",
    summary:"E2E 가 낡은 픽스처를 검증해 거짓 green 이 나던 구멍. 해시 가드 추가.",
    ask:"이건 화면 판정이 아니라 로그 확인 — 콘솔에선 설명만 읽고 승인 가능",
    views:[{id:"after",label:"after",path:"…/e2e/fixture-real.json"}],
    points:[],
    feedback:[{seq:1,at:"어제 22:10",vd:"comment",body:"가드가 실제로 낡은 걸 잡는지 변이체로 보여줘",ack:null}]
  }
];

let cur = TABS[1], curView = cur.views[0].id, tick = 754, histOpen = false;

const $ = (id)=>document.getElementById(id);
const mmss = (t)=>`${Math.floor(t/60)}'${String(t%60).padStart(2,"0")}"`;
const unread = (t)=>t.feedback.filter(f=>!f.ack).length;

function renderRail(){
  $("rail").innerHTML = TABS.map(t=>{
    const u = unread(t);
    const label = t.status==="stale" ? `stale 6h` : t.status==="resolved" ? "완료 ✓" : "대기중";
    return `<button class="tab" data-id="${t.tabId}" aria-current="${t===cur}">
      <span class="l1"><span class="dot ${t.status}"></span>
        <span class="issue">#${t.issue}</span>
        <span class="ttl">${t.title}</span></span>
      <span class="l2">${label}
        <span class="badge ${u?"":"zero"}">${u?`💬${u}`:"—"}</span></span>
    </button>`;
  }).join("");
  $("rail").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    cur = TABS.find(t=>t.tabId===b.dataset.id); curView = cur.views[0].id;
    tick = cur.points[0]?.t ?? 0; renderAll();
  });
  $("cTabs").textContent = TABS.length;
  $("cWait").textContent = TABS.filter(t=>t.status==="waiting").length;
  $("cNeed").textContent = TABS.filter(t=>t.status==="waiting"&&!t.feedback.length).length;
}

function renderTab(){
  $("hTitle").textContent = `#${cur.issue} ${cur.title}`;
  $("hState").textContent = cur.status==="resolved" ? "완료" : cur.status==="stale" ? "⚠ stale" : "대기중";
  $("hMeta").innerHTML = `<code>${cur.session}</code> · <code>${cur.branch}</code> · ${cur.checkout.replace("/Users/peter.park/","~/")} · ${cur.updated} 갱신`;
  $("bSummary").textContent = cur.summary;
  $("bAsk").textContent = cur.ask;
  $("bPoints").innerHTML = cur.points.length
    ? cur.points.map((p,i)=>`<button class="chip" data-i="${i}"><b>${mmss(p.t)}</b>${p.label}</button>`).join("")
    : `<span class="empty">확인 포인트 없음 — 세션이 <code>--point</code> 로 등록한다</span>`;
  $("bPoints").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const p = cur.points[b.dataset.i];
    tick = p.t; if(p.view) curView = p.view; renderAll();
  });
  $("vViews").innerHTML = cur.views.map(v=>
    `<button class="view" data-v="${v.id}" aria-pressed="${v.id===curView}">${v.label}</button>`).join("")
    + `<span class="path">${cur.views.find(v=>v.id===curView).path}</span>`;
  $("vViews").querySelectorAll(".view").forEach(b=>b.onclick=()=>{curView=b.dataset.v;renderAll();});

  // 이력은 최신 1건만 보이고 나머지는 접는다 — 세로 공간은 캔버스가 먹는 게 낫다(hero 지시).
  const list = cur.feedback.slice().reverse();
  const shown = histOpen ? list : list.slice(0,1);
  $("hist").dataset.open = histOpen ? "1" : "0";
  $("hist").innerHTML = (list.length ? shown.map(f=>`
    <div class="fbItem">
      <span class="seq">#${f.seq}</span><span class="at">${f.at}</span>
      <span class="vd ${f.vd}">${f.vd==="approve"?"✅승인":f.vd==="reject"?"❌거부":"💬코멘트"}</span>
      <span class="body">${f.body}</span>
      <span class="ackTag ${f.ack?"":"pending"}">${f.ack?`세션 수신 ✓ ${f.ack==="done"?"완료":"처리중"}`:"세션 미수신"}</span>
    </div>`).join("") : `<div class="empty">아직 피드백 없음 — 세션이 <code>wait</code> 로 대기 중이다</div>`)
    + (list.length>1 ? `<button class="histMore" id="histMore">${histOpen?"이력 접기 ▴":`이전 피드백 ${list.length-1}건 더 보기 ▾`}</button>` : "");
  const more = $("histMore");
  if (more) more.onclick = () => { histOpen = !histOpen; renderTab(); };
}

function renderClock(){
  $("clock").textContent = mmss(tick);
  $("scrub").value = tick;
  $("attachWhat").textContent = `(${curView} · ${mmss(tick)})`;
}

// 정지 그림 피치 — 실제로는 viewer-core 가 그린다
function renderPitch(){
  const c = $("pitch"), g = c.getContext("2d");
  const W=c.width,H=c.height,m=40;
  g.fillStyle="#123a22";g.fillRect(0,0,W,H);
  g.fillStyle="#1c6b3a";g.fillRect(m,m,W-2*m,H-2*m);
  g.strokeStyle="rgba(255,255,255,.5)";g.lineWidth=2;
  g.strokeRect(m,m,W-2*m,H-2*m);
  g.beginPath();g.moveTo(W/2,m);g.lineTo(W/2,H-m);g.stroke();
  g.beginPath();g.arc(W/2,H/2,72,0,7);g.stroke();
  g.strokeRect(m,H/2-150,150,300); g.strokeRect(W-m-150,H/2-150,150,300);
  // 코너 장면 흉내 — 오른쪽 코너에 공, 박스에 공격진, 하프라인에 잔류 2명
  const rnd=(s)=>((Math.sin(s*127.1)*43758.5453)%1+1)%1;
  const draw=(x,y,col,n)=>{g.beginPath();g.arc(x,y,11,0,7);g.fillStyle=col;g.fill();
    g.lineWidth=1.5;g.strokeStyle="rgba(0,0,0,.45)";g.stroke();
    g.fillStyle="#fff";g.font="bold 10px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(n,x,y);};
  for(let i=0;i<8;i++) draw(W-m-40-rnd(i)*140, H/2-140+rnd(i+9)*280, "#3b7dd8", i+2);       // 공격 8
  for(let i=0;i<7;i++) draw(W-m-30-rnd(i+3)*130, H/2-150+rnd(i+21)*300, "#d84f4f", i+2);    // 수비 7
  draw(W/2-90, H/2-60, "#3b7dd8", 6); draw(W/2-40, H/2+70, "#3b7dd8", 8);                    // 잔류 2 (fix)
  draw(W/2+30, H/2-30, "#d84f4f", 5);
  draw(m+40, H/2, "#ffd24d", 1); draw(W-m-14, H/2, "#ffd24d", 1);                            // GK
  g.beginPath();g.arc(W-m-4, m+4, 7, 0, 7);g.fillStyle="#fff";g.fill();                      // 공(코너)
  g.fillStyle="rgba(0,0,0,.55)";g.fillRect(W/2-96,H-m+6,192,22);
  g.fillStyle="#cfe2ff";g.font="12px sans-serif";g.fillText(`${curView} · ${mmss(tick)} · 코너킥`,W/2,H-m+18);
}

function renderAll(){renderRail();renderTab();renderClock();renderPitch();}

$("scrub").oninput = e => {tick=+e.target.value;renderClock();renderPitch();};
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
  tick=Math.max(0,Math.min(5400,tick+ +b.dataset.sec));renderClock();renderPitch();});
document.querySelectorAll(".acts button").forEach(b=>b.onclick=()=>{
  const body=$("body").value.trim();
  if(b.dataset.vd==="reject" && !body){alert("거부는 사유가 필요하다(세션이 뭘 할지 모른다).");return;}
  cur.feedback.push({seq:cur.feedback.length+1,at:"방금",vd:b.dataset.vd,
    body:body||"(내용 없음)"+($("attach").checked?` @${mmss(tick)}`:""),ack:null});
  $("body").value="";renderAll();
});
window.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const d = e.key==="ArrowLeft"?-(e.shiftKey?5:1):e.key==="ArrowRight"?(e.shiftKey?5:1):0;
  if(d){e.preventDefault();tick=Math.max(0,Math.min(5400,tick+d));renderClock();renderPitch();}
});
renderAll();
</script>
</body>
