<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>QA 콘솔 목업 v2 — 관전 우선 (#191)</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel2:#1c222b; --line:#2a323d;
    --ink:#e6ebf2; --dim:#93a0b1; --dimmer:#6b7787;
    --accent:#4da3ff; --ok:#3ecf8e; --warn:#f0b429; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  }
  .app{height:100vh;display:grid;grid-template-rows:auto 1fr}

  /* ── top bar ───────────────────────────── */
  .top{
    display:flex;align-items:center;gap:14px;padding:6px 14px;
    background:var(--panel);border-bottom:1px solid var(--line)
  }
  .brand{font-weight:700}
  .brand small{color:var(--dimmer);font-weight:400;margin-left:6px}
  .counts{color:var(--dim);display:flex;gap:12px}
  .counts b{color:var(--ink)}
  .top .right{margin-left:auto;color:var(--dimmer);display:flex;gap:10px;align-items:center;font-size:11px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

  /* ── shell: 좌 브리핑 레일 / 우 관전 ───────── */
  .shell{display:grid;grid-template-columns:302px 1fr;min-height:0}
  .rail{
    background:var(--panel);border-right:1px solid var(--line);
    display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0
  }
  .railHead{
    color:var(--dimmer);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 12px 4px
  }
  .tabs{padding:0 8px 8px;overflow-y:auto;max-height:34vh;border-bottom:1px solid var(--line)}
  .tab{
    width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:inherit;font:inherit;border-radius:8px;padding:7px 9px;margin-bottom:2px;cursor:pointer
  }
  .tab:hover{background:var(--panel2)}
  .tab[aria-current="true"]{background:var(--panel2);border-color:#31435a}
  .tab .l1{display:flex;align-items:center;gap:7px}
  .tab .issue{color:var(--dim);font-variant-numeric:tabular-nums}
  .tab .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .tab .l2{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--dimmer);font-size:10.5px}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .dot.waiting{background:var(--accent)} .dot.resolved{background:var(--dimmer)}
  .dot.stale{background:var(--warn)}
  .badge{
    margin-left:auto;background:#2b3a4f;color:#cfe2ff;border-radius:9px;
    padding:0 6px;font-size:10px;font-weight:600
  }
  .badge.zero{background:transparent;color:var(--dimmer);font-weight:400}

  /* 선택 탭 브리핑 = 레일 아래쪽. hero 는 여기를 읽고 오른쪽을 본다 */
  .brief{overflow-y:auto;padding:9px 12px 14px}
  .brief h2{margin:0 0 2px;font-size:13.5px;line-height:1.35}
  .brief .sub{color:var(--dimmer);font-size:10.5px;margin-bottom:9px}
  .brief .sub code{color:var(--dim);background:#12161c;padding:1px 4px;border-radius:4px}
  .k{color:var(--dimmer);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 3px}
  .v{font-size:12.5px}
  .v.ask{color:#ffdca8}
  .chips{display:flex;flex-direction:column;gap:4px}
  .chip{
    text-align:left;background:#202934;border:1px solid #31435a;color:#dbe7f5;border-radius:7px;
    padding:5px 9px;font:inherit;font-size:12px;cursor:pointer
  }
  .chip:hover{background:#2b3a4f}
  .chip b{font-variant-numeric:tabular-nums;color:#8fc4ff;margin-right:6px}
  .fbItem{display:grid;grid-template-columns:auto 1fr;gap:3px 7px;padding:6px 0;border-top:1px solid #222933;font-size:11.5px}
  .fbItem:first-of-type{border-top:0}
  .fbItem .vd{font-weight:700}
  .vd.approve{color:var(--ok)} .vd.reject{color:var(--bad)} .vd.comment{color:#8fc4ff}
  .fbItem .at{color:var(--dimmer);font-variant-numeric:tabular-nums}
  .fbItem .body{grid-column:1/-1;color:var(--ink)}
  .fbItem .ackTag{grid-column:1/-1;color:var(--ok);font-size:10.5px}
  .fbItem .ackTag.pending{color:var(--warn)}
  .empty{color:var(--dimmer);font-size:11.5px}

  /* ── main: 캔버스가 남은 높이를 전부 먹는다 ── */
  .main{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;min-width:0;padding:0 12px}
  .views{display:flex;gap:6px;align-items:center;padding:7px 2px 6px}
  .view{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;padding:3px 11px;font:inherit;font-size:11.5px;cursor:pointer
  }
  .view[aria-pressed="true"]{background:#22303f;border-color:#31435a;color:var(--ink);font-weight:600}
  .views .path{margin-left:auto;color:var(--dimmer);font-size:10.5px;font-family:ui-monospace,monospace}
  .canvasWrap{
    min-height:0;display:flex;align-items:center;justify-content:center;position:relative;
    background:#0b0d11;border:1px solid var(--line);border-radius:10px;overflow:hidden
  }
  canvas{max-width:100%;max-height:100%;display:block}
  .coreTag{
    position:absolute;top:7px;left:9px;color:#7f8ea1;font-size:10px;
    background:#0b0d11cc;padding:2px 7px;border-radius:5px;border:1px solid #232b35
  }
  .ctrls{display:flex;align-items:center;gap:5px;padding:7px 2px;flex-wrap:nowrap}
  .ctrls button{
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:3px 8px;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap
  }
  .ctrls button:hover{background:#25303d}
  .clock{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
    min-width:60px;text-align:center;color:#8fc4ff
  }
  .ctrls input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
  .ctrls .note{color:var(--dimmer);font-size:10px;white-space:nowrap}

  /* 피드백 = 한 줄 바 */
  .fbBar{
    display:flex;align-items:center;gap:7px;padding:7px 2px 9px;border-top:1px solid var(--line)
  }
  .fbBar .lbl{font-weight:600;font-size:12px;white-space:nowrap}
  .fbBar input[type=text]{
    flex:1;min-width:0;background:#11151b;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font:inherit
  }
  .fbBar label{color:var(--dim);font-size:10.5px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
  .fbBar button{border:0;border-radius:7px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .approve{background:#1d5c42;color:#c6f4dd}
  .reject{background:#5c2020;color:#ffd2d2}
  .comment{background:#2b3a4f;color:#cfe2ff}
  .fbBar .tagSep{color:var(--dimmer);font-size:10px;white-space:nowrap;margin-left:2px}
  .mockNote{color:#4a5563;font-size:10px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">HMB QA 콘솔 <small>127.0.0.1:8300/qa/console</small></div>
    <div class="counts">
      <span>탭 <b id="cTabs">0</b></span>
      <span>대기중 <b id="cWait">0</b></span>
      <span>내 확인 필요 <b id="cNeed">0</b></span>
    </div>
    <div class="right">
      <span class="mockNote">목업 v2(관전 우선) — 데이터 가짜·캔버스 정지 그림</span>
      <span class="pulse"></span> 2초 자동갱신
    </div>
  </div>

  <div class="shell">
    <nav class="rail">
      <div>
        <div class="railHead">세션 탭</div>
        <div class="tabs" id="rail"></div>
      </div>
      <div class="brief">
        <h2 id="bTitle"></h2>
        <div class="sub" id="bSub"></div>
        <div class="k">무엇을 고쳤나</div><div class="v" id="bSummary"></div>
        <div class="k">봐줄 것</div><div class="v ask" id="bAsk"></div>
        <div class="k">확인 포인트</div><div class="chips" id="bPoints"></div>
        <div class="k">피드백 이력</div><div id="bHist"></div>
      </div>
    </nav>

    <div class="main">
      <div class="views" id="vViews"></div>
      <div class="canvasWrap">
        <span class="coreTag">viewer-core 직접 마운트 (packages/viewer-core)</span>
        <canvas id="pitch" width="1050" height="680"></canvas>
      </div>
      <div class="ctrls">
        <button title="처음으로">⏮</button>
        <button data-sec="-5">◀ 5s</button>
        <button data-sec="-1">◀ 1s</button>
        <button id="play">▶</button>
        <button data-sec="1">1s ▶</button>
        <button data-sec="5">5s ▶</button>
        <button title="마지막으로">⏭</button>
        <span class="clock" id="clock">0'00"</span>
        <input type="range" id="scrub" min="0" max="5400" value="0" />
        <button>0.1x</button><button>1x</button><button>4x</button>
        <span class="note">←/→ ∓1초 · Shift ∓5초 · , . 프레임 · Space (#180 재사용)</span>
      </div>
      <div class="fbBar">
        <span class="lbl">세션에 전달</span>
        <input type="text" id="body" placeholder="적은 그대로 세션 프롬프트가 된다 — 예: 잔류는 되는데 3명이 GK 옆에 뭉쳐 있다" />
        <label><input type="checkbox" id="attach" checked /> 지금 장면 <span id="attachWhat"></span></label>
        <button class="comment" data-vd="comment" title="Enter 로도 전달">💬 전달 ⏎</button>
        <span class="tagSep">태그(선택)</span>
        <button class="approve" data-vd="approve" title="= 다음 단계 진행해라">✅ 승인</button>
        <button class="reject"  data-vd="reject"  title="= 고치고 다시 올려라(사유 필수)">❌ 거부</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── 가짜 레지스트리 (tabs/*.json 스키마와 같은 모양) ──────────────────
const TABS = [
  {
    tabId:"176-deadball-approach", issue:176, status:"waiting",
    title:"데드볼 접근 금지 규칙 + 정지 중 규칙기반 배치",
    session:"hmb:bug176", branch:"bug/176", checkout:"~/spider6/hmb-online", updated:"3분 전",
    summary:"프리킥/스로인 정지 중에 상대가 공 옆까지 붙어 있었다. 접근 금지 반경(규칙) + 정지 중 규칙기반 배치로 물러나게 했다.",
    ask:"물러나는 모습이 '규칙 때문'으로 자연스럽게 보이나? 부자연스러운 미끄러짐 없나?",
    views:[{id:"after",label:"after (0.21.0)",path:"…/e2e/fixture-real.json"},
           {id:"before",label:"before (0.20.0)",path:"…/.qa/before-176.json"}],
    points:[{t:512,label:"프리킥 정지 — 수비 물러남"},{t:1874,label:"스로인 접근 금지"},{t:3120,label:"코너 배치"}],
    feedback:[
      {seq:1,at:"04:20",vd:"comment",body:"물러나는 건 되는데 두 명이 겹쳐서 한 명처럼 보인다",ack:"done"},
      {seq:2,at:"04:31",vd:"reject",body:"겹침 먼저 고쳐라",ack:"working"}
    ]
  },
  {
    tabId:"182-corner-stay", issue:182, status:"waiting",
    title:"코너 전원 전진 → 잔류 1~3명",
    session:"hmb:bug182", branch:"bug/182", checkout:"~/spider12/hmb-online", updated:"1분 전",
    summary:"코너킥에서 11명 전원이 박스로 올라가 잔류 0명이었다. 팀축/선수축/롤백 3층 + 잔류 지터로 1~3명 잔류.",
    ask:"잔류 인원이 자연스러운가? 잔류 선수가 멍하니 서 있지 않은가?",
    views:[{id:"after",label:"after (fix)",path:"…/e2e/fixture-real.json"},
           {id:"before",label:"before (0.19.0)",path:"…/.qa/before-182.json"}],
    points:[{t:754,label:"첫 코너 — 잔류 확인"},{t:754,label:"같은 장면 before",view:"before"},{t:2042,label:"두 번째 코너"}],
    feedback:[]
  },
  {
    tabId:"181-ball-curve", issue:181, status:"resolved",
    title:"공이 빈 공간에서 스스로 휘는 현상",
    session:"hmb:bug181", branch:"bug/181", checkout:"~/spider9/hmb-online", updated:"2시간 전",
    summary:"advanceBall 조기 도착 + giveBallTo 무제한 대입으로 마지막 틱이 점프했다. 정확 도착 + 리드패스 + controlRange 이전.",
    ask:"(완료) 승인 받음 — 꺾임 0 확인",
    views:[{id:"after",label:"after (0.19.0)",path:"…/e2e/fixture-real.json"}],
    points:[{t:93,label:"1'33\" 원 제보 장면"}],
    feedback:[{seq:1,at:"01:50",vd:"approve",body:"휨 안 보인다. 통과.",ack:"done"}]
  },
  {
    tabId:"188-fixture-freshness", issue:188, status:"stale",
    title:"픽스처 신선도 가드 — 낡은 픽스처 거짓 green",
    session:"hmb:qa188", branch:"qa/188", checkout:"~/spider3/hmb-online", updated:"6시간 전",
    summary:"E2E 가 낡은 픽스처를 검증해 거짓 green 이 나던 구멍. 해시 가드 추가.",
    ask:"이건 화면 판정이 아니라 로그 확인 — 설명만 읽고 승인 가능",
    views:[{id:"after",label:"after",path:"…/e2e/fixture-real.json"}],
    points:[],
    feedback:[{seq:1,at:"어제 22:10",vd:"comment",body:"가드가 실제로 낡은 걸 잡는지 변이체로 보여줘",ack:null}]
  }
];

let cur = TABS[1], curView = cur.views[0].id, tick = 754;
const $ = (id)=>document.getElementById(id);
const mmss = (t)=>`${Math.floor(t/60)}'${String(t%60).padStart(2,"0")}"`;
const unread = (t)=>t.feedback.filter(f=>!f.ack).length;

function renderRail(){
  $("rail").innerHTML = TABS.map(t=>{
    const u = unread(t);
    const label = t.status==="stale" ? "stale 6h" : t.status==="resolved" ? "완료 ✓" : "대기중";
    return `<button class="tab" data-id="${t.tabId}" aria-current="${t===cur}">
      <span class="l1"><span class="dot ${t.status}"></span>
        <span class="issue">#${t.issue}</span><span class="ttl">${t.title}</span></span>
      <span class="l2">${label}<span class="badge ${u?"":"zero"}">${u?`💬${u}`:"—"}</span></span>
    </button>`;
  }).join("");
  $("rail").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    cur = TABS.find(t=>t.tabId===b.dataset.id); curView = cur.views[0].id;
    tick = cur.points[0]?.t ?? 0; renderAll();
  });
  $("cTabs").textContent = TABS.length;
  $("cWait").textContent = TABS.filter(t=>t.status==="waiting").length;
  $("cNeed").textContent = TABS.filter(t=>t.status==="waiting"&&!t.feedback.length).length;
}

function renderBrief(){
  $("bTitle").textContent = `#${cur.issue} ${cur.title}`;
  $("bSub").innerHTML = `<code>${cur.session}</code> · <code>${cur.branch}</code><br>${cur.checkout} · ${cur.updated} 갱신`;
  $("bSummary").textContent = cur.summary;
  $("bAsk").textContent = cur.ask;
  $("bPoints").innerHTML = cur.points.length
    ? cur.points.map((p,i)=>`<button class="chip" data-i="${i}"><b>${mmss(p.t)}</b>${p.label}</button>`).join("")
    : `<span class="empty">확인 포인트 없음 — 세션이 <code>--point</code> 로 등록한다</span>`;
  $("bPoints").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const p = cur.points[b.dataset.i]; tick = p.t; if(p.view) curView = p.view; renderAll();
  });
  $("bHist").innerHTML = cur.feedback.length ? cur.feedback.slice().reverse().map(f=>`
    <div class="fbItem">
      <span class="vd ${f.vd}">${f.vd==="approve"?"✅ 승인":f.vd==="reject"?"❌ 거부":"💬 전달"}</span>
      <span class="at">#${f.seq} ${f.at}</span>
      <span class="body">${f.body}</span>
      <span class="ackTag ${f.ack?"":"pending"}">${f.ack?`세션 수신 ✓ ${f.ack==="done"?"완료":"처리중"}`:"세션 미수신"}</span>
    </div>`).join("") : `<div class="empty">아직 없음 — 세션이 <code>wait</code> 로 대기 중이다</div>`;
  $("vViews").innerHTML = cur.views.map(v=>
    `<button class="view" data-v="${v.id}" aria-pressed="${v.id===curView}">${v.label}</button>`).join("")
    + `<span class="path">${cur.views.find(v=>v.id===curView).path}</span>`;
  $("vViews").querySelectorAll(".view").forEach(b=>b.onclick=()=>{curView=b.dataset.v;renderAll();});
}

function renderClock(){
  $("clock").textContent = mmss(tick);
  $("scrub").value = tick;
  $("attachWhat").textContent = `(${curView}·${mmss(tick)})`;
}

// 정지 그림 피치 — 실제로는 viewer-core 가 그린다
function renderPitch(){
  const c = $("pitch"), g = c.getContext("2d");
  const W=c.width,H=c.height,m=26;
  g.fillStyle="#123a22";g.fillRect(0,0,W,H);
  g.fillStyle="#1c6b3a";g.fillRect(m,m,W-2*m,H-2*m);
  g.strokeStyle="rgba(255,255,255,.5)";g.lineWidth=2;
  g.strokeRect(m,m,W-2*m,H-2*m);
  g.beginPath();g.moveTo(W/2,m);g.lineTo(W/2,H-m);g.stroke();
  g.beginPath();g.arc(W/2,H/2,74,0,7);g.stroke();
  g.strokeRect(m,H/2-155,152,310); g.strokeRect(W-m-152,H/2-155,152,310);
  const rnd=(s)=>((Math.sin(s*127.1)*43758.5453)%1+1)%1;
  const draw=(x,y,col,n)=>{g.beginPath();g.arc(x,y,12,0,7);g.fillStyle=col;g.fill();
    g.lineWidth=1.5;g.strokeStyle="rgba(0,0,0,.45)";g.stroke();
    g.fillStyle="#fff";g.font="bold 11px sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText(n,x,y);};
  for(let i=0;i<8;i++) draw(W-m-40-rnd(i)*140, H/2-140+rnd(i+9)*280, "#3b7dd8", i+2);
  for(let i=0;i<7;i++) draw(W-m-30-rnd(i+3)*130, H/2-150+rnd(i+21)*300, "#d84f4f", i+2);
  draw(W/2-90, H/2-60, "#3b7dd8", 6); draw(W/2-40, H/2+70, "#3b7dd8", 8);
  draw(W/2+30, H/2-30, "#d84f4f", 5);
  draw(m+40, H/2, "#ffd24d", 1); draw(W-m-14, H/2, "#ffd24d", 1);
  g.beginPath();g.arc(W-m-4, m+4, 7, 0, 7);g.fillStyle="#fff";g.fill();
  g.fillStyle="rgba(0,0,0,.55)";g.fillRect(W/2-100,H-m+4,200,20);
  g.fillStyle="#cfe2ff";g.font="12px sans-serif";g.fillText(`${curView} · ${mmss(tick)} · 코너킥`,W/2,H-m+14);
}

function renderAll(){renderRail();renderBrief();renderClock();renderPitch();}

$("scrub").oninput = e => {tick=+e.target.value;renderClock();renderPitch();};
document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{
  tick=Math.max(0,Math.min(5400,tick+ +b.dataset.sec));renderClock();renderPitch();});
document.querySelectorAll(".fbBar button").forEach(b=>b.onclick=()=>{
  const body=$("body").value.trim();
  if(b.dataset.vd==="reject" && !body){alert("거부는 사유가 필요하다(세션이 뭘 할지 모른다).");return;}
  cur.feedback.push({seq:cur.feedback.length+1,at:"방금",vd:b.dataset.vd,
    body:(body||"(내용 없음)")+($("attach").checked?` @${mmss(tick)}`:""),ack:null});
  $("body").value="";renderAll();
});
$("body").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();document.querySelector('.fbBar [data-vd="comment"]').click();}
});
window.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const d = e.key==="ArrowLeft"?-(e.shiftKey?5:1):e.key==="ArrowRight"?(e.shiftKey?5:1):0;
  if(d){e.preventDefault();tick=Math.max(0,Math.min(5400,tick+d));renderClock();renderPitch();}
});
renderAll();
</script>
</body>
</html>
