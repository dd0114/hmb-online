              $ref: "#/components/schemas/AiJobCompleteRequest"
      responses:
        "200":
          description: 반영됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJob"
        "400":
          $ref: "#/components/responses/ValidationError" # ok=true인데 output 누락
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
