      summary: 큐 깊이·lease 중 개수(운영 확인용) — /internal/** 전체가 X-Servant-Token 보호(W4, AC-Q3)
      security:
        - servantToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────── admin (P3 §C, additive) ─────────────────────────
  # /api/admin/** 전체가 AdminInterceptor 로 보호된다: 미인증 401, 인증됐지만 비admin 403(AC-C2).
  # admin 부여는 서버 부팅 시 env(HMB_ADMIN_NICKNAME/HMB_ADMIN_PASSWORD)로만 이뤄진다(P3-D4) —
  # 미설정 배포에는 admin 이 0명이다.
  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: 유저 목록·닉네임 검색·페이징(운영). 비밀번호는 어떤 필드로도 반환되지 않는다.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 닉네임 부분 일치. LIKE 와일드카드(%, _)는 리터럴로 취급된다.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: 유저 상태(지갑·보유 선수·활성 덱/프리셋 요약·전적)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── economy 무배포 운영 (#209 B안) — 재배포 없이 스타터 최상위 후보 교체 ──
  /api/admin/economy:
    get:
      tags: [admin]
      operationId: getAdminEconomy
      summary: |
        현재 유효한 economy 요약 + **출처**. 발행물은 이미지에 구워져 불변이라, 운영 변경은 쓰기 가능한
        볼륨의 override 파일로 이뤄진다 → 값만으로는 "반영됐나"에 답할 수 없어 source 를 함께 낸다.
        overrideApplied(=적용됨)와 overrideFilePresent(=파일 존재)는 **다른 사실**이다(거절된 파일이 남을 수 있다).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/history:
    get:
      tags: [admin]
      operationId: getAdminEconomyHistory
      summary: economy 운영 이력(감사 원장) — **성공과 실패 모두**. 거절된 시도도 남는다.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOpsAuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/reload:
    post:
      tags: [admin]
      operationId: reloadAdminEconomy
      summary: |
        디스크 재읽기(내용 변경 없음). **파싱만이 아니라 의미도 검증**한다 — 카탈로그에 없는 id 가
        든 파일을 그대로 실으면 이후 모든 가입이 FK 로 실패한다. 실패 시 400 + 직전 설정 유지.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: 운영 사유(필수 — 원장에 남는다) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/starter-top:
    put:
      tags: [admin]
      operationId: replaceStarterTop
      summary: |
        스타터 최상위 후보 교체 — 배포 없이 카드 조정의 실제 경로. 검증(카탈로그 실재·중복·기본팩
        겹침·count 범위)을 통과한 내용만 override 파일이 되고 즉시 반영된다. 사유 필수.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStarterTopRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/override:
    delete:
      tags: [admin]
      operationId: clearEconomyOverride
      summary: override 제거 = 배포 발행물로 롤백(원클릭). 지울 게 없으면 400.
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}/points:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      operationId: adminGrantPoints
      summary: |
        포인트 지급(delta>0)/차감(delta<0) — AC-C1. 지갑·point_ledger(reason='admin_grant')·
        admin_audit 세 곳이 **하나의 트랜잭션**으로 갱신된다. 음수 잔액은 허용되지 않는다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: |
            선택. 주면 같은 키의 재전송은 **중복 지급되지 않는다**(원장 유니크 인덱스로 보장,
            재전송 응답은 200 + applied=false). 주지 않으면 서버가 키를 채번하므로 재전송은
            별개의 지급으로 처리된다 — 운영 UI 는 항상 이 헤더를 보낼 것.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantPointsRequest"
      responses:
        "200":
          description: 적용됨(applied=true) 또는 멱등 재전송(applied=false, 상태 변화 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantPointsResult"
        "400":
          description: |
            delta 가 0/누락, reason 누락, 또는 차감 후 잔액이 음수가 되는 경우.
            code=VALIDATION_ERROR 또는 INSUFFICIENT_POINTS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            멱등키 충돌(같은 키가 이미 다른 지급에 쓰였다). code=CONFLICT.
            응답 본문에는 내부 SQL·스키마가 포함되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────────
  # 어드민 유닛 카탈로그 (#207 파트 A) — additive. 기존 경로·스키마 변경 0.
  #
  # 목적: 유닛 추가/수정/비활성화를 **배포 없이** 하고 모든 변경을 감사 원장에 남긴다.
  # 변경 계열은 공통으로:
  #   · 바디에 reason 필수(≤500자, 없으면 400)
  #   · Idempotency-Key 헤더 선택 — 같은 키 재전송은 200 + applied=false(감사 중복 0),
  #     같은 키 다른 내용은 409
  #   · players UPDATE + admin_catalog_audit INSERT + admin_locked=1 이 한 트랜잭션
  # 인증은 /api/admin/ 접두사 게이트가 일괄 담당한다(엔드포인트별 권한 선언 없음).
  # ─────────────────────────────────────────────────────────────────────────
  /api/admin/units:
    get:
      tags: [admin]
      operationId: adminListUnits
      summary: 유닛 목록(필터 q·grade·position·active + 페이징). 행마다 adminLocked·dataVersion 포함.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "id 또는 이름 부분일치(LIKE 와일드카드는 리터럴 처리)" }
        - { name: grade, in: query, required: false, schema: { $ref: "#/components/schemas/Grade" } }
        - { name: position, in: query, required: false, schema: { $ref: "#/components/schemas/Position" } }
        - { name: active, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: 유닛 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitPage" }
        "400":
          description: 알 수 없는 grade/position 등 파라미터 오류. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateUnit
      summary: |
        신규 유닛 추가. id 는 **서버가 채번**한다(기존 최대 P번호 + 1) — 기존 번호 재사용은
        user_players 가 그 id 를 가리키므로 기보유 카드의 의미를 바꾼다.
        생성된 행은 admin_locked=1 이라 부팅 재임포트가 덮지 않는다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: |
            선택. 생성 멱등의 스코프는 (action, idem_key) 로 **대상 무관**이다 — id 를 서버가
            채번하므로 대상별 스코프로는 재전송을 식별할 수 없고, 그러면 재전송마다 새 유닛이 생긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUnitCreateRequest" }
      responses:
        "200":
          description: 생성됨(applied=true) 또는 멱등 재전송(applied=false, 상태 변화 없음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400":
          description: reason 누락/초과, 열거값 오류, attributes 9종 누락·범위 밖. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 멱등키 충돌(같은 키가 이미 다른 내용에 쓰였다). code=CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/admin/units/audit:
    get:
      tags: [admin]
      operationId: adminUnitAudit
      summary: |
        카탈로그 변경 이력. before/after 는 **필드 diff 가 아니라 전체 스냅샷**이라
        한 행만으로 그 시점 상태를 복원할 수 있다.
      parameters:
        - { name: playerId, in: query, required: false, schema: { type: string } }
        - { name: actor, in: query, required: false, schema: { type: string }, description: "액션을 실행한 admin 의 userId" }
        - { name: action, in: query, required: false, schema: { $ref: "#/components/schemas/AdminUnitAuditAction" } }
        - { name: from, in: query, required: false, schema: { type: string }, description: "ISO-8601 UTC. created_at >= from" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "ISO-8601 UTC. created_at <= to" }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: 감사 이력 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitAuditPage" }
        "400":
          description: 알 수 없는 action. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/units/export:
    get:
      tags: [admin]
      operationId: adminExportUnits
      summary: |
        현재 카탈로그를 **시드 발행 포맷**(data/players/players.vX.json)으로 덤프.
        운영 흐름 = 어드민 API 로 확정 → export → data 도메인이 다음 시드 버전으로 승격 → 커밋.
        이게 없으면 개편이 그 DB 한 대에만 살고 새 배포·DB 리셋에 사라진다.
        런타임 전용 필드(adminLocked·dataVersion)는 덤프에 포함되지 않는다.
      responses:
        "200":
          description: 시드 형태 배열(id 오름차순)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUnitSeedEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/units/{playerId}:
    parameters:
      - name: playerId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      operationId: adminUnitDetail
      summary: 유닛 상세 + 보유 규모(영향 범위) + 최근 감사 이력
      responses:
        "200":
          description: 유닛 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateUnit
      summary: |
        부분 수정. attributes 는 **키 단위 병합**이다(전체 교체 아님) — 스탯 하나를 고치려고
        9종을 다시 적게 하면 나머지를 옮겨 적다가 틀린다.
        **등급 하향**은 기보유 카드의 유효스탯을 깎으므로(cap_i = base_i + starFrac[star]×(hi−base_i),
        성을 올린 카드일수록 크게) confirmImpact:true 없이는 409 로 거절되고, 실측 영향 규모가
        응답 detail 에 담긴다. 상향은 손실이 없으므로 확인이 필요 없다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUnitPatchRequest" }
      responses:
        "200":
          description: 적용됨(applied=true) 또는 멱등 재전송(applied=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400":
          description: reason 누락, 변경 필드 0, 열거값·능력치 오류. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            ① 등급 하향인데 confirmImpact 가 없다(detail = AdminUnitGradeImpact) 또는
            ② 멱등키 충돌. 둘 다 code=CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/admin/units/{playerId}/purge:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminPurgeUnit
      summary: |
        **회수** (#210) — 잘못 만든 유닛을 카탈로그에서 지우고 P-번호를 비운다.
        audit action=`unit_purge`(`admin_catalog_audit` — 다른 유닛 액션과 같은 원장).

        ⚠️ **거의 항상 409 다.** `players(id)` 를 FK 로 참조하는 표가 여덟이라, 누군가 한 번이라도
        뽑았으면 지울 수 없다 — 지우면 **그 유저의 카드가 사라진다**. 실질 적용 범위는 *방금 만들어
        아무도 손대지 않은 유닛*이고, 그게 #210 이 말한 경우다. 그 밖에는 `deactivate` 가 정답이다.

        409 응답의 `detail.references` 에 **어느 표가 몇 건인지** 담긴다 — 운영자가 "왜 안 지워지나"에
        스스로 답할 수 있게(막다른 토스트를 만들지 않는다).

        **이력은 다른 유닛 액션과 같은 원장**(`admin_catalog_audit`)에 남으므로
        `GET /api/admin/units/audit?playerId=…` 에서 생성·수정과 나란히 보인다. `before` 스냅샷이
        남아 "무엇을 지웠나"(이름·등급·스탯)에 답할 수 있다. 행이 남을 수 있는 근거 = 그 표의
        `player_id` 에 **FK 가 없다**(V14 가 "삭제된 유닛의 이력도 보존해야 한다"고 그렇게 설계했다).
        CHECK 확장은 **V32**(테이블 재작성).

        **거절(409)은 `admin_ops_audit`(V18)에 남는다** — 아무것도 바뀌지 않은 시도를 before/after
        스냅샷 원장에 넣으면 그 스냅샷이 거짓이 되므로 카탈로그 원장에는 넣지 않는다. 그래도
        "관리자가 유저 카드를 지우려 시도했다"는 사실은 남아야 한다(이 모듈 규율 = 성공·실패 모두 기록).

        **회수한 번호는 다시 발급되지 않는다** — 회수가 최고수위(`meta_kv.unit_id_high_water`)를
        올리고 채번이 그걸 함께 본다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 회수됨
          content:
            application/json:
              schema:
                type: object
                required: [playerId]
                properties:
                  playerId: { type: string }
                  name: { type: string, description: 지운 유닛의 이름(확인용) }
                  auditId: { type: string, description: 이 회수를 기록한 admin_catalog_audit 행 id }
                  references:
                    type: object
                    additionalProperties: { type: integer }
                    description: 성공 시 항상 빈 객체(막은 것이 없다는 뜻). 409 때는 detail 에 담긴다
        "400": { description: "reason 누락. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            이미 사용 중이라 회수 불가. code=CONFLICT, `detail.references = {표이름: 건수}`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/admin/units/{playerId}/deactivate:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminDeactivateUnit
      summary: |
        비활성화 — **신규 획득 경로에서만** 제외한다(가챠 추첨 풀 · 트레이드 타깃 · 도감의 미보유분).
        보유분은 건드리지 않는다: user_players · 덱 편성 · 성장/유효스탯 · 매치 SelectData 전부 그대로다.
        (hero 결정 U-D1 = 기보유 유저 손실 0.)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/units/{playerId}/activate:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminActivateUnit
      summary: 재활성화(감사 action 을 deactivate 와 분리해 이력 가독성을 유지한다)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/units/{playerId}/override:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: adminResetUnitOverride
      summary: |
        시드 권위로 복원(admin_locked=0). **값을 되돌리지는 않는다** — 다음 부팅의 시드 임포트가
        이 행을 다시 덮게 허용할 뿐이다. 지금 값을 바꾸려면 PATCH 를 쓴다.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
        - name: reason
          in: query
          required: false
          schema: { type: string }
          description: |
            바디 대신 쓸 수 있는 사유. DELETE 바디는 HTTP 상 합법이지만 일부 클라이언트·프록시가
            조용히 떨어뜨린다 — 목적은 사유 없는 변경을 막는 것이지 전송 형식 강제가 아니다.
            바디와 쿼리 둘 다 없으면 400.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락(바디·쿼리 모두). code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  # ───────────────────────────── admin: 공지 운영 (#248) ─────────────────────────────
  # economy(#209)와 같은 것: admin 게이트 뒤 · 사유 필수 · **성공·실패 모두** admin_ops_audit 기록.
  # 다른 것: 공지는 발행물의 파생이 아니라 운영자가 만드는 데이터 그 자체라 override 파일도 reload 도
  # 없다 — DB 가 SoT 이고 쓰면 곧 다음 조회(GET /api/notices/active)에 반영된다.
  # 인증은 /api/admin/ 접두사 게이트가 일괄 담당한다(엔드포인트별 권한 선언 없음).
  /api/admin/notices:
    get:
      tags: [admin]
      operationId: adminListNotices
      summary: |
        전체 목록(**중지·만료·삭제 포함**) + 서버가 판정한 status. 화면이 기간을 다시 계산하지
        않게 하는 것이 요점이다 — 같은 데이터에 두 개의 진실이 생기면 유저 피드와 운영 화면이
        조용히 갈라진다. 삭제된 공지는 목록 맨 뒤로 밀린다. (페이징 없음 — 운영 규모상 전건.)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items: { $ref: "#/components/schemas/AdminNotice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateNotice
      summary: 공지 생성. 사유 필수. audit action=notice_create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNoticeUpsertRequest" }
      responses:
        "200":
          description: 생성됨(201 이 아니라 200 — 리포 전반 관용구)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/notices/history:
    get:
      tags: [admin]
      operationId: adminNoticeHistory
      summary: |
        공지 운영 이력(감사 원장) — **성공과 실패 모두**. 거절된 시도도 남고, 그 행만으로
        "어느 공지에 무엇을 넣으려 했나"가 복원된다(detailJson.noticeId / attempted).
        원장 테이블은 economy·유닛 카탈로그와 공용이라 action 접두사 `notice_` 로 스코프한다.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminOpsAuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/notices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: adminUpdateNotice
      summary: |
        수정 = 내용 필드 **전체 치환**(부분 패치가 아니다). startsAt/endsAt/priority 를 안 보내면
        **지워진다** — web 폼은 항상 전체 필드를 보내야 한다.
        `revision` 은 **제목 또는 본문이 실제로 바뀔 때만** +1 한다(클라 억제 키가 `id@revision`
        이라, 내용 무관 변경에 범프하면 전원 재표시되고 안 하면 오탈자 수정본이 억제된 유저에게
        안 보인다). audit action=notice_update.
      description: |
        **`active` 에 값이 실려 오면 400 이다**(키가 있어도 `null` 이면 통과) — 전체 치환 규약에서
        한 필드만 조용히 무시하면 운영자가 200 을 받고 "내렸다"고 믿는데 공지는 계속 뜬다.
        노출은 POST /{id}/active 전용.

        **대상 조회가 검증보다 먼저다** — 없는 id 는 바디가 함께 잘못됐어도 400 이 아니라 404 다.
        (그래야 실패 원장에 대상 id·직전 스냅샷이 남는다.)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNoticeUpsertRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "없거나 이미 삭제된 공지. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "다른 운영자가 먼저 고쳤다(revision CAS 실패). code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      tags: [admin]
      operationId: adminDeleteNotice
      summary: |
        **soft delete 만**(hard delete 없음, hero 컨펌 Q6). 행은 남는다 — 감사 원장이 참조하는
        대상이 사라지면 "무슨 공지를 왜 내렸나"를 복원할 수 없다. audit action=notice_delete.
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string }
          description: |
            사유는 쿼리로 받는다(DELETE 바디는 일부 클라이언트·프록시가 조용히 떨어뜨린다 —
            /api/admin/economy/override 와 같은 관용구).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "없거나 이미 삭제된 공지. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        # 조회 시점엔 살아 있었는데 삭제 커밋이 먼저 들어오면 조건부 UPDATE 가 0행이 된다
        # (`WHERE … deleted_at IS NULL`). 404 로 낮추지 않는 이유 = 그건 "처음부터 없었다"는 뜻이고,
        # 여긴 "방금 누가 먼저 지웠다"라 운영자가 할 일(목록 새로고침)이 다르다.
        "409": { description: "다른 운영자가 먼저 지웠다(조건부 UPDATE 0행). code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/notices/{id}/active:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminSetNoticeActive
      summary: |
        노출 ON/OFF. **기간을 건드리지 않는다** — 급히 내릴 때 endsAt 을 과거로 조작하게 만들면
        원장이 거짓말을 한다. 내용이 그대로이므로 `revision` 도 오르지 않는다(다시 올려도
        전원 재표시가 되지 않는다). audit action=notice_active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, reason]
              properties:
                active: { type: boolean }
                reason: { type: string, description: 운영 사유(필수 — 원장에 남는다) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotice" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "없거나 이미 삭제된 공지. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        # 위 DELETE 와 같은 창 — requireLive 통과 후 다른 운영자의 삭제가 먼저 커밋되면 0행이 된다.
        "409": { description: "다른 운영자가 먼저 지웠다(조건부 UPDATE 0행). code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  # ──────────────────── notice assets (#309 W1 — 공지 이미지) ────────────────────
  # 공지 **텍스트**는 이미 무배포였는데(#248) **그림만 웹 배포에 묶여** 있었다
  # (apps/web/public/notice/*.webp 를 커밋 → CF Pages 재배포). 여기서 끊는다.
  #
  # ⚠️ **삭제 엔드포인트가 없는 것이 계약이다**(hero 확정 2026-07-30). 자산을 내리는 행위는
  #    되돌릴 수 있어야 한다 — 삭제는 오조작이 곧 영구 소실이고, 그 그림을 참조하던 공지를
  #    되살릴 방법이 없다. 내리기는 노출 스위치(active)로만 한다.
  /api/admin/notices/assets:
    get:
      tags: [admin]
      operationId: adminListNoticeAssets
      summary: 업로드한 공지 이미지 목록(노출 OFF 포함) + 사용 중 공지 수
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items: { $ref: "#/components/schemas/NoticeAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminUploadNoticeAsset
      summary: |
        공지 이미지 업로드(multipart, 파트명 `file`). audit action=notice_asset_upload.

        **타입 판정은 매직바이트다** — 파일명 확장자도 클라가 신고한 Content-Type 도 보지 않는다
        (둘 다 업로드하는 쪽이 정하는 값이다). 허용 = PNG · JPEG · WebP · GIF.
        **SVG 는 거절한다**: 스크립트를 담을 수 있어 `<img>` 로도 XSS 표면이 된다.

        저장 파일명은 `{ULID}.{ext}` 라 **업로드 이름이 경로에 도달하지 않는다**(경로 탈출을
        차단 규칙이 아니라 구조로 막는다).
      parameters:
        - { name: reason, in: query, required: false, schema: { type: string }, description: 운영 사유(원장에 남는다) }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeAsset" }
        # 화이트리스트 밖 형식 · 상한 초과 · 빈 파일. 거절은 **부수효과 0**(행도 파일도 안 남는다).
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/notices/assets/{id}/active:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminSetNoticeAssetActive
      summary: |
        이미지 노출 ON/OFF — **내리기의 전부**(삭제 경로는 없다). audit action=notice_asset_active.

        끄면 공개 서빙이 404 이고, 켜면 **같은 바이트가 그대로** 돌아온다. 파일도 행도 사라지지
        않으므로 오조작이 복구 가능하다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active, reason]
              properties:
                active: { type: boolean }
                reason: { type: string, description: 운영 사유(필수 — 원장에 남는다) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeAsset" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "없는 자산. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/notices/assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [notices]
      # **공개**(전역 bearerAuth 해제) — /api/notices/active 와 같은 이유다. 이 바이트는 그 공개
      # 피드의 본문이 가리키는 그림이라, 여기에만 401 을 두면 점검 공지가 글은 뜨고 그림만 깨진다.
      security: []
      operationId: getNoticeAsset
      summary: 공지 본문이 참조하는 이미지 (#309)
      description: |
        응답 헤더 셋이 계약이다: `Content-Type`(업로드 때 **매직바이트로 확정한** 값) ·
        `X-Content-Type-Options: nosniff`(화이트리스트와 **짝으로만** 방어가 성립한다) ·
        `Cache-Control: public, max-age=31536000, immutable`(id 당 내용 불변 — 재업로드는 새 id).

        ⚠️ 장기 캐시의 대가: **노출을 꺼도 이미 캐시된 브라우저에는 한동안 남는다**.
        급히 내려야 하는 그림이면 자산이 아니라 **공지를 내려라**(그건 즉시 반영된다).
      responses:
        "200":
          description: 이미지 바이트
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { description: "없거나 노출이 꺼진 자산. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  # ──────────────── unit art bundles (#309 W2 — 아트 핫로드) ────────────────
  # 유닛 **등록**은 이미 무배포였다(#207 파트 A: POST /api/admin/units 가 players 에 직접 쓰고
  # admin_locked 로 시드 재임포트를 막는다). 남아 있던 배포 의존은 **아트**다 — 아틀라스·카드 PNG,
  # 매니페스트 3종, player-chars 매핑이 전부 웹 빌드에 구워져 있었다.
  #
  # ⚠️ **통짜 zip 이지 파일 단위가 아니다.** 셋은 서로를 참조하므로(매니페스트가 아틀라스 타일
  #    좌표를, 매핑이 유닛 id 를 가리킨다) 파일별로 올리면 "매니페스트는 새것, PNG 는 옛것"인
  #    중간 상태가 생기고, 그때 화면은 **깨진 그림이 아니라 좌표가 어긋난 그림**을 그린다.
  # ⚠️ **삭제 동사가 없다.** 리비전은 쌓이고 활성 포인터만 옮긴다. 전부 끄면 web 이 구운 폴백으로
  #    돌아간다(= 이 기능이 없던 상태) — 그게 롤백이자 안전장치다.
  /api/admin/chars/bundles:
    get:
      tags: [admin]
      operationId: adminListCharBundles
      summary: 아트 번들 리비전 목록 + 지금 서빙 중인 리비전
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bundles]
                properties:
                  bundles:
                    type: array
                    items: { $ref: "#/components/schemas/CharBundle" }
                  activeRevision:
                    type: [string, "null"]
                    description: "`null` 이면 **구운 폴백 중**(= 아트 배포 이전 상태)"
                  storageRoot: { type: [string, "null"], description: 보관소 경로(운영 진단) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminUploadCharBundle
      summary: |
        아트 번들(zip) 업로드 — **활성화하지 않는다**. audit action=chars_bundle_upload.

        올리는 것과 켜는 것을 나눈 이유: 새 아트가 잘못됐다는 걸 알기 전에 이미 라이브에 나가
        있으면 되돌리는 동안 유저가 틀린 그림을 본다. 요약(유닛 수·매핑 버전)을 확인한 뒤 켠다.

        zip 검증: 엔트리 경로탈출(`..`) 거부 · 해제 **후** 총 바이트/엔트리 수 상한(zip bomb) ·
        확장자 화이트리스트(png·webp·json) + 이미지 **매직바이트** · web 이 읽는 매니페스트 4종
        (`manifest.json`, `characters/manifest.json`, `units/manifest.json`, `player-chars.json`)
        존재 + JSON 파싱. 하나라도 걸리면 **부수효과 0**(행도 파일도 남지 않는다).
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string }, description: 운영 사유(원장) }
        - { name: note, in: query, required: false, schema: { type: string }, description: 메모(어느 파이프라인 산출물인가) }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "`/chars` 트리 통짜 zip" }
      responses:
        "201":
          description: Created (아직 서빙되지 않는다 — active=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharBundle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/chars/bundles/active:
    post:
      tags: [admin]
      operationId: adminActivateCharBundle
      summary: |
        서빙할 리비전 전환. `revisionId` 가 **비어 있으면 전부 끈다** = 웹 빌드에 구운 아트로 롤백.
        audit action=chars_bundle_activate.

        끄기와 켜기가 한 트랜잭션이다 — 나누면 "둘 다 꺼진" 창이나 "둘 다 켜진" 상태(어느 쪽이
        서빙될지 조회 순서에 달림 = 새로고침마다 아트가 바뀜)가 생긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                revisionId:
                  type: [string, "null"]
                  description: 켤 리비전. **null/빈값 = 전부 끄기(구운 폴백으로 롤백)**
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeRevision: { type: [string, "null"] }
                  bundles:
                    type: array
                    items: { $ref: "#/components/schemas/CharBundle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "그런 리비전이 없다. code=NOT_FOUND", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/chars/index:
    get:
      tags: [catalog]
      # **공개**(전역 bearerAuth 해제) — 아트는 로그인 화면·가입 연출에서도 그려지는 공개
      # 카탈로그다(유저별 데이터 0). 401 을 두면 그 화면들이 통째로 이니셜 폴백이 된다.
      security: []
      operationId: getCharBundleIndex
      summary: 활성 아트 번들이 있는가 — **web 의 폴백 판정 트리거** (#309 W2)
      description: |
        web 은 부팅 시 이걸 읽고, **유효한 응답일 때만** 아트 base 를 백엔드 오리진으로 옮긴다.
        404 면 웹 빌드에 구운 `/chars` 를 그대로 쓴다.

        ⚠️ 활성 번들이 없을 때 `200 {}` 이 아니라 **404** 인 것이 계약이다. 성공 껍데기를 주면
        목·프록시·구 서버가 주는 빈 객체와 구분이 안 돼, web 이 "아트 0개"를 정상으로 받아들이고
        전 화면이 **조용히** 이니셜 폴백이 된다(깨진 화면이 아니라 밋밋한 화면이라 신고되지 않는다).
      responses:
        "200":
          description: 활성 번들 있음
          content:
            application/json:
              schema:
                type: object
                required: [revision, requiredEntries]
                properties:
                  revision: { type: string }
                  fileCount: { type: integer }
                  byteSize: { type: integer }
                  createdAt: { type: string, format: date-time }
                  requiredEntries:
                    type: array
                    items: { type: string }
                    description: web 이 반드시 찾을 수 있어야 하는 파일 — 소비 측이 형태를 값으로 확인한다
        "404": { description: "활성 번들 없음 → **구운 폴백을 쓰라는 신호**", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/chars/{path}:
    parameters:
      - { name: path, in: path, required: true, schema: { type: string }, description: "번들 안 상대경로(`units/manifest.json`, `units/avatars-64.png` …)" }
    get:
      tags: [catalog]
      security: []
      operationId: getCharBundleFile
      summary: 활성 아트 번들 안의 파일 (#309 W2)
      description: |
        `Content-Type` 은 확장자 화이트리스트가 정한 값이고 `X-Content-Type-Options: nosniff` 가 붙는다.

        ⚠️ **장기 캐시를 걸지 않는다**(5분). URL 에 리비전이 없어서(구운 폴백과 경로 모양을 맞춰야
        `assetUrl` 이 한 벌로 돈다) 장기 캐시를 걸면 아트를 갈아끼워도 브라우저가 옛 그림을 계속
        그린다 — 그건 이 웨이브가 없애려는 "배포해도 안 바뀐다"와 같은 증상이다.
      responses:
        "200":
          description: 파일 바이트
          content:
            image/*: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object } }
        "404": { description: "활성 번들이 없거나 그 파일이 없다(경로 조작도 여기로 답한다)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  # ───────────────────────────── notices (공개) ─────────────────────────────
  /api/notices/active:
    get:
      tags: [notices]
      operationId: getActiveNotices
      # **공개 엔드포인트**(전역 bearerAuth 해제) — /api/config 와 같은 처지다. 유저 스코프 데이터 0인
      # 전체 브로드캐스트이고, 무엇보다 **점검 공지는 로그인이 안 될 때 가장 필요하다**. 여기에 401 을
      # 두면 정확히 그 순간에 안 보인다(#232 독립검증 BL-1 의 반복).
      # ⚠️ 이 줄을 지우면 전역 security 가 되살아나 계약이 "인증 필요"로 읽힌다.
      security: []
      summary: 홈(로비) 팝업이 읽는 공지 피드 — 지금 보여야 하는 것만 (#248)
      description: |
        **서버가 이미 걸러서 내려준다**: `active=1` · 미삭제 · `startsAt <= now <= endsAt`(양끝 포함).
        클라는 기간을 재계산하지 않는다 — 재계산하면 기기 시계·타임존이 진실이 되고(폰 시계가 하루
        빠른 유저에게 점검 공지가 안 뜬다), 규칙이 바뀔 때 조용히 어긋난다(#217 `locked` 와 같은 원칙).

        정렬 = `priority DESC, startsAt DESC, id DESC`. 클라는 받은 순서 그대로 카드를 쌓는다
        (중첩 스택 팝업, hero 컨펌 Q1) — "무엇이 맨 위인가"는 서버가 정하는 값이다.

        활성 0건이면 200 + 빈 배열이다(에러가 아니다). 그래도 클라는 응답 형태 이상·5xx 에
        견뎌야 한다 — 팝업만 안 뜨고 로비는 정상 렌더(#248 §3.3).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items: { $ref: "#/components/schemas/ActiveNotice" }

  /api/notices/{id}:
    get:
      tags: [notices]
      operationId: getNoticeById
      # **공개 엔드포인트**(전역 bearerAuth 해제) — /api/notices/active 와 같은 처지에 더해,
      # **공유 링크는 정의상 미로그인 상태에서 열린다**. 여기에 401 을 두면 카톡으로 받은 링크가
      # 로그인 벽부터 보여 주고 공지 내용은 도달하지 않는다.
      # ⚠️ 이 줄을 지우면 전역 security 가 되살아나 계약이 "인증 필요"로 읽힌다.
      security: []
      summary: 공유 딥링크가 읽는 공지 단건 (#297, 에픽 #293)
      description: |
        `/share/notice/{id}` 딥링크(web #298)와 OG 썸네일 Function(infra #299)이 읽는다.

        **상태 판정은 서버가 한다**(피드와 같은 규칙 — `Notices.status`: DELETED → OFF → EXPIRED →
        SCHEDULED → LIVE). 클라는 기간을 재계산하지 않고 **응답 코드로만 분기**한다:

        | 공지 상태 | 코드 | 클라 동작 |
        |---|---|---|
        | LIVE | **200** + 본문 | 그 공지를 팝업으로 연다 |
        | EXPIRED · OFF | **410** | "기간이 지난 공지입니다" 안내 후 로비로 |
        | SCHEDULED · DELETED · 없는 id | **404** | 존재를 숨긴다 |

        ⚠️ **예약(SCHEDULED)이 410 이 아니라 404 인 이유**: 410 은 "그 id 는 실재한다"를 흘린다.
        아직 공개하지 않은 공지가 링크 한 줄로 존재를 들키면 준비 중인 점검 일정·이벤트가 먼저 퍼진다.
        그래서 예약 공지의 404 응답은 **없는 id 와 본문까지 동일**하다(문구로도 새지 않는다).

        응답 본문은 피드 항목과 **같은 모양**(`ActiveNotice`)이다 — 래핑 객체가 아니라 공지 그 자체라
        클라가 한 건을 그대로 팝업 카드에 넘길 수 있다. 운영 전용 필드(active·deletedAt·createdBy·
        updatedAt)는 여기에도 실리지 않는다(인증 없이 열려 있다).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 공지 ULID
      responses:
        "200":
          description: LIVE — 지금 보여도 되는 공지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveNotice" }
        "404":
          description: |
            없는 id · 예약(SCHEDULED) · 삭제(DELETED). code=NOT_FOUND.
            세 경우의 응답은 **구분 불가능**하다(존재 누출 차단).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "410":
          description: |
            기간이 끝났거나(EXPIRED) 운영이 내린(OFF) 공지. code=GONE.
            본문은 싣지 않는다 — 앱은 안내 문구만 띄우고 로비로 보낸다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ─────────────────── engine-config (계수 무배포 변경, #383) ───────────────────
  # economy(#209)와 형태는 닮았지만 **적용 시점이 다르다**: economy 는 리로드 즉시 전 유저에게
  # 걸리고, 계수는 **이 호출 이후 생성되는 매치부터** 걸린다. 진행 중 매치는 시작 시점 스냅샷으로
  # 끝까지 돈다(matches.config_overrides_json — #241 재발 방지가 최우선 제약).
  # 경로 유효성 판정은 서버가 하지 않는다 — 러너(POST /config/validate)가 한다. 유효한 경로가
  # 무엇인지는 엔진을 손에 든 쪽만 알고, 서버가 규칙을 복제하면 엔진이 바뀔 때 조용히 갈라진다.
  /api/admin/engine-config:
    get:
      tags: [admin]
      operationId: adminGetEngineConfig
      summary: 지금 **새 매치에 실릴** 계수 오버레이 + 출처 + 적용 시점
      responses:
        "200":
          description: 현재 오버레이
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineConfigView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      operationId: adminReplaceEngineConfig
      summary: |
        오버레이 **전체 교체**(PATCH 아님). 부분 병합은 "지금 뭐가 걸려 있나"를 운영자가 머릿속으로
        추적하게 만들고 롤백을 역연산으로 바꾼다 — GET → 수정 → PUT 이 유일한 루프이고, 그래서
        원장의 모든 행이 완결 스냅샷이다. **기본값 복귀 = `overrides: {}`**.
        원장에 쓰기 전에 러너 검증을 통과해야 한다(실패 시 리비전 0 + 감사에 failed).
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineConfigRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineConfigView" }
        "400": { description: "reason 누락 · 값 타입 위반 · **러너 검증 실패**(미지 경로·구조 경로·NaN·스모크 실패). code=VALIDATION_ERROR, message 에 사유 전부", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "멱등키 충돌(같은 키가 이미 다른 내용에 쓰였다). code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/engine-config/history:
    get:
      tags: [admin]
      operationId: adminEngineConfigHistory
      summary: 리비전 이력(누가·언제·왜·무엇을). 원장은 append-only 라 과거가 지워지지 않는다
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: 최신순
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EngineConfigRevision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/engine-config/knobs:
    get:
      tags: [admin]
      operationId: adminEngineConfigKnobs
      summary: |
        오버레이 가능한 리프 전수 + 현재 기본값(러너 위임). 운영자가 경로 이름을 **추측하지 않게**
        한다 — 이게 없으면 오타 → 400 → 소스 뒤지기의 왕복이 생긴다.
        구조 경로(version·msPerTick·fixedScale·coordMode·gridSize·pitch.*·formations.*)는 목록에 없다.
        무효 노브(#338)는 `knobs` 가 아니라 `inertKnobs` 에 **사유와 함께** 따로 나온다 — 목록에서
        통째로 지우면 "내가 아는 그 노브가 왜 없지?"가 되어 결국 소스를 뒤지게 된다.
        ⚠️ `knobs` 에 있다는 것이 **경기가 달라진다는 보장은 아니다** — 이 필터는 엔진 #338
        레지스트리 등재분만 걷어낸다. 등재 밖의 실효 없는 노브가 더 있다(#383 M5 → #393).
        확정은 `validate` 의 스모크·`changed` diff 가 아니라 **실제 경기 관측**으로 한다.
      responses:
        "200":
          description: 경로 카탈로그
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineConfigKnobs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/engine-config/validate:
    post:
      tags: [admin]
      operationId: adminValidateEngineConfig
      summary: |
        드라이런 — **원장을 만들지 않는다**. 값을 확정하기 전에 diff·스모크만 본다.
        스모크는 구조 불변식만 본다(이벤트>0 · 양 팀 패스>0 · 공 소유 전환>0) — **밸런스 밴드는
        보지 않는다**. 밴드를 맞추는 것이 이 기능의 목적이므로 여기서 강제하면 자기 목적을 막는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EngineConfigRequest" }
      responses:
        "200":
          description: 통과 — 유효 config 지문 + 변경 diff + 스모크 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineConfigValidateResult" }
        "400": { description: "검증 실패. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── mails (우편함, #323) ─────────────────────────────
  /api/admin/mails:
    get:
      tags: [admin]
      operationId: adminListMailCampaigns
      summary: 발송 이력 + 수령 통계("몇 명이 받았나"가 운영의 첫 질문이다)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items: { $ref: "#/components/schemas/AdminMailCampaign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminSendMail
      summary: |
        우편 발송(무배포 운영). 대상 = 전체(ALL) 또는 특정 유저 목록(USERS).
        **201 = 이번에 보냈다 / 200 = 같은 멱등키의 재전송이라 아무것도 더 보내지 않았다.**
      description: |
        `Idempotency-Key` 를 **항상** 보내라 — 없으면 서버가 채번하므로 그 요청은 재전송 보호를
        받지 못한다. 같은 키 + 다른 내용은 **409** 다(조용히 삼키면 운영자는 정정에 성공했다고
        믿는데 아무 일도 일어나지 않는다 — admin points 지급이 실측으로 겪은 함정).

        대상 수가 `hmb.mail.fanout-max` 를 넘으면 **거부**한다(조용히 자르지 않는다 — 절반만 받은
        이벤트는 회수도 재발송도 어렵다).
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMailSendRequest" }
      responses:
        "201":
          description: 발송됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMailSendResult" }
        "200":
          description: 같은 멱등키·같은 내용의 재전송(applied=false, 추가 발송 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMailSendResult" }
        "400":
          description: |
            검증 실패. code=VALIDATION_ERROR — 없는 유저·없는 카드·음수/상한 초과 첨부·사유 누락·
            팬아웃 상한 초과. **거절은 아무것도 남기지 않는다**(캠페인 0·수신 행 0).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "같은 멱등키에 다른 내용. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/mails/history:
    get:
      tags: [admin]
      operationId: adminMailHistory
      summary: 우편 운영 이력(감사 원장, 성공·실패 모두). action=mail_send | mail_revoke
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminOpsAuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/mails/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: adminMailCampaign
      summary: 발송 건 상세 + 수령 통계
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMailCampaign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/mails/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminRevokeMail
      summary: |
        오발송 회수 — **미수령분만** 막는다. 이미 수령한 건은 건드리지 않는다(원장을 되감는 것은
        별개의 조작이고, 필요하면 admin points 차감 경로로 개별 처리한다). audit action=mail_revoke.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 회수됨(멱등 — 이미 회수됐으면 최초 회수 시각을 그대로 돌려준다)
          content:
            application/json:
              schema:
                type: object
                required: [campaignId, revokedAt, unclaimed]
                properties:
                  campaignId: { type: string }
                  revokedAt: { type: string }
                  unclaimed:
                    type: integer
                    description: 이 회수로 받을 수 없게 된 미수령 우편 수
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/mails:
    get:
      tags: [mails]
      operationId: listMyMails
      summary: |
        내 우편함(최신순) + 뱃지 수. **만료·수령 완료도 목록에 남는다**(hero 확정 ④) —
        놓쳤다는 사실이 보여야 다음엔 안 놓친다. 대신 뱃지에는 세지 않는다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/mails/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mails]
      operationId: readMail
      summary: |
        열람 기록(멱등 — 이미 읽었으면 최초 열람 시각을 유지한다). web 이 상세를 펼칠 때 부른다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "내 우편물이 아니다 — 없는 id 와 구분 불가능(존재 누출 차단)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/mails/{id}/claim:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [mails]
      operationId: claimMail
      summary: |
        수령. 첨부를 **기존 경로**로 지급한다(G=point_ledger · Z=gem_ledger · 카드=user_players,
        멱등 ref_id = 우편물 id).
      description: |
        **더블탭은 실패가 아니다** — 200 `applied:false` + 현재 잔액. admin 멱등키 충돌(다른 내용)과
        달리 유저의 두 번째 [받기]는 같은 의도의 재전송이라, 실패로 보이게 하면 "받았는데 에러가
        났다"가 되고 문의가 생긴다.
      responses:
        "200":
          description: 수령됨(applied=true) 또는 이미 수령한 우편물의 재요청(applied=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailClaimResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "내 우편물이 아니다 — 없는 id 와 구분 불가능", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "410":
          description: |
            수령 기간이 지났거나(EXPIRED) 운영이 회수한 우편물. code=GONE.
            회수도 같은 410 이다 — 유저에게 "운영이 회수했다"까지 알릴 필요는 없고, 못 받는다는
            사실은 같다. 부수효과 0.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "/api/** 전체(로그인 제외). sessions 테이블 조회."
    servantToken:
      type: apiKey
      in: header
      name: X-Servant-Token
      description: "/internal/** 전용 고정 shared secret(AC-Q3)."

  parameters:
    MatchId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: 인증 실패(토큰 없음/만료/무효). code=UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 리소스 없음. code=NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: 입력 검증 실패. code=VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DuplicateNickname:
      description: |
        이미 사용 중인 닉네임(= 자체 로그인 id). code=DUPLICATE_NICKNAME. P3 §A(AC-A1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: |
        인증은 됐으나 권한이 없음(admin 전용 API 에 일반 유저 토큰). code=FORBIDDEN. P3 §C(AC-C2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidState:
      description: |
        현재 매치 상태에서 허용되지 않는 액션(§5.1 전이표 외). code=INVALID_STATE. AC-M1.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    # ───────────────────────────── 공통 ─────────────────────────────
    ErrorCode:
      type: string
      description: |
        전 엔드포인트 공통 에러 코드 열거(LLD §3). 신규 코드 추가 시 이 열거에 먼저 반영한다
        (openapi.yaml이 계약 SoT).
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - NOT_FOUND
        - DECK_INVALID
        - INSUFFICIENT_POINTS
        - INVALID_STATE
        - SUBSTITUTION_INVALID
        - AI_JOB_FAILED
        - INTERNAL_ERROR
        # P3 §A 자체 로그인(additive)
        - BAD_CREDENTIALS
        - DUPLICATE_NICKNAME
        # P3 §C admin(additive) — 인증은 됐으나 admin 이 아님
        - FORBIDDEN
        # P3 §C admin(additive) — 중복 멱등키 등 상태 충돌
        - CONFLICT
        # #217 매치 잠금(additive) — 끝나지 않은 매치가 있어 이 요청을 받을 수 없다.
        # detail = {matchId, state, action} — web 은 matchId 로 "이어하기" 를 띄운다.
        - MATCH_IN_PROGRESS
        # #297 공유 딥링크(additive) — **있었지만 지금은 끝난** 리소스(410). 404 와 나누는 이유는
        # 클라가 안내 문구를 고를 수 있게 하기 위해서다(만료 공지 = "기간이 지난 공지입니다").
        # ⚠️ 존재를 숨겨야 하는 것에는 쓰지 마라 — 410 은 "그 id 는 실재한다"를 흘린다.
        - GONE

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 사람이 읽을 수 있는 사유(한국어 가능)
        detail:
          type: [object, "null"]
          additionalProperties: true
      example:
        code: DECK_INVALID
        message: 선발이 11명이 아닙니다
        detail:
          starterCount: 10

    # ───────────────────────────── auth/me ─────────────────────────────
    LoginRequest:
      type: object
      required: [nickname]
      properties:
        provider:
          type: string
          enum: [guest, "mock:google", "mock:apple", local]
          description: |
            Phase2 additive — 생략 시 guest (server 9c51446 구현 정합).
            P3 additive: local = 자체 로그인(비번 필요, P3-D2).
        nickname:
          type: string
          pattern: "^[\\p{L}\\p{N}_-]{2,16}$"
          description: "provider=local 에서는 이 닉네임이 곧 로그인 id 다(별도 식별자 없음)"
        password:
          type: string
          description: |
            P3 additive(옵션) — provider=local 일 때만 사용한다. 다른 provider 는 무시.
            ⚠️ 평문 저장 목업(P3-D2, 해시 전환 백로그). 응답·로그 어디에도 반환되지 않는다(AC-A2).

    RegisterRequest:
      type: object
      required: [nickname, password]
      description: 자체 로그인 회원가입 바디(P3 §A). nickname = 로그인 id(users.nickname UNIQUE 재사용).
      properties:
        nickname:
          type: string
          pattern: "^[\\p{L}\\p{N}_-]{2,16}$"
        password:
          type: string
          description: "길이 규칙은 서버 config(hmb.auth.local.password-*-length). 평문 목업(P3-D2)."

    UserRef:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: string
          description: ULID
        nickname:
          type: string
        isAdmin:
          type: boolean
          description: |
            P3 §C additive(선택 필드 — required 불변). GET /api/me 응답에만 담긴다.
            web 이 /admin 라우트를 **표시**할지 정하는 힌트일 뿐 권한 판정이 아니다 —
            실제 접근 차단은 서버의 /api/admin/** 게이트가 한다.
        tutorialDone:
          type: boolean
          description: |
            #209 additive(선택 필드 — required 불변). GET /api/me 응답에만 담긴다.
            온보딩 튜토리얼 완료 여부의 **서버 SoT**(그 전까지는 클라 localStorage 폴백뿐이었다).
            덱 지급이 완료 시점에 매달리므로 권위가 서버에 있어야 한다 — 저장은
            POST /api/me/tutorial-complete 만 한다.

    LoginResponse:
      type: object
      required: [token, user, isNew]
      properties:
        token:
          type: string
          description: 불투명 세션 토큰(Bearer로 사용)
        user:
          $ref: "#/components/schemas/UserRef"
        isNew:
          type: boolean
          description: 신규 가입이면 true(스타터 팩 지급 트리거, PRD §3.2)

    # #232 재화 표기 메타 — 내부 코드(POINT|GEM)를 화면 문자열로 옮기는 유일한 자리.
    # 코드·DB 컬럼·원장·에러코드는 바뀌지 않는다. 바뀌는 건 표기뿐이고, 표기는 데이터다.
    Currency:
      type: object
      required: [code, symbol, name, icon, position, separator]
      properties:
        code:
          type: string
          description: 내부 재화 코드(POINT|GEM). 값·원장·API 가 쓰는 그 코드 — 화면에 그대로 쓰지 않는다.
        symbol:
          type: string
          description: 금액 옆 짧은 표기(hero 확정 — 골드=G, 다이아=Z).
        name:
          type: string
          description: >-
            풀네임(문장형 안내문·툴팁). ⚠️ 카드 **등급** 이름(골드/다이아)과 겹칠 수 있어
            화면 기본 표기는 symbol 이다.
        icon:
          type: string
          description: 금액 앞 아이콘. 빈 문자열이면 그리지 않는다.
        position:
          type: string
          enum: [prefix, suffix]
        separator:
          type: string
          description: 금액과 symbol 사이 구분자. 빈 문자열은 "붙여쓰기"라는 의미 있는 값이다.

    # 금액 + 그 금액의 재화. 이 둘은 항상 붙어 다닌다(떼어 놓은 것이 #213 버그의 형태였다).
    Price:
      type: object
      required: [currency, cost]
      properties:
        currency:
          type: string
          description: 재화 코드(POINT|GEM)
        cost:
          type: integer
          minimum: 0

    AppConfig:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/Currency"
        shop:
          oneOf:
            - $ref: "#/components/schemas/ShopConfig"
            - type: "null"
          description: economy 파일이 로드되지 않았으면 null(표기는 그래도 내려간다).
        grants:
          type: [object, "null"]
          required: [initialPoints, initialGems]
          description: >-
            가입 지급액. 클라이언트가 상수(3,000)를 그리고 있었고 유상재화 지급은 **표기조차
            없었다** — 운영이 무배포 override 로 지급액을 올린 뒤에도 화면은 그대로였다(#209/#232).
          properties:
            initialPoints:
              type: integer
              minimum: 0
            initialGems:
              type: integer
              minimum: 0

    ShopConfig:
      type: object
      properties:
        gacha:
          type: [object, "null"]
          required: [single, ten, tenCount]
          properties:
            single:
              $ref: "#/components/schemas/Price"
            ten:
              $ref: "#/components/schemas/Price"
            tenCount:
              type: integer
        dice:
          type: [object, "null"]
          required: [normal, cash]
          description: >-
            **잠재 리롤 1회 비용** (#247). 예전엔 상점에서 다이스를 사서 재고로 쌓는 가격이었으나
            hero 확정(2026-07-29)으로 구매 단계가 사라졌다 — 이제 강화탭의 리롤 버튼이 이 값으로
            지갑에서 직접 결제한다(`POST /api/growth/dice`). **키·값은 그대로**라 economy override
            재작성이 필요 없다. `POST /api/shop/dice`(구매)는 은퇴했다.
          properties:
            normal:
              $ref: "#/components/schemas/Price"
              description: 잠재 재설정(승급 판정 있음) — 무료재화 결제
            cash:
              $ref: "#/components/schemas/Price"
              description: 고급 재설정(상위 옵션 가중, 승급 판정 없음) — 유상재화 결제
        gemTopup:
          type: [object, "null"]
          required: [enabled, packs]
          properties:
            enabled:
              type: boolean
              description: >-
                false 면 클라이언트는 충전 UI 를 **그리지 않는다** — 누르면 403 TOPUP_DISABLED 인
                죽은 버튼이 된다(#212 로 목업 수도꼭지가 잠겼다). 실결제 연동 시 이 플래그만 켠다.
            packs:
              type: array
              items:
                type: object
                required: [id, gems, mockPrice]
                properties:
                  id:
                    type: string
                  gems:
                    type: integer
                  mockPrice:
                    type: string

    WalletInfo:
      type: object
      required: [points]
      properties:
        points:
          type: integer
          minimum: 0
          description: >-
            무료재화 잔액(내부 코드 POINT) — 트레이드·무료강화(노말 다이스)에 쓴다.
            **표기(이름·심볼)는 값이 아니라 데이터다** — GET /api/config 의 currencies 에서 조회한다(#232).
        gems:
          type: integer
          minimum: 0
          description: >-
            유상재화 잔액(내부 코드 GEM) — 뽑기·유료 다이스. #212 additive(구서버 응답엔 없을 수
            있어 required 아님). 수급은 가입 지급 + **리그 시즌 완주**(#251, 구 "리그 우승") 둘뿐.
            표기는 GET /api/config 참조(#232).

    # #212: 시즌 종료 보상 노출(GET /api/league → season.seasonReward). 지급 진실의 SoT 는 원장
    # (point_ledger 'league_reward' / gem_ledger 'league_gem_reward', 둘 다 ref=seasonId)이다.
    SeasonReward:
      type: object
      required: [rank, points, status]
      properties:
        rank:
          type: integer
          description: 유저 최종 순위(시즌 진행 중이면 현재 잠정 순위).
        points:
          type: integer
          description: 실지급 무료재화(원장 delta). 미지급이면 0 — 예정액이 아니다.
        gems:
          type: integer
          description: >-
            실지급 유상재화(gem_ledger delta — 계산이 아니라 원장이 SoT).
            **#251: 완주하면 전 순위 지급** — 완주 기본 + 순위 보너스 가산(1등 9,000 / 2등 6,000 /
            3등 4,000 / 4등 이하 3,000). 금액 SoT 는 economy config `league.gemReward`
            {completion, rankBonus} 라 무배포 교체 가능 — 이 문서의 숫자는 현재 발행값이다.
            (구 #212 "우승만 500~3000 랜덤"을 대체했다.) 미종료/미지급이면 0.
            web 연출 입력(#214). 표기는 GET /api/config 참조(#232).
        status:
          type: string
          enum: [PENDING, GRANTED, NONE]
          description: >-
            PENDING=시즌 진행 중(미지급) / GRANTED=지급됨 / NONE=종료됐으나 보상 없음(방어).
            ⚠️ 클라는 **이 세 값**을 안다 — 클라가 지어낸 이름(AWARDED/FAILED)을 쓰면 종료 시즌이
            전부 "미지급"으로 뜬다(#251 에서 실제로 그 상태였다).
        awardedAt:
          type: string
          nullable: true
          description: 지급 시각(원장 created_at). 미지급이면 null.

    MatchRecordSummary:
      type: object
      required: [wins, draws, losses]
      properties:
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }

    MailAttachments:
      type: object
      required: [points, gems, players]
      description: |
        첨부 = 지급될 것들의 **선언**. 첨부 0 도 유효하다(텍스트 전용 안내 우편).
        컬럼으로 펴지 않고 JSON 으로 두는 이유 = 첨부 종류가 늘 때마다 마이그레이션이 되면
        운영이 다시 배포에 묶인다(이 에픽이 없애려던 바로 그 의존).
      properties:
        points: { type: integer, format: int64, description: 무료재화(G) }
        gems: { type: integer, format: int64, description: 유상재화(Z) }
        players:
          type: array
          items:
            type: object
            required: [playerId, count]
            properties:
              playerId: { type: string }
              count: { type: integer }

    Mail:
      type: object
      required: [id, title, body, attachments, sentAt, state]
      properties:
        id: { type: string, description: ULID. 수령 시 원장 ref_id 로 그대로 쓰인다 }
        title: { type: string }
        body: { type: string, description: 공지와 같은 마크다운 부분집합(렌더 살균은 web 소관) }
        attachments: { $ref: "#/components/schemas/MailAttachments" }
        sentAt: { type: string }
        expiresAt:
          type: [string, "null"]
          description: null = 무기한(hero 확정 ③ — 발송 시 미지정이면 만료가 없다)
        readAt: { type: [string, "null"] }
        claimedAt: { type: [string, "null"] }
        state:
          type: string
          enum: [UNREAD, READ, CLAIMED, EXPIRED]
          description: |
            **서버가 판정한다.** 클라가 `expiresAt < now` 를 계산하면 기기 시계가 진실이 되고
            (폰 시계가 하루 빠른 유저에게 멀쩡한 보상이 만료로 보인다), 규칙이 바뀔 때 조용히 어긋난다.

    MailListResponse:
      type: object
      required: [mails, unread]
      properties:
        mails:
          type: array
          items: { $ref: "#/components/schemas/Mail" }
        unread:
          type: integer
          description: |
            뱃지 수 = **아직 내가 할 일** = 안 읽음 **또는** (첨부가 있는데 미수령). 만료·회수는 제외.
            읽음만으로 끄면 열어 보고 안 받은 보상이 조용히 사라진다 — 뱃지가 지켜야 하는 것이 그 케이스다.

    MailClaimResult:
      type: object
      required: [id, claimed, applied, granted, wallet]
      properties:
        id: { type: string }
        claimed: { type: boolean }
        applied:
          type: boolean
          description: false = 이미 수령한 우편물이라 아무것도 바뀌지 않았다(잔액은 현재값)
        granted:
          type: object
          required: [points, gems, players]
          properties:
            points: { type: integer, format: int64 }
            gems: { type: integer, format: int64 }
            players:
              type: array
              items:
                type: object
                required: [playerId, count, isNew]
                properties:
                  playerId: { type: string }
                  count: { type: integer }
                  isNew: { type: boolean }
        wallet:
          type: object
          required: [points, gems]
          properties:
            points: { type: integer, format: int64 }
            gems: { type: integer, format: int64 }

    AdminMailSendRequest:
      type: object
      required: [audience, title, body, reason]
      properties:
        audience:
          type: string
          enum: [ALL, USERS]
          description: |
            ALL = **발송 시점에 존재하는 유저 전원**. 이후 가입자는 대상이 아니다 —
            패치 보상의 사유(그 패치를 겪었다)가 나중에 온 사람에게는 성립하지 않는다.
        userIds:
          type: array
          items: { type: string }
          description: audience=USERS 일 때 필수. ALL 과 함께 보내면 400.
        title: { type: string }
        body: { type: string }
        attachments: { $ref: "#/components/schemas/MailAttachments" }
        expiresAt: { type: string, description: 절대 시각(expiresInDays 와 함께 쓸 수 없다) }
        expiresInDays: { type: integer, description: 상대 일수(expiresAt 와 함께 쓸 수 없다) }
        reason: { type: string, description: 운영 사유(필수 — 감사 원장에 남는다) }

    AdminMailSendResult:
      type: object
      required: [campaignId, audience, targetCount, applied]
      properties:
        campaignId: { type: string }
        audience: { type: string, enum: [ALL, USERS] }
        targetCount: { type: integer, description: 이 발송이 만든 수신 행 수(발송 시점 스냅샷) }
        expiresAt: { type: [string, "null"] }
        applied: { type: boolean, description: false = 같은 멱등키의 재전송(추가 발송 0) }

    AdminMailCampaign:
      type: object
      required: [id, audience, title, body, attachments, targetCount, claimedCount, readCount, createdAt]
      properties:
        id: { type: string }
        audience: { type: string, enum: [ALL, USERS] }
        title: { type: string }
        body: { type: string }
        attachments: { $ref: "#/components/schemas/MailAttachments" }
        expiresAt: { type: [string, "null"] }
        revokedAt: { type: [string, "null"], description: 회수 시각. 미수령분이 410 이 된다 }
        targetCount: { type: integer }
        claimedCount: { type: integer }
        readCount: { type: integer }
        reason: { type: string }
        actor: { type: string, description: 발송한 운영자 닉네임 }
        createdAt: { type: string }

    MeResponse:
      type: object
      required: [user, wallet, records]
      properties:
        user:
          $ref: "#/components/schemas/UserRef"
        wallet:
          $ref: "#/components/schemas/WalletInfo"
        records:
          $ref: "#/components/schemas/MatchRecordSummary"
        rating:
          type: integer
          description: 원정 레이팅(#245 additive). wallet.points 와 다른 축 — 포인트는 소비 재화라 실력을 말하지 못한다.
        league:
          description: >-
            리그 디비전(#268 additive). **시즌과 무관하게 현재 값**이다 — 승급/강등은 시즌 *사이*에
            일어나므로 시즌이 없는 구간(첫 진입 · 시즌 종료 후 새 시즌 전)에도 "내가 몇 부인지"가 필요하다.
            사다리 표가 발행되지 않았으면(구 발행물 롤백) **null** = 디비전 개념이 꺼진 상태.
          oneOf:
            - $ref: "#/components/schemas/MeLeagueInfo"
            - type: "null"
        mail:
          description: >-
            우편함 요약(#323 additive). `unread` = 헤더 뱃지 숫자(정의는 MailListResponse.unread 와
            같다), `total` = 이 유저의 우편 행 수 = **진입점을 그릴지**(0 이면 화면에 아무것도 안
            그린다 — 빈 목록으로 "없습니다"라고 단언하지 않기 위해).
            전용 엔드포인트를 만들지 않은 이유 = 홈이 이미 이 호출을 한다. 두 값이 다 있어야 홈이
            **목록을 받지 않고도** 헤더를 그린다(본문까지 실린 목록은 우편함을 열 때 받는다).
          type: object
          required: [unread, total]
          properties:
            unread: { type: integer }
            total: { type: integer }

    MeLeagueInfo:
      type: object
      required: [division]
      properties:
        division:
          type: integer
          description: 현재 디비전 level. **작을수록 상위**(10=입문 … 1=최상위).
        divisionName:
          type: [string, "null"]
          description: >-
            표시명(league.v2.json divisions[].name). **서버가 SoT** — 클라가 level→이름 규칙을
            복제하면 발행물이 바뀔 때 조용히 어긋난다.

    AdminEconomyView:
      type: object
      required: [source, effectivePath, overridePath, overrideApplied, overrideFilePresent, loadedAt, starterPackSize, starterTop]
      description: "#209 B안 — 지금 유효한 economy 요약 + 출처(운영 화면이 '반영됐나'에 답하는 근거)"
      properties:
        version: { type: [string, "null"] }
        source:
          type: string
          enum: [BAKED, OVERRIDE, NONE]
          description: BAKED=배포 발행물 · OVERRIDE=운영이 얹은 파일 · NONE=설정 없음
        effectivePath: { type: string }
        overridePath: { type: string }
        overrideApplied:
          type: boolean
          description: 지금 적용된 값이 override 에서 왔는가(= source==OVERRIDE)
        overrideFilePresent:
          type: boolean
          description: override 파일이 디스크에 존재하는가(거절된 파일이 남아 있을 수 있어 적용 여부와 별개)
        loadedAt: { type: string }
        starterPackSize: { type: integer }
        starterTop:
          type: object
          required: [pool, count]
          properties:
            pool:
              type: array
              items: { type: string }
            count: { type: integer }

    AdminStarterTopRequest:
      type: object
      required: [pool, count, reason]
      properties:
        pool:
          type: array
          items: { type: string }
          description: 최상위 후보 playerId — 카탈로그 실재 · 중복 없음 · 기본팩과 서로소여야 한다
        count:
          type: integer
          minimum: 1
          description: 가입 시 지급 장수(1..pool 크기)
        reason:
          type: string
          description: 운영 사유(필수 — 원장에 남는다)

    AdminOpsAuditEntry:
      type: object
      required: [id, actor, action, result, createdAt]
      description: "#209 B안 — admin 운영 액션 감사 원장 1행. 실패도 남는다"
      properties:
        id: { type: string }
        actor: { type: string, description: 액션을 실행한 admin 닉네임 }
        action:
          type: string
          description: |
            economy_reload | economy_starter_top | economy_override_clear (#209) ·
            notice_create | notice_update | notice_active | notice_delete (#248).
            ⚠️ enum 으로 닫지 않는다 — 이 테이블은 범용 운영 원장이고(#207 파트 A 등 다른 트랙이
            자기 action 을 같은 테이블에 append 한다) economy 이력 조회는 action 필터가 없다.
            닫아 두면 그 트랙이 랜딩하는 순간 응답이 자기 스펙을 위반한다.
            (GET /api/admin/notices/history 만 `notice_` 접두사로 스코프한다.)
        result:
          type: string
          enum: [ok, failed]
        reason: { type: [string, "null"] }
        detailJson:
          type: [string, "null"]
          description: |
            `{before, after}` 또는 `{before, attempted, error}` 스냅샷(JSON 문자열).
            공지(#248)는 여기에 **`noticeId` 를 함께 싣는다** — 검증에서 튕긴 실패 행은 before 가
            null 이라, id 가 없으면 "어느 공지에 무엇을 넣으려 했나"가 원장에서 복원되지 않는다
            (독립검증 B2: 실패 세 줄이 전부 똑같아 구분 불가였다).
        createdAt: { type: string }

    # ───────────────────────────── 공지 (#248) ─────────────────────────────
    ActiveNotice:
      type: object
      required: [id, revision, title, body, priority]
      description: |
        팝업이 그리는 데 필요한 것만. **운영 전용 필드(active·status·deletedAt·createdBy)는 공개
        피드에 싣지 않는다** — 이 엔드포인트는 인증 없이 열려 있다.
      properties:
        id: { type: string, description: ULID }
        revision:
          type: integer
          description: |
            **클라 억제 키의 절반**(`id@revision`). 제목·본문이 실제로 바뀔 때만 서버가 +1 하므로,
            오탈자를 고치면 24시간 억제한 유저에게도 다시 뜨고 노출 토글·우선순위 조정으로는
            다시 뜨지 않는다.
        title: { type: string, maxLength: 100 }
        body:
          type: string
          maxLength: 2000
          description: |
            마크다운 부분집합(줄바꿈·**굵게**·*기울임*·목록·링크·이미지, hero 컨펌 Q7).
            ⚠️ **살균은 렌더 시점의 클라 책임**이다 — `dangerouslySetInnerHTML` 금지, 화이트리스트
            엘리먼트로만 파싱, URL 스킴은 http/https/자체경로만. 서버는 길이 상한만 본다
            (문자열 필터링은 우회되므로 서버 검열을 신뢰 근거로 삼지 않는다).
        startsAt:
          type: [string, "null"]
          format: date-time
          description: |
            노출 시작(포함). null = 즉시 시작. **초 단위로 절삭된 ISO-8601 UTC**
            (`2026-07-30T00:00:00Z`)로 정규화돼 내려간다.
          examples: ["2026-07-30T00:00:00Z"]
        endsAt:
          type: [string, "null"]
          format: date-time
          description: 노출 종료(**포함** — 종료 정각까지 보인다). null = 무기한.
          examples: ["2026-07-31T23:59:00Z"]
        priority:
          type: integer
          description: 클수록 앞. 정렬 = priority DESC, startsAt DESC, id DESC.

    AdminNotice:
      type: object
      required: [id, revision, title, body, priority, active, status, createdAt, updatedAt]
      description: 운영 화면이 보는 한 건 — 공개 피드 + 운영 필드 + **서버가 판정한** status.
      properties:
        id: { type: string }
        revision: { type: integer }
        title: { type: string }
        body: { type: string }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        priority: { type: integer }
        active:
          type: boolean
          description: 운영 스위치. **기간과 별개 축**이다 — "예약해 뒀지만 지금은 내려두고 싶다"를 표현한다.
        status:
          type: string
          enum: [LIVE, SCHEDULED, OFF, EXPIRED, DELETED]
          description: |
            서버 판정(우선순위 DELETED → OFF → EXPIRED → SCHEDULED → LIVE). 화면이 다시 계산하지
            않는다. 중지된 공지에 EXPIRED 를 보여 주면 운영자가 기간을 늘리는 잘못된 조치를 한다.
        deletedAt: { type: [string, "null"], format: date-time }
        createdBy: { type: [string, "null"], description: 생성한 admin 의 userId }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NoticeAsset:
      type: object
      required: [id, url, contentType, byteSize, active, usedBy, createdAt, updatedAt]
      description: 업로드된 공지 이미지 한 건 (#309 W1).
      properties:
        id: { type: string, description: ULID. 서빙 경로의 유일한 식별자이자 저장 파일명의 뿌리 }
        url:
          type: string
          description: |
            본문에 붙일 **상대경로**(`/api/notices/assets/{id}`). **절대 URL 이 아니다.**

            백엔드는 quick tunnel 뒤에 있어 주소가 죽을 때마다 바뀐다(실적: deploy-log
            2026-07-22·07-25). 절대 URL 을 본문에 구우면 터널이 한 번 죽는 순간 **과거 공지
            이미지가 전부 깨지고** 복구가 본문 일괄 수정뿐이다. web 은 렌더 시점에 현재 오리진을
            붙인다(`common/notice-asset-url.ts`) — 자가복구(#183)를 그냥 따라간다.
          examples: ["/api/notices/assets/01KYQ..."]
        originalName:
          type: [string, "null"]
          description: 운영자가 올린 파일명. **표시 전용** — 경로에 쓰지 않는다(경로 탈출 차단).
        contentType:
          type: string
          description: 서버가 **매직바이트로 확정한** 값(클라 신고값이 아니다). 서빙도 이 값으로만 나간다.
          enum: [image/png, image/jpeg, image/webp, image/gif]
        byteSize: { type: integer }
        active:
          type: boolean
          description: |
            노출 스위치. `false` 면 공개 서빙이 404 다. **삭제 필드가 없는 것이 설계다** —
            내리기는 되돌릴 수 있어야 한다(hero 확정 2026-07-30).
        usedBy:
          type: integer
          description: |
            이 이미지를 본문에서 참조하는 **살아 있는 공지 수**. 운영자가 노출을 끄기 전에
            무슨 일이 벌어지는지 알아야 하므로 목록에 싣는다(삭제된 공지는 세지 않는다).
        createdBy: { type: [string, "null"], description: 업로드한 admin 의 userId }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CharBundle:
      type: object
      required: [id, fileCount, byteSize, active, createdAt]
      description: 업로드된 아트 번들 리비전 한 건 (#309 W2).
      properties:
        id: { type: string, description: ULID = 리비전 식별자이자 보관 디렉토리 이름 }
        fileCount: { type: integer }
        byteSize: { type: integer, description: 해제 후 총 바이트 }
        summary:
          type: object
          additionalProperties: true
          description: |
            서버가 매니페스트에서 뽑은 요약(유닛 수·아트 출처·매핑 버전·매핑 선수 수).
            **켜기 전에 무엇인지 확인하라고** 있는 값이다.
        note: { type: [string, "null"], description: 운영자 메모(어느 파이프라인 산출물인가) }
        active:
          type: boolean
          description: |
            지금 서빙 중인가. **최대 하나**를 DB 부분 유니크 인덱스가 강제한다 — 코드로만
            지키면 동시 활성화 두 건이 "새로고침마다 아트가 바뀌는" 상태를 만든다.
        createdBy: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminNoticeUpsertRequest:
      type: object
      required: [title, body, reason]
      description: |
        생성·수정 공통 바디. **수정에서는 전체 치환**이다 — 안 보낸 startsAt/endsAt/priority 는
        지워진다(부분 패치 아님).
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 2000 }
        startsAt:
          type: [string, "null"]
          format: date-time
          description: |
            ISO-8601. `2026-07-30T00:00:00Z` 또는 오프셋 표기(`2026-07-30T09:00:00+09:00`) 둘 다
            받는다. **오프셋 없는 로컬 시각(`2026-07-30T09:00:00`)은 400** — 서버가 존을 추측하면
            공지가 9시간 틀린 시각에 뜬다. 서버가 초 단위 UTC 로 정규화해 저장한다.
          examples: ["2026-07-30T00:00:00Z", "2026-07-30T09:00:00+09:00"]
        endsAt:
          type: [string, "null"]
          format: date-time
          description: "`startsAt < endsAt` 이어야 한다(역전은 400 — 그 공지는 절대 안 보이는데 목록에서는 예약됨처럼 보인다)."
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
          default: 0
        active:
          type: [boolean, "null"]
          description: |
            **생성에서만 유효**(기본 true). 수정에서는 **값이 실려 오면 400**(키가 있어도 `null`
            이면 통과 — 서버는 `active != null` 만 본다) — 전체 치환 규약에서 한 필드만 조용히
            무시하면 운영자가 200 을 받고 "내렸다"고 믿는데 공지는 계속 뜬다.
            노출 변경은 POST /api/admin/notices/{id}/active.
        reason:
          type: string
          maxLength: 500
          description: 운영 사유(필수 — 성공·실패 모두 admin_ops_audit 에 남는다).

    StarterGrantResponse:
      type: object
      required: [granted, player]
      description: "#209 — 가입 지급된 최상위 유닛(연출 재료). 지급이 없으면 granted=false, player=null"
      properties:
        granted:
          type: boolean
        player:
          oneOf:
            - $ref: "#/components/schemas/CatalogPlayer"
            - type: "null"

    TutorialCompleteResponse:
      type: object
      required: [tutorialDone, deckGranted, deck]
      description: "#209 — 튜토리얼 완료 저장 결과. deckGranted = 이번 호출이 실제로 덱을 만들었는가(멱등)"
      properties:
        tutorialDone:
          type: boolean
        deckGranted:
          type: boolean
        deck:
          oneOf:
            - $ref: "#/components/schemas/Deck"
            - type: "null"

    MatchListItem:
      type: object
      required: [id, opponentName, scoreHome, scoreAway, result, createdAt]
      properties:
        userWasHome:
          type: boolean
          description: "P2 additive — 유저 관점 오리엔트 키(연습=true, 리그 어웨이=false). scoreHome/Away는 픽스처 관점 유지"
        id: { type: string }
        opponentName: { type: string }
        scoreHome: { type: [integer, "null"] }
        scoreAway: { type: [integer, "null"] }
        result:
          type: [string, "null"]
          enum: [WIN, DRAW, LOSS]
        createdAt:
          type: string
          format: date-time

    # ───────────────────────────── catalog ─────────────────────────────
    PlayerAttributes:
      type: object
      description: shared PlayerAttributes(packages/shared/src/select-data.ts) — 각 0..100
      required:
        [technical, mental, physical, passing, shooting, tackling, pace, stamina, positioning]
      properties:
        technical: { type: number, minimum: 0, maximum: 100 }
        mental: { type: number, minimum: 0, maximum: 100 }
        physical: { type: number, minimum: 0, maximum: 100 }
        passing: { type: number, minimum: 0, maximum: 100 }
        shooting: { type: number, minimum: 0, maximum: 100 }
        tackling: { type: number, minimum: 0, maximum: 100 }
        pace: { type: number, minimum: 0, maximum: 100 }
        stamina: { type: number, minimum: 0, maximum: 100 }
        positioning: { type: number, minimum: 0, maximum: 100 }

    Grade:
      type: string
      enum: [BRONZE, SILVER, GOLD, DIA, LEGEND]

    Position:
      type: string
      enum: [GK, DF, MF, FW]

    CatalogPlayer:
      type: object
      required: [id, name, position, grade, attributes, owned, ownedCount]
      properties:
        id:
          type: string
          description: "'P001'.. 고유 ID(실선수 아님, data 에픽 시드)"
        name: { type: string }
        position:
          $ref: "#/components/schemas/Position"
        grade:
          $ref: "#/components/schemas/Grade"
        attributes:
          $ref: "#/components/schemas/PlayerAttributes"
        owned:
          type: boolean
        ownedCount:
          type: integer
          minimum: 0
        active:
          type: boolean
          description: >
            #207 U-D7 additive. 카탈로그 운영 플래그(players.active). false = 신규 획득 경로(가챠 추첨 풀·
            트레이드 타깃)에서 빠진 유닛. 비활성이어도 **보유분은 이 목록에 계속 내려오므로**(카드를 뺏지
            않는다) 클라는 이 값으로 도감에 "off"를 표기한다. 필터링 의미는 없고 표기용 관측 필드다.
            required 아님 — 기존 소비자 무영향(additive).

    # ───────────────────────────── deck ─────────────────────────────
    DeckSlot:
      type: object
      required: [playerId, role, slotIndex]
      properties:
        playerId: { type: string }
        role:
          type: string
          enum: [starter, bench]
        slotIndex:
          type: integer
          description: "starter: 0..10(포메이션 슬롯), bench: 0..6"
        promptText:
          type: [string, "null"]
          maxLength: 500
          description: 선수별 사전 프롬프트(≤500자, hmb.deck.player-prompt-max-chars)

    Deck:
      type: object
      required: [id, formation, slots]
      properties:
        id: { type: string }
        formation:
          type: string
          description: "'4-4-2' 등 — 엔진 config 포메이션 키와 일치해야 함"
        teamPrompt:
          type: [string, "null"]
          maxLength: 500
          description: |
            덱 팀 전체 사전 프롬프트(#253, ≤500자 hmb.deck.team-prompt-max-chars).
            선수별 promptText 의 팀 레벨 짝이며, 매치 시점 팀 지시
            (POST /matches/{id}/prompts, phase=pre|halftime)의 **기본값**이다 — 유효 팀 지시는
            덱 ← pre ← halftime 순으로 덮어쓴다. 없으면 null.
        slots:
          type: array
          items:
            $ref: "#/components/schemas/DeckSlot"
        updatedAt:
          type: string
          format: date-time

    DeckUpdateRequest:
      type: object
      required: [formation, slots]
      properties:
        formation:
          type: string
        teamPrompt:
          type: [string, "null"]
          maxLength: 500
          description: |
            덱 팀 전체 사전 프롬프트(#253). 전체 교체 시맨틱이라 **생략/null 은 "지운다"** 이다 —
            유지하려면 매번 실어 보낸다(슬롯과 동일 규칙). 공백만 있으면 없는 것으로 정규화한다.
            초과 시 400 DECK_INVALID(rule=TEAM_PROMPT_TOO_LONG).
        slots:
          type: array
          items:
            $ref: "#/components/schemas/DeckSlot"
          description: |
            starter 슬롯 정확히 11개(slotIndex 0..10, GK≥1 포함), bench ≤7(hmb.deck.bench-max),
            선수 중복 금지, 미보유 선수 금지 — 위반 시 400 DECK_INVALID(AC-S2).

    # ───────────────────────────── presets ─────────────────────────────
    PromptPreset:
      type: object
      required: [id, name, promptText, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        promptText:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time

    PromptPresetCreateRequest:
      type: object
      required: [name, promptText]
      properties:
        name:
          type: string
        promptText:
          type: string
          maxLength: 500

    # ───────────────────────────── shop ─────────────────────────────
    GachaRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [single, ten]

    GachaResultItem:
      type: object
      required: [player, isNew]
      properties:
        player:
          $ref: "#/components/schemas/CatalogPlayer"
        isNew:
          type: boolean
          description: PoC 정책 — 중복은 보유 수량 증가, 능력엔 영향 없음(표시만)

    GachaResponse:
      type: object
      required: [results, wallet]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/GachaResultItem"
          description: single=1개, ten=11개(골드↑ ≥1, pity 적용 가능 — AC-S7)
        wallet:
          $ref: "#/components/schemas/WalletInfo"

    # ───────────────────────────── modes ─────────────────────────────
    ModeInfo:
      type: object
      required: [id, available]
      properties:
        id:
          type: string
          enum: [single, multi]
        available:
          type: boolean
        label:
          type: [string, "null"]
          description: "available=false일 때 표시 문구(예: '준비중', D10)"

    # ───────────────────────────── matches ─────────────────────────────
    MatchState:
      type: string
      description: |
        LLD §5.1 상태머신 + **P4-E2(#170) 확장** — docs/plan-v5/LLD-e2-flow-clock.md §2.

        BRIEFING → GEN1 → **FIRST_HALF**(전반 라이브 재생 창) → **HALFTIME**(감독시간 60초)
        → GEN2 → **SECOND_HALF** → FINISHED. 라이브 단계 전이는 **서버 시계가 소유**한다
        (화면을 안 봐도 진행 — P4-D1/D2).

        `H1_BREAK` 은 **레거시 전용**(P4 이전 배포본의 진행 중 매치를 V8 마이그레이션이 HALFTIME 으로
        옮긴다). 신규 매치는 이 값이 되지 않는다.

        `ABANDONED`(#217, V19)는 **두 번째 터미널 상태**다 — 유저의 포기 또는 방치 스윕으로만
        들어온다. FINISHED 와 달리 결과·보상이 없다(전적에 잡히지 않는다).
      enum: [BRIEFING, GEN1, FIRST_HALF, HALFTIME, SECOND_HALF, GEN2, FINISHED, FAILED, H1_BREAK, ABANDONED]

    ActiveMatchResponse:
      type: object
      description: |
        GET /api/me/active-match (#217 AC1). 끝나지 않은 내 매치와, web 이 그걸로 무엇을 해야
        하는지(강제 재입장 / 포기 버튼 노출)를 **서버가 판정해서** 같이 준다 — 판정 규칙을 클라가
        복제하면 규칙이 바뀔 때 조용히 어긋난다.
      required: [match, locked, abandonable]
      properties:
        match:
          oneOf:
            - $ref: "#/components/schemas/MatchDetail"
            - type: "null"
          description: 끝나지 않은 매치(BRIEFING~FAILED). 없으면 null.
        locked:
          type: boolean
          description: |
            이미 킥오프했나(state ≠ BRIEFING). true 면 web 은 메타 화면(덱·상점·성장·트레이드·
            리그·도감·전적) 진입을 막고 /match/{id} 로 보낸다. BRIEFING 은 false — 로비에
            "이어하기" 안내만 띄운다(강제 이동 아님).
        abandonable:
          type: boolean
          description: 지금 POST /api/matches/{id}/abandon 이 200 을 줄 상태인가(포기 버튼 노출 조건).

    MatchClock:
      type: object
      description: |
        **서버 권위 시계**(P4-D1, #170). 서버는 "지금 어느 단계이고 그 단계가 언제 시작해 언제
        끝나는가"(=창)만 소유하고, 재생 위치(틱)는 클라가 그 창 안에서 계산한다
        (`packages/shared/src/match-clock.ts` 가 매핑의 단일 SoT).

        `MatchDetail.clock = null` 인 경우: 라이브 단계가 아님(BRIEFING/GEN*/FINISHED/FAILED),
        또는 `hmb.match.clock.enabled=false`(롤백), 또는 레거시 매치.
      required:
        [phase, serverNow, halfRealMs, halftimeMs, seekForwardBlocked, seekGraceMs]
      properties:
        phase:
          type: string
          enum: [FIRST_HALF, HALFTIME, SECOND_HALF]
          description: 현재 단계(state 파생 — SoT 는 state).
        kickoffAt:
          type: [string, "null"]
          format: date-time
          description: 전반이 라이브로 열린 시각(AC-W3-3). 전반 로그 저장 시점이며 킥오프 요청 시점이 아니다.
        phaseStartAt:
          type: [string, "null"]
          format: date-time
          description: 현재 단계 시작. null = 시계 미적용(레거시·롤백).
        phaseEndsAt:
          type: [string, "null"]
          format: date-time
          description: 현재 단계 종료 예정. HALFTIME 이면 **감독시간 deadline**.
        serverNow:
          type: string
          format: date-time
          description: 응답 생성 시각 — 클라 시계 스큐 보정 기준.
        halfRealMs:
          type: integer
          description: 하프당 실시간 재생 길이(config `hmb.match.clock.half-real-ms`). 압축비는 이 값에서 파생.
        halftimeMs:
          type: integer
          description: 감독시간 길이(config, P4-D2 = 60000).
        seekForwardBlocked:
          type: boolean
          description: 라이브 앞서가기 금지(config). 뒤로 스크럽은 항상 자유.
        seekGraceMs:
          type: integer
          description: 지연·스큐 허용 오차(config).

    OpponentAnalysisPlayer:
      type: object
      required: [name, position, grade]
      properties:
        name: { type: string }
        position:
          $ref: "#/components/schemas/Position"
        grade:
          $ref: "#/components/schemas/Grade"
        hasPrompt:
          type: boolean

    OpponentAnalysis:
      type: object
      required: [name, analysisText, deck]
      properties:
        name: { type: string }
        analysisText: { type: string }
        deck:
          type: array
          items:
            $ref: "#/components/schemas/OpponentAnalysisPlayer"
          minItems: 11
          maxItems: 11

    MatchDetail:
      type: object
      description: |
        state에 따라 일부 필드만 채워진다: BRIEFING → opponent 포함. HALFTIME(구 H1_BREAK) 이후 →
        scoreH1Home/Away. FINISHED → scoreHome/Away+result. FAILED → failReason.
        라이브 단계(FIRST_HALF/HALFTIME/SECOND_HALF) → clock(P4-E2 #170).
        후반 스코어는 **FINISHED 전까지 노출하지 않는다**(재생 중 스포일러 금지).
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        state:
          $ref: "#/components/schemas/MatchState"
        failReason:
          type: [string, "null"]
        opponent:
          $ref: "#/components/schemas/OpponentAnalysis"
        scoreH1Home: { type: [integer, "null"] }
        scoreH1Away: { type: [integer, "null"] }
        scoreHome: { type: [integer, "null"] }
        scoreAway: { type: [integer, "null"] }
        result:
          type: [string, "null"]
          enum: [WIN, DRAW, LOSS]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        clock:
          description: |
            서버 권위 시계(P4-E2 #170, additive). 라이브 단계가 아니거나 시계 비활성이면 null.
          oneOf:
            - $ref: "#/components/schemas/MatchClock"
            - type: "null"
        auto:
          type: boolean
          description: |
            오토 모드(#249, additive). true 면 전반 종료 시 감독시간 없이 후반이 바로 시작된다.
            변경은 `POST /api/matches/{id}/auto`. 구 매치·기본값은 false.

            ⚠️ 이 값이 true 여도 운영 스위치(`hmb.match.auto.enabled=false`)가 내려가 있으면 흐름은
            정상 감독시간이다 — 그건 롤백 상태이고 클라가 알 필요는 없다.

    CreateMatchRequest:
      type: object
      properties:
        botId:
          type: [string, "null"]
          description: "생략 시 랜덤 봇(BOT_ATK/BOT_DEF/BOT_BAL 중, PRD §3.4)"

    MatchPromptRequest:
      type: object
      required: [phase, scope, text]
      properties:
        phase:
          type: string
          enum: [pre, halftime]
        scope:
          type: string
          enum: [team, player]
        playerId:
          type: [string, "null"]
          description: "scope='player'일 때 필수"
        text:
          type: string
          maxLength: 500

    SubstitutionItem:
      type: object
      required: [out, "in"]
      properties:
        out:
          type: string
          description: playerId(전반 선발)
        "in":
          type: string
          description: playerId(벤치)

    HalftimeRequest:
      type: object
      required: [substitutions]
      properties:
        substitutions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SubstitutionItem"
          description: |
            ≤3(hmb.match.halftime-subs-max), out∈전반 선발, in∈벤치, 교체 후 GK≥1.
            **생략 = 손대지 않음**(앞서 낸 교체 유지) / **빈 배열 = 교체 전부 취소**(명시적 의사).
      description: |
        ⚠️ Phase2 추가 필드 — teamTactics(#254 — 감독시간 팀 전술) · formation + starters
        (#276 — 감독시간 포메이션·선발 배치) — 는 openapi-v2 `HalftimeRequestPhase2Fields` 가
        소유한다(스펙 2개는 각각 독립 생성물이라 교차 $ref 금지).

    MatchResult:
      type: object
      required: [matchId, scoreHome, scoreAway, result]
      properties:
        matchId: { type: string }
        scoreHome: { type: integer }
        scoreAway: { type: integer }
        result:
          type: string
          enum: [WIN, DRAW, LOSS]
        pointsAwarded:
          type: integer
          description: 승/무/패 보상(economy.v1.json 수치, 멱등 지급 — AC-M6)
        teamStats:
          type: object
          additionalProperties: true
          description: 팀 스탯 요약(슛/점유율 등) — 상세는 W3 구현에서 확정
        playerStats:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 선수별 스탯 리스트 — 상세는 W3 구현에서 확정

    # ───────────────────────────── shared 계약(느슨한 stub) ─────────────────────────────
    SelectData:
      type: object
      description: |
        packages/shared/src/select-data.ts (zod SoT). home/away 각각 TeamRoster
        {name, players: PlayerCard[]}. PlayerCard = {playerId, name, position, attributes}.
        여기서는 필드 상세를 반복하지 않고 존재만 계약한다 — zod 스키마가 진실.
      required: [home, away]
      properties:
        home:
          type: object
          additionalProperties: true
        away:
          type: object
          additionalProperties: true

    TacticalInput:
      type: object
      description: |
        packages/shared/src/tactical-input.ts (zod SoT). AI가 프롬프트로부터 생성하는
        선수별 행동 파라미터 세트이자 결정론 엔진 입력. 필드: seed(string, uint64를 10진
        문자열로), team(TeamInput: formation·defensiveLineHeight·compactness·tempo·width·
        pressingScheme·offsideTrap), players(PlayerInput[]: playerId·role·duty·basePosition·
        behavior·markTarget?·mentalModifier), meta?(generatedAt?·promptHash?).
      required: [seed, team, players]
      properties:
        seed:
          type: string
        team:
          type: object
          additionalProperties: true
        players:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: [object, "null"]
          additionalProperties: true

    MatchLog:
      type: object
      description: |
        packages/shared/src/match-log.ts (zod SoT). 결정론 엔진 출력 — 틱별 좌표 스냅샷 +
        이벤트 시계열 + 최종 스코어 + 틱 해시(재현/desync 검증). 필드: configVersion, seed,
        tickSnapshots(TickSnapshot[]: tick·minute·ball·ballOwner·players·hash),
        events(MatchEvent[]: tick·minute·type·team?·playerId?·xg?·detail?), finalScore
        {home,away}. AC-M3: 이 응답은 zod MatchLog로 파싱 가능해야 한다.
      required: [configVersion, seed, tickSnapshots, events, finalScore]
      properties:
        configVersion:
          type: string
        seed:
          type: string
        tickSnapshots:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        finalScore:
          type: object
          properties:
            home: { type: integer }
            away: { type: integer }

    # ───────────────────────────── internal ai-jobs ─────────────────────────────
    AiJobPollRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        waitMs:
          type: integer
          maximum: 25000
          default: 25000
          description: long-poll 최대 대기(ms). virtual thread라 블로킹 허용(LLD §6).

    AiJobContext:
      type: object
      description: |
        AI 실행기 입력(LLD-ts-servants §3과 동일 계약, LLD-server-java §5.2). kind='team-input'
        고정. 필드: matchId, side(home|away), half(1|2), seed, formation, roster(11명
        {playerId,name,position,attributes,slotIndex}), teamPrompt, playerPrompts
        ({playerId: text}), prevSummary?(half2만: {scoreHome,scoreAway,shots,possessionHint}).
      required: [kind, matchId, side, half, seed, formation, roster, teamPrompt, playerPrompts]
      properties:
        kind:
          type: string
          enum: [team-input]
        matchId: { type: string }
        side:
          type: string
          enum: [home, away]
        half:
          type: integer
          enum: [1, 2]
        seed: { type: string }
        formation: { type: string }
        roster:
          type: array
          items:
            type: object
            additionalProperties: true
        teamPrompt: { type: string }
        playerPrompts:
          type: object
          additionalProperties:
            type: string
        prevSummary:
          type: [object, "null"]
          additionalProperties: true

    AiJobUsage:
      type: object
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cacheReadTokens: { type: integer }
        cacheCreateTokens: { type: integer }
        costUSD: { type: number }

    AiJob:
      type: object
      required: [id, status, context]
      properties:
        id:
          type: string
          description: promptHash(멱등 키, sha256 hex 16+)
        matchId: { type: [string, "null"] }
        side:
          type: [string, "null"]
          enum: [home, away]
        half:
          type: [integer, "null"]
          enum: [1, 2]
        status:
          type: string
          enum: [queued, leased, done, failed]
        context:
          $ref: "#/components/schemas/AiJobContext"
        result:
          $ref: "#/components/schemas/TacticalInput"
        error:
          type: [string, "null"]
        usage:
          $ref: "#/components/schemas/AiJobUsage"
        attempts:
          type: integer
        leaseUntil:
          type: [string, "null"]
          format: date-time

    AiJobCompleteRequest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        output:
          $ref: "#/components/schemas/TacticalInput"
          description: ok=true일 때 필수
        error:
          type: [string, "null"]
          description: ok=false일 때 필수(attempts<max면 queued 복귀, 아니면 failed — LLD §6)
        usage:
          $ref: "#/components/schemas/AiJobUsage"

    InternalHealth:
      type: object
      required: [queueDepth, leasedCount]
      properties:
        queueDepth:
          type: integer
          description: status='queued' 개수
        leasedCount:
          type: integer
          description: status='leased' 개수

    # ───────────────────────── admin (P3 §C, additive) ─────────────────────────
    AdminUserRow:
      type: object
      required: [id, nickname, authProvider, isAdmin, points, createdAt]
      description: |
        운영 목록/상세의 유저 요약. **비밀번호 필드는 존재하지 않는다**(AC-A2 연장) —
        서버 조회 SQL 도 users.password 를 나열하지 않는다.
      properties:
        id: { type: string }
        nickname: { type: string }
        authProvider:
          type: string
          description: "guest / mock:google / mock:apple / local"
        isAdmin: { type: boolean }
        points:
          type: integer
          format: int64
          description: 지갑 잔액
        createdAt: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserRow"
        total:
          type: integer
          format: int64
          description: 검색 조건에 맞는 전체 건수(페이지 크기 아님)
        limit: { type: integer }
        offset: { type: integer }

    AdminUserDetail:
      type: object
      required: [user, players, presets, records]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserRow"
        players:
          type: object
          required: [distinct, total]
          properties:
            distinct: { type: integer, format: int64, description: 보유 선수 종류 수 }
            total: { type: integer, format: int64, description: 중복 포함 총 보유 수 }
        deck:
          type: [object, "null"]
          description: 활성 덱 요약(없으면 null)
          required: [id, name, formation, starters, bench, updatedAt]
          properties:
            id: { type: string }
            name: { type: string }
            formation: { type: string }
            starters: { type: integer }
            bench: { type: integer }
            updatedAt: { type: string, format: date-time }
        presets:
          type: object
          required: [promptPresets, teamPresets]
          properties:
            promptPresets: { type: integer, format: int64 }
            teamPresets: { type: integer, format: int64 }
        records:
          $ref: "#/components/schemas/MatchRecordSummary"

    AdminGrantPointsRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          format: int64
          description: 0 이 아닌 정수. 양수=지급, 음수=차감(차감 후 잔액이 음수면 400).
        reason:
          type: string
          maxLength: 500
          description: 운영 사유(감사 로그에 그대로 기록된다). 공백만이면 400.

    AdminGrantPointsResult:
      type: object
      required: [userId, delta, applied, balance, idempotencyKey]
      properties:
        userId: { type: string }
        delta: { type: integer, format: int64 }
        applied:
          type: boolean
          description: false = 같은 멱등키의 재전송이라 아무것도 바뀌지 않았다.
        balance:
          type: integer
          format: int64
          description: 처리 후 지갑 잔액(재전송이면 현재 잔액).
        idempotencyKey:
          type: string
          description: 실제 사용된 멱등키(헤더 미제공 시 서버가 채번한 값).
        auditId:
          type: [string, "null"]
          description: 기록된 admin_audit 행 ID(재전송이면 null).

    # ── 어드민 유닛 카탈로그 (#207 파트 A) — additive ───────────────────────
    AdminUnitAuditAction:
      type: string
      enum: [unit_create, unit_update, unit_deactivate, unit_activate, unit_override_reset]

    AdminUnit:
      type: object
      required: [id, name, position, grade, attributes, personality, active, adminLocked, dataVersion]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes: { $ref: "#/components/schemas/PlayerAttributes" }
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active:
          type: boolean
          description: |
            false = **신규 획득 경로에서만** 제외(가챠 풀·트레이드 타깃·도감 미보유분).
            보유분은 그대로 쓸 수 있다 — 덱 편성·성장·매치 전부 정상 동작한다.
        adminLocked:
          type: boolean
          description: |
            true = 어드민이 만진 행이라 **부팅 시드 재임포트가 덮지 않는다**.
            DELETE /units/{id}/override 로 풀면 다음 부팅에 시드가 다시 이긴다.
        dataVersion:
          type: string
          description: "임포트 원본 시드 버전(예 v2.2). 어드민이 만든 행은 'admin'."

    AdminUnitSeedEntry:
      type: object
      description: export 전용 — 시드 파일(players.vX.json) 한 항목과 동일한 형태·키 순서.
      required: [id, name, position, grade, attributes, personality, active]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes: { $ref: "#/components/schemas/PlayerAttributes" }
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active: { type: boolean }

    AdminUnitPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUnit" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    AdminUnitHoldings:
      type: object
      description: 영향 규모 — 등급·활성 변경 전에 운영자가 보는 값.
      required: [owners, copies]
      properties:
        owners:
          type: integer
          format: int64
          description: 이 유닛을 보유한 유저 수(중복 제외).
        copies:
          type: integer
          format: int64
          description: 보유 장수 합(중복 획득 포함).

    AdminUnitAuditEntry:
      type: object
      required: [id, actorUserId, playerId, action, changedFields, reason, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        playerId: { type: string }
        action: { $ref: "#/components/schemas/AdminUnitAuditAction" }
        before:
          type: object
          additionalProperties: true
          description: 변경 **전 전체 스냅샷**(unit_create 는 빈 객체).
        after:
          type: object
          additionalProperties: true
          description: 변경 **후 전체 스냅샷**.
        changedFields:
          type: array
          items: { type: string }
          description: 실제로 달라진 필드(두 스냅샷에서 파생된 조회 편의값).
        reason: { type: string }
        idemKey: { type: [string, "null"] }
        createdAt: { type: string }

    AdminUnitAuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUnitAuditEntry" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    AdminUnitDetail:
      type: object
      required: [unit, holdings, recentAudit]
      properties:
        unit: { $ref: "#/components/schemas/AdminUnit" }
        holdings: { $ref: "#/components/schemas/AdminUnitHoldings" }
        recentAudit:
          type: array
          items: { $ref: "#/components/schemas/AdminUnitAuditEntry" }

    AdminUnitGradeImpact:
      type: object
      description: |
        등급 변경이 기보유 카드에 미치는 **실측** 영향. 등급 하향 409 의 detail 로 실린다.
        근사식이 아니라 실제 유효스탯 계산을 등급만 바꿔 두 번 돌린 차이다.
      required: [fromGrade, toGrade, capLowered, affectedUsers, avgOvrDelta, worstOvrDelta, computed]
      properties:
        fromGrade: { $ref: "#/components/schemas/Grade" }
        toGrade: { $ref: "#/components/schemas/Grade" }
        capLowered:
          type: boolean
          description: 새 등급의 밴드 상한이 더 낮다(= 성장 캡이 내려간다).
        affectedUsers: { type: integer, format: int64 }
        avgOvrDelta:
          type: number
          description: 보유자 전원의 유효 OVR 변화 평균(음수 = 손실).
        worstOvrDelta:
          type: number
          description: 가장 크게 깎이는 카드 한 장의 변화(음수 = 손실).
        computed:
          type: boolean
          description: |
            false = 경제 설정 부재로 델타를 계산하지 못했다.
            이때 0 은 "영향 없음"이 아니므로 보수적으로 다뤄야 한다.

    AdminUnitMutationResult:
      type: object
      required: [applied, idempotencyKey, changedFields]
      properties:
        unit: { $ref: "#/components/schemas/AdminUnit" }
        applied:
          type: boolean
          description: false = 같은 멱등키의 재전송이라 아무것도 바뀌지 않았다(unit 은 현재값).
        idempotencyKey:
          type: string
          description: 실제 사용된 멱등키(헤더 미제공 시 서버가 채번한 값).
        auditId: { type: [string, "null"] }
        changedFields:
          type: array
          items: { type: string }
        impact:
          oneOf:
            - { $ref: "#/components/schemas/AdminUnitGradeImpact" }
            - { type: "null" }
          description: 등급 변경이 동반된 경우의 실측 영향(그 외 null).

    AdminReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: 운영 사유. 필수 — 사유 없는 카탈로그 변경은 허용하지 않는다.

    AdminUnitCreateRequest:
      type: object
      required: [name, position, grade, attributes, reason]
      properties:
        name: { type: string, maxLength: 60 }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes:
          allOf:
            - $ref: "#/components/schemas/PlayerAttributes"
          description: 9종 **전부** 필요(누락 시 400). 각 값 0~100 정수.
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
          description: 생략 시 CALM.
        active:
          type: boolean
          description: 생략 시 true.
        reason: { type: string, maxLength: 500 }

    AdminUnitPatchRequest:
      type: object
      description: 지정한 필드만 바뀐다. 최소 1개는 지정해야 한다(0개면 400).
      required: [reason]
      properties:
        name: { type: string, maxLength: 60 }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: |
            **키 단위 병합**(전체 교체 아님) — 지정한 능력치만 덮어쓰고 나머지는 보존한다.
            알 수 없는 키는 400.
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active: { type: boolean }
        confirmImpact:
          type: boolean
          description: |
            등급을 **낮출 때만** 필요. 없으면 409 + detail(AdminUnitGradeImpact).
            등급 상향·동일에는 영향이 없으므로 요구하지 않는다.
        reason: { type: string, maxLength: 500 }

    EngineConfigRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: object
          description: |
            **점경로 맵**. 예: `{"contest.shootXgThreshold": 0.07, "contest.shootRange": 22}`.
            (⚠️ `decisionWeights.*` 는 예로 쓰지 마라 — 8개 전부 #338 INERT 라 400 이다.)
            중첩 JSON 이 아닌 이유는 **오타가 조용히 죽지 않게** 하기 위해서다 — 중첩 deep-merge 는
            존재하지 않는 키를 200 으로 삼키고 아무 일도 안 한다("필드가 계약에 있다 ≠ 엔진이 읽는다",
            #321·#337·#338). 평평한 경로는 기본 config 의 리프 전수와 집합 대조가 되므로 미지 경로가
            곧 400 이다 — 단 **작성 시점에만** 그렇다. 이미 매치에 박힌 오버레이의 재생은 그 사이
            엔진이 노브를 지웠어도 죽지 않고 그 경로를 버린 뒤 보고한다(#383 B3).
            값은 number 또는 boolean 만. EngineConfig 의 비수치 리프는 **넷**이고(`version`·`coordMode`·
            `formations` + **`chain.mode`**) 앞의 셋은 구조, `chain.mode` 는 결정 코어 롤백 스위치라
            문자열이다 — 넷 다 배포로만 바뀐다. **빈 객체 = 기본값 복귀(롤백)**.
          additionalProperties:
            oneOf: [{ type: number }, { type: boolean }]
        reason:
          type: string
          maxLength: 500
          description: 운영 사유. PUT 에서는 **필수**(원장에 남는다). validate 에서는 무시된다.
    EngineConfigView:
      type: object
      properties:
        revisionId: { type: string, nullable: true, description: "null = 오버레이 없음(러너 기본값)" }
        overrides: { type: object, additionalProperties: true }
        effectiveConfigHash: { type: string, nullable: true, description: "러너가 계산한 **유효 config 전체**의 지문" }
        actor: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        changedAt: { type: string, nullable: true }
        appliesTo:
          type: string
          description: |
            **언제부터 적용되나**를 서버가 말해 준다. 이게 없으면 운영자가 "왜 아직 안 바뀌었나"를 묻게 된다 —
            진행 중 매치는 시작 시점 스냅샷으로 끝까지 돌기 때문이다.
    EngineConfigRevision:
      type: object
      properties:
        id: { type: string }
        overridesJson: { type: string, description: "정본(키 정렬) 오버레이 **전체 스냅샷**(델타 아님)" }
        effectiveHash: { type: string }
        actor: { type: string }
        reason: { type: string }
        requestHash: { type: string, description: "멱등 판정의 **유일** 기준" }
        createdAt: { type: string }
    EngineConfigKnobs:
      type: object
      properties:
        engineVersion: { type: string }
        caveat:
          type: string
          description: |
            **"설정 가능하다 ≠ 경기가 달라진다"** 를 응답에 적어 보내는 단서(#383 M5).
            이 필터는 엔진 #338 레지스트리 **등재분만** 걷어내고, 등재 밖에도 실행 경로가 없는
            노브가 더 있다(#393). 문서에만 두면 스키마로 클라이언트를 만든 쪽이 목록을 전수로
            믿으므로 **응답의 일부**로 나간다. 계약 = `config-http.test.ts`.
        knobs:
          type: array
          description: |
            **설정 가능한** 경로. 무효 노브(#338)는 여기 없다 — `inertKnobs` 참조.
          items:
            type: object
            properties:
              path: { type: string }
              type: { type: string, enum: [number, boolean] }
              value: { oneOf: [{ type: number }, { type: boolean }] }
        inertKnobs:
          type: array
          description: |
            **실행 경로가 없는 노브**(#338 레지스트리) — 값을 바꿔도 경기가 비트 단위로 동일하다.
            PUT·validate 는 이 경로를 400 으로 거부한다(작성 게이트). 다만 **이미 매치에 박힌
            오버레이의 재생은 막지 않는다** — 엔진이 노브를 LIVE→INERT 로 옮길 때(0.24.0 이 17개를
            한 번에 옮겼다) 진행 중 매치가 전부 죽는 것이 #241 이기 때문이다.
          items:
            type: object
            properties:
              path: { type: string }
              value: { oneOf: [{ type: number }, { type: boolean }] }
              reason: { type: string, description: 왜 못 만지는지(운영자가 소스를 뒤지지 않도록) }
    EngineConfigValidateResult:
      type: object
      properties:
        effectiveConfigHash: { type: string }
        engineVersion: { type: string }
        changed:
          type: array
          description: 무엇이 무엇으로 바뀌는가(기본값 대비 diff)
          items:
            type: object
            properties:
              path: { type: string }
              from: { oneOf: [{ type: number }, { type: boolean }] }
              to: { oneOf: [{ type: number }, { type: boolean }] }
        smoke:
          type: array
          description: 시드별 **구조 불변식** 실측(밸런스 밴드가 아니다)
          items:
            type: object
            properties:
              seed: { type: string }
              ticks: { type: integer }
              events: { type: integer }
              passEventsHome: { type: integer }
              passEventsAway: { type: integer }
              ownerChanges: { type: integer }
