openapi: 3.1.0
info:
  title: HMB 온라인 — server-java API
  version: "0.1.0"
  license:
    name: Proprietary
    identifier: "UNLICENSED"
  description: |
    권위 게임 서버(Java/Spring Boot) API 계약. SoT는 이 파일이다(springdoc이 생성하는 스펙은
    구현 확인용 — 드리프트는 계약 테스트로 검출한다, LLD-server-java.md §1).

    요구사항/AC = docs/plan-v2/PRD-v2.md §3.2~3.6. DB = docs/plan-v2/ERD.md. 구현 상세 =
    docs/plan-v2/LLD-server-java.md.

    - 의존 방향: web → server-java → (ts-servants → engine). 웹은 이 API만 안다.
    - `/api/**` 는 `Authorization: Bearer <token>` 필요(로그인 자체는 제외). `/internal/**` 는
      서번트 전용 `X-Servant-Token`.
    - 에러 규약(전 엔드포인트 공통): `ApiError` 스키마. `code` 값은 `ErrorCode` 열거 참조.
    - `TacticalInput` / `SelectData` / `MatchLog` 는 `packages/shared` (zod)가 상세를 소유한다.
      여기서는 필드 설명이 있는 느슨한 오브젝트로만 정의(계약 상세는 zod가 SoT) — 필드명은
      zod 스키마와 반드시 일치시킨다(camelCase).

servers:
  - url: http://localhost:8080
    description: local dev

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 목업 로그인(닉네임) + 세션 발급 (D8)
  - name: me
    description: 내 프로필·지갑·전적
  - name: catalog
    description: 선수 도감(카탈로그 전체 + 보유 플래그)
  - name: deck
    description: 덱 구성(선발 11 + 벤치 ≤7 + 선수별 프롬프트)
  - name: presets
    description: 프롬프트 프리셋 CRUD
  - name: shop
    description: 뽑기(단뽑/10연뽑)
  - name: modes
    description: 게임 모드 목록(싱글/멀티)
  - name: matches
    description: >-
      매치 상태머신(BRIEFING→GEN1→FIRST_HALF→HALFTIME→GEN2→SECOND_HALF→FINISHED, §5.1 +
      P4-E2 #170 서버 권위 시계. H1_BREAK 은 레거시 전용)
  - name: internal
    description: 서번트 전용 AI 잡 큐 프로토콜(X-Servant-Token)

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 닉네임 로그인(목업, D8) — 신규면 유저+지갑 생성
      security: [] # 로그인 자체는 인증 불필요
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공(신규/기존 공통)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: |
            자체 로그인(provider=local) 인증 실패 — 계정 미존재/비번 불일치/비번 없는 계정.
            code=BAD_CREDENTIALS(계정 존재 여부를 누설하지 않도록 사유를 구분하지 않는다). P3 §A.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: |
        자체 로그인 회원가입(P3-D2, additive) — id(=nickname)+비번. 성공 시 로그인과 동일한
        세션 토큰을 즉시 발급하고 신규 유저 온보딩(지갑+스타터 팩+원장)을 태운다.
        ⚠️ 비번 평문 저장은 내부 테스터 배포용 임시 목업 — 해시 전환은 백로그.
      security: [] # 가입 자체는 인증 불필요
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 가입 성공(isNew=true) — 응답에 비번은 절대 포함되지 않는다(AC-A2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/DuplicateNickname"

  # ───────────────────────────── me ─────────────────────────────
  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 정보(유저+지갑+전적)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/starter-grant:
    get:
      tags: [me]
      operationId: getStarterGrant
      summary: |
        가입 시 지급된 **최상위 유닛**(#209 AC1/AC3). 후보 목록은 서버 코드가 아니라 data 발행물
        (economy.starterTop.pool)이고, 실제 지급은 가입 트랜잭션이 starter_grants 에 박제한다 —
        이 엔드포인트는 그 박제를 읽을 뿐 재계산하지 않는다(목록이 바뀌어도 과거 지급이 안 흔들린다).
        개편 이전 가입 계정은 granted=false.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterGrantResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/tutorial-complete:
    post:
      tags: [me]
      operationId: completeTutorial
      summary: |
        온보딩 튜토리얼 완료/건너뛰기 저장(#209 AC2). **멱등** — 몇 번을 불러도 덱은 한 번만 생긴다.
        활성 덱이 없으면 보유 카드로 기본 덱을 지급하고(deckGranted=true), 이미 있으면 절대
        덮어쓰지 않는다(deckGranted=false). 건너뛰기도 같은 경로다(덱 없이는 경기가 불가능하므로).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorialCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/active-match:
    get:
      tags: [me]
      operationId: getActiveMatch
      summary: |
        진행 중(끝나지 않은) 내 매치 — **재입장의 유일한 진입점**(#217 AC1).

        web 은 로그인 직후·로비 진입마다 이걸 물어 locked 면 /match/{id} 로 보낸다. 새로고침·
        재로그인·다른 기기가 같은 답을 받는 이유는 상태가 서버에만 있기 때문이다(로컬 저장 0).
        응답이 MatchDetail 통짜라 clock 이 같이 와서 seek-to-now 를 한 번의 요청으로 태운다.
      responses:
        "200":
          description: OK (없으면 match=null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveMatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/matches:
    get:
      tags: [me]
      operationId: listMyMatches
      summary: 전적 리스트(최근 20)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────── catalog ─────────────────────────────
  /api/players:
    get:
      tags: [catalog]
      operationId: listPlayers
      summary: 카탈로그 전체(110명) + 보유 플래그(도감/덱 화면 공용)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogPlayer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────── deck ─────────────────────────────
  /api/deck:
    get:
      tags: [deck]
      operationId: getDeck
      summary: 활성 덱 + 슬롯 + 선수별 프롬프트
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 아직 덱이 없음(신규 유저가 스타터 팩 지급 전 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [deck]
      operationId: updateDeck
      summary: 덱 전체 교체(부분수정 없음) — AC-S2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckUpdateRequest"
      responses:
        "200":
          description: 저장된 덱(재조회와 동일)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
        "400":
          description: |
            검증 실패 — 보유하지 않은 선수/starter≠11/GK 0명(starter 중)/bench>7/중복 선수/
            프롬프트 길이 초과. code=DECK_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            #217 매치 잠금 — 이미 킥오프한 매치가 있다(덱은 하프타임 교체 벤치의 원장이라 진행 중에
            바뀌면 화면과 매치 스냅샷이 어긋난다). code=MATCH_IN_PROGRESS, detail={matchId,state,action}.
            **BRIEFING 중에는 잠기지 않는다** — 킥오프 재캡처(AC-B2)가 지원하는 창이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ───────────────────────────── presets ─────────────────────────────
  /api/presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: 프리셋 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptPreset"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [presets]
      operationId: createPreset
      summary: 프리셋 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPresetCreateRequest"
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPreset"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/presets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [presets]
      operationId: deletePreset
      summary: |
        프리셋 삭제(수정=삭제+생성으로 단순화, LLD §4). 이미 덱에 복사 저장된 prompt_text는
        유지된다(AC-S4).
      responses:
        "204":
          description: 삭제됨
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────── shop ─────────────────────────────
  /api/shop/gacha:
    post:
      tags: [shop]
      operationId: gacha
      summary: 뽑기(단뽑/10연뽑) — LLD §4.1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GachaRequest"
      responses:
        "200":
          description: 뽑기 결과 + 갱신된 지갑
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GachaResponse"
        "400":
          description: 잘못된 kind 등. code=VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: 잔액 부족(또는 400 — 서버 구현 선택, AC-S6). code=INSUFFICIENT_POINTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────── modes ─────────────────────────────
  /api/modes:
    get:
      tags: [modes]
      operationId: listModes
      summary: 게임 모드 목록(싱글 available, 멀티 "준비중" — D10)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────────── matches ─────────────────────────────
  /api/matches:
    post:
      tags: [matches]
      operationId: createMatch
      summary: 매치 생성(BRIEFING 진입) — 봇 매칭 + 활성 덱 스냅샷 + 시드 생성
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: 생성됨(state=BRIEFING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "400":
          description: 활성 덱이 유효하지 않음(AC-S2 규칙 재검증). code=DECK_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            끝나지 않은 매치가 이미 있음(#217 AC2). code=MATCH_IN_PROGRESS,
            detail={matchId,state,action} — 그 매치로 이어가거나 포기해야 새로 만들 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/matches/{id}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [matches]
      operationId: getMatch
      summary: |
        매치 상태 조회(폴링용). BRIEFING이면 opponent(상대 분석) 포함. state별로 노출 필드가
        다르다 — 상세는 MatchDetail 스키마 설명 참고(§5.1).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/matches/{id}/prompts:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: submitMatchPrompt
      summary: 팀/선수 프롬프트 입력(phase=pre|halftime) — 같은 대상 재입력은 UPSERT
      description: |
        허용 상태(그 외 409 INVALID_STATE): phase=`pre` → BRIEFING /
        phase=`halftime` → **FIRST_HALF 또는 HALFTIME**(P4-E2 #170 — 전반을 보면서 후반 지시를
        미리 써두고, 감독시간에 마저 고칠 수 있다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchPromptRequest"
      responses:
        "200":
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/kickoff:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: kickoffMatch
      summary: 킥오프 — 양팀 half1 AI 잡 enqueue, BRIEFING → GEN1
      responses:
        "202":
          description: 잡 큐잉됨(state=GEN1). 클라이언트는 GET /api/matches/{id} 폴링.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/halves/{half}/log:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: half
        in: path
        required: true
        schema:
          type: integer
          enum: [1, 2]
    get:
      tags: [matches]
      operationId: getHalfLog
      summary: half별 MatchLog(재생용) — AC-M3, zod MatchLog 스키마와 계약
      description: |
        허용 상태(그 외 409): half=1 → FIRST_HALF·HALFTIME·GEN2·SECOND_HALF·FINISHED /
        half=2 → **SECOND_HALF·FINISHED**.

        로그는 해당 하프 **전체**를 내려준다. 라이브 재생 중 "앞서가기 금지"는 `MatchDetail.clock`
        기반 **클라 강제**다(P4-E2 R3 — 서버 절단은 PvP 백로그, 루트 §7 PvP-ready 경계와 정합).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 매치/half 없음 또는 아직 시뮬 전(state 미도달)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/halftime:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: submitHalftimeSubs
      summary: 하프타임 교체 저장(≤3, 벤치→선발만, resume 시 반영) — §5.4, AC-M4
      description: |
        허용 상태(그 외 409): **FIRST_HALF·HALFTIME**(P4-E2 #170 — 전반 중 미리 짜두고 감독시간에 확정).
        상태 전이는 없다(후반 시뮬에서 반영).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HalftimeRequest"
      responses:
        "200":
          description: 저장됨(상태 전이는 없음 — resume에서 반영)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "400":
          description: |
            교체 규칙 위반(3명 초과·벤치 외 선수·GK 퇴장 후 GK 0). code=SUBSTITUTION_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: resumeMatch
      summary: 후반 시작 — half2 AI 잡 enqueue(전반 요약 컨텍스트 포함), HALFTIME → GEN2
      description: |
        허용 상태 = **HALFTIME 만**. FIRST_HALF 에서 호출하면 409 — 후반 앞당기기는 금지다(P4-D1).

        감독시간(`clock.phaseEndsAt`)이 만료되면 **서버가 같은 전이를 자동 수행**한다
        (`hmb.match.clock.auto-resume-on-expiry`). 이때 하프타임 프롬프트가 없으면 **전반 인풋이
        그대로 승계**된다(AI 콜 0 — AC-W2-2).
      responses:
        "202":
          description: 잡 큐잉됨(state=GEN2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/result:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [matches]
      operationId: getMatchResult
      summary: 최종 결과(스코어·팀/선수 스탯·리포트). FINISHED에서만 의미 있음(읽기 전용) — §5.5
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  /api/matches/{id}/abandon:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: abandonMatch
      summary: |
        매치 포기(#217 AC3) — ACTIVE → ABANDONED. 잠금(유저당 미완 매치 1개)의 탈출구다:
        이게 없으면 고아 매치 하나가 계정을 영구히 잠근다.

        허용 조건은 서버가 판정한다(리롤 방지): BRIEFING(킥오프 전) · FAILED(생성 실패) ·
        시계가 멈춘 라이브(phase_ends_at + stuck-grace 경과). **정상 재생 중에는 409** —
        지고 있는 경기를 버리고 다시 뽑는 리롤을 막는다. 지금 포기 가능한지는
        GET /api/me/active-match 의 abandonable 로 알 수 있다.
      responses:
        "200":
          description: 회수됨(state=ABANDONED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 포기할 수 없는 상태(정상 재생 중이거나 이미 종료). code=INVALID_STATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/matches/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [matches]
      operationId: retryMatch
      summary: FAILED 매치의 실패 지점 재큐잉 — AC-M7
      responses:
        "202":
          description: 재큐잉됨(실패 직전 GEN* 상태로 복귀)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState"

  # ───────────────────────────── internal (서번트 전용) ─────────────────────────────
  /internal/ai-jobs/poll:
    post:
      tags: [internal]
      operationId: pollAiJob
      summary: AI 잡 long-poll lease — LLD §6
      security:
        - servantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiJobPollRequest"
      responses:
        "200":
          description: 잡 1개 lease됨(status=leased)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJob"
        "204":
          description: waitMs까지 대기했지만 큐가 비어 있음
        "400":
          $ref: "#/components/responses/ValidationError" # workerId 누락
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal/ai-jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: promptHash(잡 ID)
    post:
      tags: [internal]
      operationId: completeAiJob
      summary: 잡 완료 보고(성공/실패) — 성공 시 MatchOrchestrator.onJobDone 트리거
      security:
        - servantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiJobCompleteRequest"
      responses:
        "200":
          description: 반영됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJob"
        "400":
          $ref: "#/components/responses/ValidationError" # ok=true인데 output 누락
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidState" # 잡이 leased 상태가 아님

  /internal/health:
    get:
      tags: [internal]
      operationId: internalHealth
      summary: 큐 깊이·lease 중 개수(운영 확인용) — /internal/** 전체가 X-Servant-Token 보호(W4, AC-Q3)
      security:
        - servantToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ───────────────────────── admin (P3 §C, additive) ─────────────────────────
  # /api/admin/** 전체가 AdminInterceptor 로 보호된다: 미인증 401, 인증됐지만 비admin 403(AC-C2).
  # admin 부여는 서버 부팅 시 env(HMB_ADMIN_NICKNAME/HMB_ADMIN_PASSWORD)로만 이뤄진다(P3-D4) —
  # 미설정 배포에는 admin 이 0명이다.
  /api/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: 유저 목록·닉네임 검색·페이징(운영). 비밀번호는 어떤 필드로도 반환되지 않는다.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 닉네임 부분 일치. LIKE 와일드카드(%, _)는 리터럴로 취급된다.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: 유저 상태(지갑·보유 선수·활성 덱/프리셋 요약·전적)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── economy 무배포 운영 (#209 B안) — 재배포 없이 스타터 최상위 후보 교체 ──
  /api/admin/economy:
    get:
      tags: [admin]
      operationId: getAdminEconomy
      summary: |
        현재 유효한 economy 요약 + **출처**. 발행물은 이미지에 구워져 불변이라, 운영 변경은 쓰기 가능한
        볼륨의 override 파일로 이뤄진다 → 값만으로는 "반영됐나"에 답할 수 없어 source 를 함께 낸다.
        overrideApplied(=적용됨)와 overrideFilePresent(=파일 존재)는 **다른 사실**이다(거절된 파일이 남을 수 있다).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/history:
    get:
      tags: [admin]
      operationId: getAdminEconomyHistory
      summary: economy 운영 이력(감사 원장) — **성공과 실패 모두**. 거절된 시도도 남는다.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOpsAuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/reload:
    post:
      tags: [admin]
      operationId: reloadAdminEconomy
      summary: |
        디스크 재읽기(내용 변경 없음). **파싱만이 아니라 의미도 검증**한다 — 카탈로그에 없는 id 가
        든 파일을 그대로 실으면 이후 모든 가입이 FK 로 실패한다. 실패 시 400 + 직전 설정 유지.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: 운영 사유(필수 — 원장에 남는다) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/starter-top:
    put:
      tags: [admin]
      operationId: replaceStarterTop
      summary: |
        스타터 최상위 후보 교체 — 배포 없이 카드 조정의 실제 경로. 검증(카탈로그 실재·중복·기본팩
        겹침·count 범위)을 통과한 내용만 override 파일이 되고 즉시 반영된다. 사유 필수.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStarterTopRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/economy/override:
    delete:
      tags: [admin]
      operationId: clearEconomyOverride
      summary: override 제거 = 배포 발행물로 롤백(원클릭). 지울 게 없으면 400.
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEconomyView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/users/{id}/points:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      operationId: adminGrantPoints
      summary: |
        포인트 지급(delta>0)/차감(delta<0) — AC-C1. 지갑·point_ledger(reason='admin_grant')·
        admin_audit 세 곳이 **하나의 트랜잭션**으로 갱신된다. 음수 잔액은 허용되지 않는다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: |
            선택. 주면 같은 키의 재전송은 **중복 지급되지 않는다**(원장 유니크 인덱스로 보장,
            재전송 응답은 200 + applied=false). 주지 않으면 서버가 키를 채번하므로 재전송은
            별개의 지급으로 처리된다 — 운영 UI 는 항상 이 헤더를 보낼 것.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantPointsRequest"
      responses:
        "200":
          description: 적용됨(applied=true) 또는 멱등 재전송(applied=false, 상태 변화 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGrantPointsResult"
        "400":
          description: |
            delta 가 0/누락, reason 누락, 또는 차감 후 잔액이 음수가 되는 경우.
            code=VALIDATION_ERROR 또는 INSUFFICIENT_POINTS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            멱등키 충돌(같은 키가 이미 다른 지급에 쓰였다). code=CONFLICT.
            응답 본문에는 내부 SQL·스키마가 포함되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────────────────────────────────
  # 어드민 유닛 카탈로그 (#207 파트 A) — additive. 기존 경로·스키마 변경 0.
  #
  # 목적: 유닛 추가/수정/비활성화를 **배포 없이** 하고 모든 변경을 감사 원장에 남긴다.
  # 변경 계열은 공통으로:
  #   · 바디에 reason 필수(≤500자, 없으면 400)
  #   · Idempotency-Key 헤더 선택 — 같은 키 재전송은 200 + applied=false(감사 중복 0),
  #     같은 키 다른 내용은 409
  #   · players UPDATE + admin_catalog_audit INSERT + admin_locked=1 이 한 트랜잭션
  # 인증은 /api/admin/ 접두사 게이트가 일괄 담당한다(엔드포인트별 권한 선언 없음).
  # ─────────────────────────────────────────────────────────────────────────
  /api/admin/units:
    get:
      tags: [admin]
      operationId: adminListUnits
      summary: 유닛 목록(필터 q·grade·position·active + 페이징). 행마다 adminLocked·dataVersion 포함.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "id 또는 이름 부분일치(LIKE 와일드카드는 리터럴 처리)" }
        - { name: grade, in: query, required: false, schema: { $ref: "#/components/schemas/Grade" } }
        - { name: position, in: query, required: false, schema: { $ref: "#/components/schemas/Position" } }
        - { name: active, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: 유닛 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitPage" }
        "400":
          description: 알 수 없는 grade/position 등 파라미터 오류. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: adminCreateUnit
      summary: |
        신규 유닛 추가. id 는 **서버가 채번**한다(기존 최대 P번호 + 1) — 기존 번호 재사용은
        user_players 가 그 id 를 가리키므로 기보유 카드의 의미를 바꾼다.
        생성된 행은 admin_locked=1 이라 부팅 재임포트가 덮지 않는다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: |
            선택. 생성 멱등의 스코프는 (action, idem_key) 로 **대상 무관**이다 — id 를 서버가
            채번하므로 대상별 스코프로는 재전송을 식별할 수 없고, 그러면 재전송마다 새 유닛이 생긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUnitCreateRequest" }
      responses:
        "200":
          description: 생성됨(applied=true) 또는 멱등 재전송(applied=false, 상태 변화 없음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400":
          description: reason 누락/초과, 열거값 오류, attributes 9종 누락·범위 밖. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 멱등키 충돌(같은 키가 이미 다른 내용에 쓰였다). code=CONFLICT
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/admin/units/audit:
    get:
      tags: [admin]
      operationId: adminUnitAudit
      summary: |
        카탈로그 변경 이력. before/after 는 **필드 diff 가 아니라 전체 스냅샷**이라
        한 행만으로 그 시점 상태를 복원할 수 있다.
      parameters:
        - { name: playerId, in: query, required: false, schema: { type: string } }
        - { name: actor, in: query, required: false, schema: { type: string }, description: "액션을 실행한 admin 의 userId" }
        - { name: action, in: query, required: false, schema: { $ref: "#/components/schemas/AdminUnitAuditAction" } }
        - { name: from, in: query, required: false, schema: { type: string }, description: "ISO-8601 UTC. created_at >= from" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "ISO-8601 UTC. created_at <= to" }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: 감사 이력 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitAuditPage" }
        "400":
          description: 알 수 없는 action. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/units/export:
    get:
      tags: [admin]
      operationId: adminExportUnits
      summary: |
        현재 카탈로그를 **시드 발행 포맷**(data/players/players.vX.json)으로 덤프.
        운영 흐름 = 어드민 API 로 확정 → export → data 도메인이 다음 시드 버전으로 승격 → 커밋.
        이게 없으면 개편이 그 DB 한 대에만 살고 새 배포·DB 리셋에 사라진다.
        런타임 전용 필드(adminLocked·dataVersion)는 덤프에 포함되지 않는다.
      responses:
        "200":
          description: 시드 형태 배열(id 오름차순)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUnitSeedEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/units/{playerId}:
    parameters:
      - name: playerId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      operationId: adminUnitDetail
      summary: 유닛 상세 + 보유 규모(영향 범위) + 최근 감사 이력
      responses:
        "200":
          description: 유닛 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateUnit
      summary: |
        부분 수정. attributes 는 **키 단위 병합**이다(전체 교체 아님) — 스탯 하나를 고치려고
        9종을 다시 적게 하면 나머지를 옮겨 적다가 틀린다.
        **등급 하향**은 기보유 카드의 유효스탯을 깎으므로(cap_i = base_i + starFrac[star]×(hi−base_i),
        성을 올린 카드일수록 크게) confirmImpact:true 없이는 409 로 거절되고, 실측 영향 규모가
        응답 detail 에 담긴다. 상향은 손실이 없으므로 확인이 필요 없다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUnitPatchRequest" }
      responses:
        "200":
          description: 적용됨(applied=true) 또는 멱등 재전송(applied=false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400":
          description: reason 누락, 변경 필드 0, 열거값·능력치 오류. code=VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            ① 등급 하향인데 confirmImpact 가 없다(detail = AdminUnitGradeImpact) 또는
            ② 멱등키 충돌. 둘 다 code=CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/admin/units/{playerId}/deactivate:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminDeactivateUnit
      summary: |
        비활성화 — **신규 획득 경로에서만** 제외한다(가챠 추첨 풀 · 트레이드 타깃 · 도감의 미보유분).
        보유분은 건드리지 않는다: user_players · 덱 편성 · 성장/유효스탯 · 매치 SelectData 전부 그대로다.
        (hero 결정 U-D1 = 기보유 유저 손실 0.)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/units/{playerId}/activate:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: adminActivateUnit
      summary: 재활성화(감사 action 을 deactivate 와 분리해 이력 가독성을 유지한다)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락. code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /api/admin/units/{playerId}/override:
    parameters:
      - { name: playerId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: adminResetUnitOverride
      summary: |
        시드 권위로 복원(admin_locked=0). **값을 되돌리지는 않는다** — 다음 부팅의 시드 임포트가
        이 행을 다시 덮게 허용할 뿐이다. 지금 값을 바꾸려면 PATCH 를 쓴다.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
        - name: reason
          in: query
          required: false
          schema: { type: string }
          description: |
            바디 대신 쓸 수 있는 사유. DELETE 바디는 HTTP 상 합법이지만 일부 클라이언트·프록시가
            조용히 떨어뜨린다 — 목적은 사유 없는 변경을 막는 것이지 전송 형식 강제가 아니다.
            바디와 쿼리 둘 다 없으면 400.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "200":
          description: 적용됨 또는 멱등 재전송
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUnitMutationResult" }
        "400": { description: "reason 누락(바디·쿼리 모두). code=VALIDATION_ERROR", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "멱등키 충돌. code=CONFLICT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "/api/** 전체(로그인 제외). sessions 테이블 조회."
    servantToken:
      type: apiKey
      in: header
      name: X-Servant-Token
      description: "/internal/** 전용 고정 shared secret(AC-Q3)."

  parameters:
    MatchId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: 인증 실패(토큰 없음/만료/무효). code=UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 리소스 없음. code=NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: 입력 검증 실패. code=VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DuplicateNickname:
      description: |
        이미 사용 중인 닉네임(= 자체 로그인 id). code=DUPLICATE_NICKNAME. P3 §A(AC-A1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: |
        인증은 됐으나 권한이 없음(admin 전용 API 에 일반 유저 토큰). code=FORBIDDEN. P3 §C(AC-C2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidState:
      description: |
        현재 매치 상태에서 허용되지 않는 액션(§5.1 전이표 외). code=INVALID_STATE. AC-M1.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    # ───────────────────────────── 공통 ─────────────────────────────
    ErrorCode:
      type: string
      description: |
        전 엔드포인트 공통 에러 코드 열거(LLD §3). 신규 코드 추가 시 이 열거에 먼저 반영한다
        (openapi.yaml이 계약 SoT).
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - NOT_FOUND
        - DECK_INVALID
        - INSUFFICIENT_POINTS
        - INVALID_STATE
        - SUBSTITUTION_INVALID
        - AI_JOB_FAILED
        - INTERNAL_ERROR
        # P3 §A 자체 로그인(additive)
        - BAD_CREDENTIALS
        - DUPLICATE_NICKNAME
        # P3 §C admin(additive) — 인증은 됐으나 admin 이 아님
        - FORBIDDEN
        # P3 §C admin(additive) — 중복 멱등키 등 상태 충돌
        - CONFLICT
        # #217 매치 잠금(additive) — 끝나지 않은 매치가 있어 이 요청을 받을 수 없다.
        # detail = {matchId, state, action} — web 은 matchId 로 "이어하기" 를 띄운다.
        - MATCH_IN_PROGRESS

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: 사람이 읽을 수 있는 사유(한국어 가능)
        detail:
          type: [object, "null"]
          additionalProperties: true
      example:
        code: DECK_INVALID
        message: 선발이 11명이 아닙니다
        detail:
          starterCount: 10

    # ───────────────────────────── auth/me ─────────────────────────────
    LoginRequest:
      type: object
      required: [nickname]
      properties:
        provider:
          type: string
          enum: [guest, "mock:google", "mock:apple", local]
          description: |
            Phase2 additive — 생략 시 guest (server 9c51446 구현 정합).
            P3 additive: local = 자체 로그인(비번 필요, P3-D2).
        nickname:
          type: string
          pattern: "^[\\p{L}\\p{N}_-]{2,16}$"
          description: "provider=local 에서는 이 닉네임이 곧 로그인 id 다(별도 식별자 없음)"
        password:
          type: string
          description: |
            P3 additive(옵션) — provider=local 일 때만 사용한다. 다른 provider 는 무시.
            ⚠️ 평문 저장 목업(P3-D2, 해시 전환 백로그). 응답·로그 어디에도 반환되지 않는다(AC-A2).

    RegisterRequest:
      type: object
      required: [nickname, password]
      description: 자체 로그인 회원가입 바디(P3 §A). nickname = 로그인 id(users.nickname UNIQUE 재사용).
      properties:
        nickname:
          type: string
          pattern: "^[\\p{L}\\p{N}_-]{2,16}$"
        password:
          type: string
          description: "길이 규칙은 서버 config(hmb.auth.local.password-*-length). 평문 목업(P3-D2)."

    UserRef:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: string
          description: ULID
        nickname:
          type: string
        isAdmin:
          type: boolean
          description: |
            P3 §C additive(선택 필드 — required 불변). GET /api/me 응답에만 담긴다.
            web 이 /admin 라우트를 **표시**할지 정하는 힌트일 뿐 권한 판정이 아니다 —
            실제 접근 차단은 서버의 /api/admin/** 게이트가 한다.
        tutorialDone:
          type: boolean
          description: |
            #209 additive(선택 필드 — required 불변). GET /api/me 응답에만 담긴다.
            온보딩 튜토리얼 완료 여부의 **서버 SoT**(그 전까지는 클라 localStorage 폴백뿐이었다).
            덱 지급이 완료 시점에 매달리므로 권위가 서버에 있어야 한다 — 저장은
            POST /api/me/tutorial-complete 만 한다.

    LoginResponse:
      type: object
      required: [token, user, isNew]
      properties:
        token:
          type: string
          description: 불투명 세션 토큰(Bearer로 사용)
        user:
          $ref: "#/components/schemas/UserRef"
        isNew:
          type: boolean
          description: 신규 가입이면 true(스타터 팩 지급 트리거, PRD §3.2)

    WalletInfo:
      type: object
      required: [points]
      properties:
        points:
          type: integer
          minimum: 0
          description: 골드(게임 재화). 트레이드·무료강화(노말 다이스)에 쓴다.
        gems:
          type: integer
          minimum: 0
          description: >-
            젬(유료 재화) — 뽑기·유료 다이스. #212 additive(구서버 응답엔 없을 수 있어 required 아님).
            수급은 가입 지급 + 리그 우승 둘뿐.

    # #212: 시즌 종료 보상 노출(GET /api/league → season.seasonReward). 지급 진실의 SoT 는 원장
    # (point_ledger 'league_reward' / gem_ledger 'league_gem_reward', 둘 다 ref=seasonId)이다.
    SeasonReward:
      type: object
      required: [rank, points, status]
      properties:
        rank:
          type: integer
          description: 유저 최종 순위(시즌 진행 중이면 현재 잠정 순위).
        points:
          type: integer
          description: 실지급 골드(원장 delta). 미지급이면 0 — 예정액이 아니다.
        gems:
          type: integer
          description: >-
            실지급 젬. **우승(1위)일 때만** 500~3000 랜덤이고 그 외에는 0(#212).
            web 우승 연출의 입력(#214).
        status:
          type: string
          enum: [PENDING, GRANTED, NONE]
        awardedAt:
          type: string
          nullable: true
          description: 지급 시각(원장 created_at). 미지급이면 null.

    MatchRecordSummary:
      type: object
      required: [wins, draws, losses]
      properties:
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }

    MeResponse:
      type: object
      required: [user, wallet, records]
      properties:
        user:
          $ref: "#/components/schemas/UserRef"
        wallet:
          $ref: "#/components/schemas/WalletInfo"
        records:
          $ref: "#/components/schemas/MatchRecordSummary"

    AdminEconomyView:
      type: object
      required: [source, effectivePath, overridePath, overrideApplied, overrideFilePresent, loadedAt, starterPackSize, starterTop]
      description: "#209 B안 — 지금 유효한 economy 요약 + 출처(운영 화면이 '반영됐나'에 답하는 근거)"
      properties:
        version: { type: [string, "null"] }
        source:
          type: string
          enum: [BAKED, OVERRIDE, NONE]
          description: BAKED=배포 발행물 · OVERRIDE=운영이 얹은 파일 · NONE=설정 없음
        effectivePath: { type: string }
        overridePath: { type: string }
        overrideApplied:
          type: boolean
          description: 지금 적용된 값이 override 에서 왔는가(= source==OVERRIDE)
        overrideFilePresent:
          type: boolean
          description: override 파일이 디스크에 존재하는가(거절된 파일이 남아 있을 수 있어 적용 여부와 별개)
        loadedAt: { type: string }
        starterPackSize: { type: integer }
        starterTop:
          type: object
          required: [pool, count]
          properties:
            pool:
              type: array
              items: { type: string }
            count: { type: integer }

    AdminStarterTopRequest:
      type: object
      required: [pool, count, reason]
      properties:
        pool:
          type: array
          items: { type: string }
          description: 최상위 후보 playerId — 카탈로그 실재 · 중복 없음 · 기본팩과 서로소여야 한다
        count:
          type: integer
          minimum: 1
          description: 가입 시 지급 장수(1..pool 크기)
        reason:
          type: string
          description: 운영 사유(필수 — 원장에 남는다)

    AdminOpsAuditEntry:
      type: object
      required: [id, actor, action, result, createdAt]
      description: "#209 B안 — admin 운영 액션 감사 원장 1행. 실패도 남는다"
      properties:
        id: { type: string }
        actor: { type: string, description: 액션을 실행한 admin 닉네임 }
        action:
          type: string
          description: |
            economy_reload | economy_starter_top | economy_override_clear (#209).
            ⚠️ enum 으로 닫지 않는다 — 이 테이블은 범용 운영 원장이고(#207 파트 A 등 다른 트랙이
            자기 action 을 같은 테이블에 append 한다) 조회는 action 필터가 없다. 닫아 두면
            그 트랙이 랜딩하는 순간 응답이 자기 스펙을 위반한다.
        result:
          type: string
          enum: [ok, failed]
        reason: { type: [string, "null"] }
        detailJson:
          type: [string, "null"]
          description: "{before, after} 또는 {before, attempted, error} 스냅샷(JSON 문자열)"
        createdAt: { type: string }

    StarterGrantResponse:
      type: object
      required: [granted, player]
      description: "#209 — 가입 지급된 최상위 유닛(연출 재료). 지급이 없으면 granted=false, player=null"
      properties:
        granted:
          type: boolean
        player:
          oneOf:
            - $ref: "#/components/schemas/CatalogPlayer"
            - type: "null"

    TutorialCompleteResponse:
      type: object
      required: [tutorialDone, deckGranted, deck]
      description: "#209 — 튜토리얼 완료 저장 결과. deckGranted = 이번 호출이 실제로 덱을 만들었는가(멱등)"
      properties:
        tutorialDone:
          type: boolean
        deckGranted:
          type: boolean
        deck:
          oneOf:
            - $ref: "#/components/schemas/Deck"
            - type: "null"

    MatchListItem:
      type: object
      required: [id, opponentName, scoreHome, scoreAway, result, createdAt]
      properties:
        userWasHome:
          type: boolean
          description: "P2 additive — 유저 관점 오리엔트 키(연습=true, 리그 어웨이=false). scoreHome/Away는 픽스처 관점 유지"
        id: { type: string }
        opponentName: { type: string }
        scoreHome: { type: [integer, "null"] }
        scoreAway: { type: [integer, "null"] }
        result:
          type: [string, "null"]
          enum: [WIN, DRAW, LOSS]
        createdAt:
          type: string
          format: date-time

    # ───────────────────────────── catalog ─────────────────────────────
    PlayerAttributes:
      type: object
      description: shared PlayerAttributes(packages/shared/src/select-data.ts) — 각 0..100
      required:
        [technical, mental, physical, passing, shooting, tackling, pace, stamina, positioning]
      properties:
        technical: { type: number, minimum: 0, maximum: 100 }
        mental: { type: number, minimum: 0, maximum: 100 }
        physical: { type: number, minimum: 0, maximum: 100 }
        passing: { type: number, minimum: 0, maximum: 100 }
        shooting: { type: number, minimum: 0, maximum: 100 }
        tackling: { type: number, minimum: 0, maximum: 100 }
        pace: { type: number, minimum: 0, maximum: 100 }
        stamina: { type: number, minimum: 0, maximum: 100 }
        positioning: { type: number, minimum: 0, maximum: 100 }

    Grade:
      type: string
      enum: [BRONZE, SILVER, GOLD, DIA, LEGEND]

    Position:
      type: string
      enum: [GK, DF, MF, FW]

    CatalogPlayer:
      type: object
      required: [id, name, position, grade, attributes, owned, ownedCount]
      properties:
        id:
          type: string
          description: "'P001'.. 고유 ID(실선수 아님, data 에픽 시드)"
        name: { type: string }
        position:
          $ref: "#/components/schemas/Position"
        grade:
          $ref: "#/components/schemas/Grade"
        attributes:
          $ref: "#/components/schemas/PlayerAttributes"
        owned:
          type: boolean
        ownedCount:
          type: integer
          minimum: 0
        active:
          type: boolean
          description: >
            #207 U-D7 additive. 카탈로그 운영 플래그(players.active). false = 신규 획득 경로(가챠 추첨 풀·
            트레이드 타깃)에서 빠진 유닛. 비활성이어도 **보유분은 이 목록에 계속 내려오므로**(카드를 뺏지
            않는다) 클라는 이 값으로 도감에 "off"를 표기한다. 필터링 의미는 없고 표기용 관측 필드다.
            required 아님 — 기존 소비자 무영향(additive).

    # ───────────────────────────── deck ─────────────────────────────
    DeckSlot:
      type: object
      required: [playerId, role, slotIndex]
      properties:
        playerId: { type: string }
        role:
          type: string
          enum: [starter, bench]
        slotIndex:
          type: integer
          description: "starter: 0..10(포메이션 슬롯), bench: 0..6"
        promptText:
          type: [string, "null"]
          maxLength: 500
          description: 선수별 사전 프롬프트(≤500자, hmb.deck.player-prompt-max-chars)

    Deck:
      type: object
      required: [id, formation, slots]
      properties:
        id: { type: string }
        formation:
          type: string
          description: "'4-4-2' 등 — 엔진 config 포메이션 키와 일치해야 함"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/DeckSlot"
        updatedAt:
          type: string
          format: date-time

    DeckUpdateRequest:
      type: object
      required: [formation, slots]
      properties:
        formation:
          type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/DeckSlot"
          description: |
            starter 슬롯 정확히 11개(slotIndex 0..10, GK≥1 포함), bench ≤7(hmb.deck.bench-max),
            선수 중복 금지, 미보유 선수 금지 — 위반 시 400 DECK_INVALID(AC-S2).

    # ───────────────────────────── presets ─────────────────────────────
    PromptPreset:
      type: object
      required: [id, name, promptText, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        promptText:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time

    PromptPresetCreateRequest:
      type: object
      required: [name, promptText]
      properties:
        name:
          type: string
        promptText:
          type: string
          maxLength: 500

    # ───────────────────────────── shop ─────────────────────────────
    GachaRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [single, ten]

    GachaResultItem:
      type: object
      required: [player, isNew]
      properties:
        player:
          $ref: "#/components/schemas/CatalogPlayer"
        isNew:
          type: boolean
          description: PoC 정책 — 중복은 보유 수량 증가, 능력엔 영향 없음(표시만)

    GachaResponse:
      type: object
      required: [results, wallet]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/GachaResultItem"
          description: single=1개, ten=11개(골드↑ ≥1, pity 적용 가능 — AC-S7)
        wallet:
          $ref: "#/components/schemas/WalletInfo"

    # ───────────────────────────── modes ─────────────────────────────
    ModeInfo:
      type: object
      required: [id, available]
      properties:
        id:
          type: string
          enum: [single, multi]
        available:
          type: boolean
        label:
          type: [string, "null"]
          description: "available=false일 때 표시 문구(예: '준비중', D10)"

    # ───────────────────────────── matches ─────────────────────────────
    MatchState:
      type: string
      description: |
        LLD §5.1 상태머신 + **P4-E2(#170) 확장** — docs/plan-v5/LLD-e2-flow-clock.md §2.

        BRIEFING → GEN1 → **FIRST_HALF**(전반 라이브 재생 창) → **HALFTIME**(감독시간 60초)
        → GEN2 → **SECOND_HALF** → FINISHED. 라이브 단계 전이는 **서버 시계가 소유**한다
        (화면을 안 봐도 진행 — P4-D1/D2).

        `H1_BREAK` 은 **레거시 전용**(P4 이전 배포본의 진행 중 매치를 V8 마이그레이션이 HALFTIME 으로
        옮긴다). 신규 매치는 이 값이 되지 않는다.

        `ABANDONED`(#217, V19)는 **두 번째 터미널 상태**다 — 유저의 포기 또는 방치 스윕으로만
        들어온다. FINISHED 와 달리 결과·보상이 없다(전적에 잡히지 않는다).
      enum: [BRIEFING, GEN1, FIRST_HALF, HALFTIME, SECOND_HALF, GEN2, FINISHED, FAILED, H1_BREAK, ABANDONED]

    ActiveMatchResponse:
      type: object
      description: |
        GET /api/me/active-match (#217 AC1). 끝나지 않은 내 매치와, web 이 그걸로 무엇을 해야
        하는지(강제 재입장 / 포기 버튼 노출)를 **서버가 판정해서** 같이 준다 — 판정 규칙을 클라가
        복제하면 규칙이 바뀔 때 조용히 어긋난다.
      required: [match, locked, abandonable]
      properties:
        match:
          oneOf:
            - $ref: "#/components/schemas/MatchDetail"
            - type: "null"
          description: 끝나지 않은 매치(BRIEFING~FAILED). 없으면 null.
        locked:
          type: boolean
          description: |
            이미 킥오프했나(state ≠ BRIEFING). true 면 web 은 메타 화면(덱·상점·성장·트레이드·
            리그·도감·전적) 진입을 막고 /match/{id} 로 보낸다. BRIEFING 은 false — 로비에
            "이어하기" 안내만 띄운다(강제 이동 아님).
        abandonable:
          type: boolean
          description: 지금 POST /api/matches/{id}/abandon 이 200 을 줄 상태인가(포기 버튼 노출 조건).

    MatchClock:
      type: object
      description: |
        **서버 권위 시계**(P4-D1, #170). 서버는 "지금 어느 단계이고 그 단계가 언제 시작해 언제
        끝나는가"(=창)만 소유하고, 재생 위치(틱)는 클라가 그 창 안에서 계산한다
        (`packages/shared/src/match-clock.ts` 가 매핑의 단일 SoT).

        `MatchDetail.clock = null` 인 경우: 라이브 단계가 아님(BRIEFING/GEN*/FINISHED/FAILED),
        또는 `hmb.match.clock.enabled=false`(롤백), 또는 레거시 매치.
      required:
        [phase, serverNow, halfRealMs, halftimeMs, seekForwardBlocked, seekGraceMs]
      properties:
        phase:
          type: string
          enum: [FIRST_HALF, HALFTIME, SECOND_HALF]
          description: 현재 단계(state 파생 — SoT 는 state).
        kickoffAt:
          type: [string, "null"]
          format: date-time
          description: 전반이 라이브로 열린 시각(AC-W3-3). 전반 로그 저장 시점이며 킥오프 요청 시점이 아니다.
        phaseStartAt:
          type: [string, "null"]
          format: date-time
          description: 현재 단계 시작. null = 시계 미적용(레거시·롤백).
        phaseEndsAt:
          type: [string, "null"]
          format: date-time
          description: 현재 단계 종료 예정. HALFTIME 이면 **감독시간 deadline**.
        serverNow:
          type: string
          format: date-time
          description: 응답 생성 시각 — 클라 시계 스큐 보정 기준.
        halfRealMs:
          type: integer
          description: 하프당 실시간 재생 길이(config `hmb.match.clock.half-real-ms`). 압축비는 이 값에서 파생.
        halftimeMs:
          type: integer
          description: 감독시간 길이(config, P4-D2 = 60000).
        seekForwardBlocked:
          type: boolean
          description: 라이브 앞서가기 금지(config). 뒤로 스크럽은 항상 자유.
        seekGraceMs:
          type: integer
          description: 지연·스큐 허용 오차(config).

    OpponentAnalysisPlayer:
      type: object
      required: [name, position, grade]
      properties:
        name: { type: string }
        position:
          $ref: "#/components/schemas/Position"
        grade:
          $ref: "#/components/schemas/Grade"
        hasPrompt:
          type: boolean

    OpponentAnalysis:
      type: object
      required: [name, analysisText, deck]
      properties:
        name: { type: string }
        analysisText: { type: string }
        deck:
          type: array
          items:
            $ref: "#/components/schemas/OpponentAnalysisPlayer"
          minItems: 11
          maxItems: 11

    MatchDetail:
      type: object
      description: |
        state에 따라 일부 필드만 채워진다: BRIEFING → opponent 포함. HALFTIME(구 H1_BREAK) 이후 →
        scoreH1Home/Away. FINISHED → scoreHome/Away+result. FAILED → failReason.
        라이브 단계(FIRST_HALF/HALFTIME/SECOND_HALF) → clock(P4-E2 #170).
        후반 스코어는 **FINISHED 전까지 노출하지 않는다**(재생 중 스포일러 금지).
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        state:
          $ref: "#/components/schemas/MatchState"
        failReason:
          type: [string, "null"]
        opponent:
          $ref: "#/components/schemas/OpponentAnalysis"
        scoreH1Home: { type: [integer, "null"] }
        scoreH1Away: { type: [integer, "null"] }
        scoreHome: { type: [integer, "null"] }
        scoreAway: { type: [integer, "null"] }
        result:
          type: [string, "null"]
          enum: [WIN, DRAW, LOSS]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        clock:
          description: |
            서버 권위 시계(P4-E2 #170, additive). 라이브 단계가 아니거나 시계 비활성이면 null.
          oneOf:
            - $ref: "#/components/schemas/MatchClock"
            - type: "null"

    CreateMatchRequest:
      type: object
      properties:
        botId:
          type: [string, "null"]
          description: "생략 시 랜덤 봇(BOT_ATK/BOT_DEF/BOT_BAL 중, PRD §3.4)"

    MatchPromptRequest:
      type: object
      required: [phase, scope, text]
      properties:
        phase:
          type: string
          enum: [pre, halftime]
        scope:
          type: string
          enum: [team, player]
        playerId:
          type: [string, "null"]
          description: "scope='player'일 때 필수"
        text:
          type: string
          maxLength: 500

    SubstitutionItem:
      type: object
      required: [out, "in"]
      properties:
        out:
          type: string
          description: playerId(전반 선발)
        "in":
          type: string
          description: playerId(벤치)

    HalftimeRequest:
      type: object
      required: [substitutions]
      properties:
        substitutions:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SubstitutionItem"
          description: "≤3(hmb.match.halftime-subs-max), out∈전반 선발, in∈벤치, 교체 후 GK≥1"

    MatchResult:
      type: object
      required: [matchId, scoreHome, scoreAway, result]
      properties:
        matchId: { type: string }
        scoreHome: { type: integer }
        scoreAway: { type: integer }
        result:
          type: string
          enum: [WIN, DRAW, LOSS]
        pointsAwarded:
          type: integer
          description: 승/무/패 보상(economy.v1.json 수치, 멱등 지급 — AC-M6)
        teamStats:
          type: object
          additionalProperties: true
          description: 팀 스탯 요약(슛/점유율 등) — 상세는 W3 구현에서 확정
        playerStats:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 선수별 스탯 리스트 — 상세는 W3 구현에서 확정

    # ───────────────────────────── shared 계약(느슨한 stub) ─────────────────────────────
    SelectData:
      type: object
      description: |
        packages/shared/src/select-data.ts (zod SoT). home/away 각각 TeamRoster
        {name, players: PlayerCard[]}. PlayerCard = {playerId, name, position, attributes}.
        여기서는 필드 상세를 반복하지 않고 존재만 계약한다 — zod 스키마가 진실.
      required: [home, away]
      properties:
        home:
          type: object
          additionalProperties: true
        away:
          type: object
          additionalProperties: true

    TacticalInput:
      type: object
      description: |
        packages/shared/src/tactical-input.ts (zod SoT). AI가 프롬프트로부터 생성하는
        선수별 행동 파라미터 세트이자 결정론 엔진 입력. 필드: seed(string, uint64를 10진
        문자열로), team(TeamInput: formation·defensiveLineHeight·compactness·tempo·width·
        pressingScheme·offsideTrap), players(PlayerInput[]: playerId·role·duty·basePosition·
        behavior·markTarget?·mentalModifier), meta?(generatedAt?·promptHash?).
      required: [seed, team, players]
      properties:
        seed:
          type: string
        team:
          type: object
          additionalProperties: true
        players:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: [object, "null"]
          additionalProperties: true

    MatchLog:
      type: object
      description: |
        packages/shared/src/match-log.ts (zod SoT). 결정론 엔진 출력 — 틱별 좌표 스냅샷 +
        이벤트 시계열 + 최종 스코어 + 틱 해시(재현/desync 검증). 필드: configVersion, seed,
        tickSnapshots(TickSnapshot[]: tick·minute·ball·ballOwner·players·hash),
        events(MatchEvent[]: tick·minute·type·team?·playerId?·xg?·detail?), finalScore
        {home,away}. AC-M3: 이 응답은 zod MatchLog로 파싱 가능해야 한다.
      required: [configVersion, seed, tickSnapshots, events, finalScore]
      properties:
        configVersion:
          type: string
        seed:
          type: string
        tickSnapshots:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        finalScore:
          type: object
          properties:
            home: { type: integer }
            away: { type: integer }

    # ───────────────────────────── internal ai-jobs ─────────────────────────────
    AiJobPollRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
        waitMs:
          type: integer
          maximum: 25000
          default: 25000
          description: long-poll 최대 대기(ms). virtual thread라 블로킹 허용(LLD §6).

    AiJobContext:
      type: object
      description: |
        AI 실행기 입력(LLD-ts-servants §3과 동일 계약, LLD-server-java §5.2). kind='team-input'
        고정. 필드: matchId, side(home|away), half(1|2), seed, formation, roster(11명
        {playerId,name,position,attributes,slotIndex}), teamPrompt, playerPrompts
        ({playerId: text}), prevSummary?(half2만: {scoreHome,scoreAway,shots,possessionHint}).
      required: [kind, matchId, side, half, seed, formation, roster, teamPrompt, playerPrompts]
      properties:
        kind:
          type: string
          enum: [team-input]
        matchId: { type: string }
        side:
          type: string
          enum: [home, away]
        half:
          type: integer
          enum: [1, 2]
        seed: { type: string }
        formation: { type: string }
        roster:
          type: array
          items:
            type: object
            additionalProperties: true
        teamPrompt: { type: string }
        playerPrompts:
          type: object
          additionalProperties:
            type: string
        prevSummary:
          type: [object, "null"]
          additionalProperties: true

    AiJobUsage:
      type: object
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cacheReadTokens: { type: integer }
        cacheCreateTokens: { type: integer }
        costUSD: { type: number }

    AiJob:
      type: object
      required: [id, status, context]
      properties:
        id:
          type: string
          description: promptHash(멱등 키, sha256 hex 16+)
        matchId: { type: [string, "null"] }
        side:
          type: [string, "null"]
          enum: [home, away]
        half:
          type: [integer, "null"]
          enum: [1, 2]
        status:
          type: string
          enum: [queued, leased, done, failed]
        context:
          $ref: "#/components/schemas/AiJobContext"
        result:
          $ref: "#/components/schemas/TacticalInput"
        error:
          type: [string, "null"]
        usage:
          $ref: "#/components/schemas/AiJobUsage"
        attempts:
          type: integer
        leaseUntil:
          type: [string, "null"]
          format: date-time

    AiJobCompleteRequest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        output:
          $ref: "#/components/schemas/TacticalInput"
          description: ok=true일 때 필수
        error:
          type: [string, "null"]
          description: ok=false일 때 필수(attempts<max면 queued 복귀, 아니면 failed — LLD §6)
        usage:
          $ref: "#/components/schemas/AiJobUsage"

    InternalHealth:
      type: object
      required: [queueDepth, leasedCount]
      properties:
        queueDepth:
          type: integer
          description: status='queued' 개수
        leasedCount:
          type: integer
          description: status='leased' 개수

    # ───────────────────────── admin (P3 §C, additive) ─────────────────────────
    AdminUserRow:
      type: object
      required: [id, nickname, authProvider, isAdmin, points, createdAt]
      description: |
        운영 목록/상세의 유저 요약. **비밀번호 필드는 존재하지 않는다**(AC-A2 연장) —
        서버 조회 SQL 도 users.password 를 나열하지 않는다.
      properties:
        id: { type: string }
        nickname: { type: string }
        authProvider:
          type: string
          description: "guest / mock:google / mock:apple / local"
        isAdmin: { type: boolean }
        points:
          type: integer
          format: int64
          description: 지갑 잔액
        createdAt: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserRow"
        total:
          type: integer
          format: int64
          description: 검색 조건에 맞는 전체 건수(페이지 크기 아님)
        limit: { type: integer }
        offset: { type: integer }

    AdminUserDetail:
      type: object
      required: [user, players, presets, records]
      properties:
        user:
          $ref: "#/components/schemas/AdminUserRow"
        players:
          type: object
          required: [distinct, total]
          properties:
            distinct: { type: integer, format: int64, description: 보유 선수 종류 수 }
            total: { type: integer, format: int64, description: 중복 포함 총 보유 수 }
        deck:
          type: [object, "null"]
          description: 활성 덱 요약(없으면 null)
          required: [id, name, formation, starters, bench, updatedAt]
          properties:
            id: { type: string }
            name: { type: string }
            formation: { type: string }
            starters: { type: integer }
            bench: { type: integer }
            updatedAt: { type: string, format: date-time }
        presets:
          type: object
          required: [promptPresets, teamPresets]
          properties:
            promptPresets: { type: integer, format: int64 }
            teamPresets: { type: integer, format: int64 }
        records:
          $ref: "#/components/schemas/MatchRecordSummary"

    AdminGrantPointsRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          format: int64
          description: 0 이 아닌 정수. 양수=지급, 음수=차감(차감 후 잔액이 음수면 400).
        reason:
          type: string
          maxLength: 500
          description: 운영 사유(감사 로그에 그대로 기록된다). 공백만이면 400.

    AdminGrantPointsResult:
      type: object
      required: [userId, delta, applied, balance, idempotencyKey]
      properties:
        userId: { type: string }
        delta: { type: integer, format: int64 }
        applied:
          type: boolean
          description: false = 같은 멱등키의 재전송이라 아무것도 바뀌지 않았다.
        balance:
          type: integer
          format: int64
          description: 처리 후 지갑 잔액(재전송이면 현재 잔액).
        idempotencyKey:
          type: string
          description: 실제 사용된 멱등키(헤더 미제공 시 서버가 채번한 값).
        auditId:
          type: [string, "null"]
          description: 기록된 admin_audit 행 ID(재전송이면 null).

    # ── 어드민 유닛 카탈로그 (#207 파트 A) — additive ───────────────────────
    AdminUnitAuditAction:
      type: string
      enum: [unit_create, unit_update, unit_deactivate, unit_activate, unit_override_reset]

    AdminUnit:
      type: object
      required: [id, name, position, grade, attributes, personality, active, adminLocked, dataVersion]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes: { $ref: "#/components/schemas/PlayerAttributes" }
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active:
          type: boolean
          description: |
            false = **신규 획득 경로에서만** 제외(가챠 풀·트레이드 타깃·도감 미보유분).
            보유분은 그대로 쓸 수 있다 — 덱 편성·성장·매치 전부 정상 동작한다.
        adminLocked:
          type: boolean
          description: |
            true = 어드민이 만진 행이라 **부팅 시드 재임포트가 덮지 않는다**.
            DELETE /units/{id}/override 로 풀면 다음 부팅에 시드가 다시 이긴다.
        dataVersion:
          type: string
          description: "임포트 원본 시드 버전(예 v2.2). 어드민이 만든 행은 'admin'."

    AdminUnitSeedEntry:
      type: object
      description: export 전용 — 시드 파일(players.vX.json) 한 항목과 동일한 형태·키 순서.
      required: [id, name, position, grade, attributes, personality, active]
      properties:
        id: { type: string }
        name: { type: string }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes: { $ref: "#/components/schemas/PlayerAttributes" }
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active: { type: boolean }

    AdminUnitPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUnit" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    AdminUnitHoldings:
      type: object
      description: 영향 규모 — 등급·활성 변경 전에 운영자가 보는 값.
      required: [owners, copies]
      properties:
        owners:
          type: integer
          format: int64
          description: 이 유닛을 보유한 유저 수(중복 제외).
        copies:
          type: integer
          format: int64
          description: 보유 장수 합(중복 획득 포함).

    AdminUnitAuditEntry:
      type: object
      required: [id, actorUserId, playerId, action, changedFields, reason, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        playerId: { type: string }
        action: { $ref: "#/components/schemas/AdminUnitAuditAction" }
        before:
          type: object
          additionalProperties: true
          description: 변경 **전 전체 스냅샷**(unit_create 는 빈 객체).
        after:
          type: object
          additionalProperties: true
          description: 변경 **후 전체 스냅샷**.
        changedFields:
          type: array
          items: { type: string }
          description: 실제로 달라진 필드(두 스냅샷에서 파생된 조회 편의값).
        reason: { type: string }
        idemKey: { type: [string, "null"] }
        createdAt: { type: string }

    AdminUnitAuditPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUnitAuditEntry" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    AdminUnitDetail:
      type: object
      required: [unit, holdings, recentAudit]
      properties:
        unit: { $ref: "#/components/schemas/AdminUnit" }
        holdings: { $ref: "#/components/schemas/AdminUnitHoldings" }
        recentAudit:
          type: array
          items: { $ref: "#/components/schemas/AdminUnitAuditEntry" }

    AdminUnitGradeImpact:
      type: object
      description: |
        등급 변경이 기보유 카드에 미치는 **실측** 영향. 등급 하향 409 의 detail 로 실린다.
        근사식이 아니라 실제 유효스탯 계산을 등급만 바꿔 두 번 돌린 차이다.
      required: [fromGrade, toGrade, capLowered, affectedUsers, avgOvrDelta, worstOvrDelta, computed]
      properties:
        fromGrade: { $ref: "#/components/schemas/Grade" }
        toGrade: { $ref: "#/components/schemas/Grade" }
        capLowered:
          type: boolean
          description: 새 등급의 밴드 상한이 더 낮다(= 성장 캡이 내려간다).
        affectedUsers: { type: integer, format: int64 }
        avgOvrDelta:
          type: number
          description: 보유자 전원의 유효 OVR 변화 평균(음수 = 손실).
        worstOvrDelta:
          type: number
          description: 가장 크게 깎이는 카드 한 장의 변화(음수 = 손실).
        computed:
          type: boolean
          description: |
            false = 경제 설정 부재로 델타를 계산하지 못했다.
            이때 0 은 "영향 없음"이 아니므로 보수적으로 다뤄야 한다.

    AdminUnitMutationResult:
      type: object
      required: [applied, idempotencyKey, changedFields]
      properties:
        unit: { $ref: "#/components/schemas/AdminUnit" }
        applied:
          type: boolean
          description: false = 같은 멱등키의 재전송이라 아무것도 바뀌지 않았다(unit 은 현재값).
        idempotencyKey:
          type: string
          description: 실제 사용된 멱등키(헤더 미제공 시 서버가 채번한 값).
        auditId: { type: [string, "null"] }
        changedFields:
          type: array
          items: { type: string }
        impact:
          oneOf:
            - { $ref: "#/components/schemas/AdminUnitGradeImpact" }
            - { type: "null" }
          description: 등급 변경이 동반된 경우의 실측 영향(그 외 null).

    AdminReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: 운영 사유. 필수 — 사유 없는 카탈로그 변경은 허용하지 않는다.

    AdminUnitCreateRequest:
      type: object
      required: [name, position, grade, attributes, reason]
      properties:
        name: { type: string, maxLength: 60 }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes:
          allOf:
            - $ref: "#/components/schemas/PlayerAttributes"
          description: 9종 **전부** 필요(누락 시 400). 각 값 0~100 정수.
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
          description: 생략 시 CALM.
        active:
          type: boolean
          description: 생략 시 true.
        reason: { type: string, maxLength: 500 }

    AdminUnitPatchRequest:
      type: object
      description: 지정한 필드만 바뀐다. 최소 1개는 지정해야 한다(0개면 400).
      required: [reason]
      properties:
        name: { type: string, maxLength: 60 }
        position: { $ref: "#/components/schemas/Position" }
        grade: { $ref: "#/components/schemas/Grade" }
        attributes:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: |
            **키 단위 병합**(전체 교체 아님) — 지정한 능력치만 덮어쓰고 나머지는 보존한다.
            알 수 없는 키는 400.
        personality:
          type: string
          enum: [FIERY, CALM, GLASS, AMBITIOUS]
        active: { type: boolean }
        confirmImpact:
          type: boolean
          description: |
            등급을 **낮출 때만** 필요. 없으면 409 + detail(AdminUnitGradeImpact).
            등급 상향·동일에는 영향이 없으므로 요구하지 않는다.
        reason: { type: string, maxLength: 500 }
