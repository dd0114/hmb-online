server:
  port: 8080

spring:
  application:
    name: hmb-server
  task:
    scheduling:
      # ⚠️ 아래 pool.size 는 **가상스레드가 켜져 있는 한 무효**다(Boot 가 SimpleAsyncTaskScheduler 를
      # 고른다 — 스케줄 실행마다 새 가상스레드라 @Scheduled 끼리 서로 막지 않는다). 가상스레드를 끄는
      # 날을 대비한 방어값으로만 둔다(#170 독립검증 minor: 선언≠효과였던 것 정정).
      pool:
        size: 4
  threads:
    virtual:
      enabled: true   # W4: /internal/ai-jobs/poll long-poll가 블로킹으로 대기해도 요청 스레드 풀을 고갈시키지 않게 (LLD §6)
  datasource:
    url: jdbc:sqlite:${hmb.db.path:./.data/hmb.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5   # WAL이라 동시 읽기는 가능, 쓰기 직렬화는 busy_timeout이 흡수
  flyway:
    enabled: true
    locations: classpath:db/migration
  # jackson 설정은 common/Json.java(@Primary ObjectMapper)가 단일 SoT — spring.jackson.* 키는
  # 커스텀 빈에 적용되지 않아(dead) 두지 않는다. (W1 검증 이월사항 b)
  servlet:
    multipart:
      # 공지 이미지 업로드(#309). ⚠️ 이 값은 **서블릿 컨테이너의 상한**이라 넘으면 요청이 우리
      # 검증에 닿기도 전에 튕긴다(운영자는 이유를 모르는 500 을 본다). 그래서 앱 상한
      # (hmb.notice.asset.max-bytes, 기본 2MB)보다 **넉넉하게** 잡아 두고, 사람에게 보여줄 거절은
      # 항상 우리 검증이 하게 한다.
      # ⚠️ 아트 번들 zip(#309 W2)이 실물 약 6MB 라 8MB 로는 여유가 없다 — 컨테이너 상한이 먼저
      # 걸리면 운영자는 이유를 모르는 에러를 본다. 앱 상한(hmb.chars.bundle.max-total-bytes)이
      # 항상 먼저 말하게 둔다.
      max-file-size: 96MB
      max-request-size: 96MB

hmb:
  db:
    path: ./.data/hmb.db
  notice:
    asset:
      # 공지 이미지 보관소. 비우면 **DB 파일 옆** notice-assets/ (도커에서는 영속 볼륨
      # /var/lib/hmb) — 볼륨을 하나로 유지해 **백업 대상이 하나**가 되게 한다. 별도 볼륨을 만들면
      # DB 만 복구되고 이미지가 사라진 상태가 생기는데, 그때 공지 본문은 멀쩡히 남아 깨진 그림을 가리킨다.
      dir: ""
      # 업로드 상한(바이트). 볼륨 보호이지 기능 제약이 아니다 — 실제 히어로 이미지가 82KB 다.
      # env HMB_NOTICE_ASSET_MAXBYTES 로 **무배포 조정** 가능.
      max-bytes: 2097152
  chars:
    bundle:
      # 유닛 아트 번들(#309 W2). 비우면 DB 파일 옆 char-bundles/ — 공지 이미지와 **같은 볼륨**이라
      # 백업 대상이 하나로 유지된다. 리비전마다 하위 디렉토리 하나(롤백용으로 쌓인다).
      dir: ""
      # zip **해제 후** 총 바이트 상한. 압축 파일 크기로 재면 zip bomb 을 못 막는다 —
      # 몇 KB 가 수 GB 로 풀린다. 현재 실물 아트 트리가 약 6MB 라 64MB 는 넉넉하다.
      max-total-bytes: 67108864
      # 엔트리 수 상한(파일 폭탄 방어). 실물 트리가 약 40개다.
      max-entries: 2000
  data:
    # 부팅 임포트(버전 upsert, meta_kv 기록).
    # v2.1 = 실선수 172명 + 성격(#94) → v2.2 = LEGEND 개편(#207): 신규 8종 P173~P180 추가(180명) +
    # 구 LEGEND 14종(P001~P012·P143·P144) `"active": false`. hero 결정 U-D1(조합안) = 등급은 그대로
    # 두고 **획득 경로만** 막는다 → 기보유 유저 손실 0(성★·잠재·stat_levels·유효스탯 전부 무변경).
    # → **v2.3(현행 소비본)** = U-D5/U-D6. ①유닛명 정정 2건(유라도나→열라도나 P175, 욱리엄→욱링엄 P179)
    #   — 정본은 **카드 아트**다(이름이 아트에 구워져 발행됐다). ②신규 8종 중 **실아트 입고 5종만 활성**
    #   (P173·P175·P176·P177·P179), 미입고 3종(P174 권씨·P178 석신·P180 경니시우스)은 `active:false`.
    #   → v2.3 의 `active:false` 총계 = 14 + 3 = **17**. 미입고분은 **삭제가 아니라 플래그**라, 아트가
    #   나오면 어드민 카탈로그 API 토글 한 번으로 **배포 없이** 켜진다(파트 A 가 정확히 이걸 위한 것).
    # → **v2.4(현행 소비본, #256)** = v2.3 + **신규 LEGEND 2종 append**(P181 석다이크 DF · P182
    #   오시야스 GK). 스키마 무변경(행만 늘어난다). 둘 다 `active:false` 로 들어온다 — 아트는 이미
    #   머지됐고 활성화는 **어드민 카탈로그 API 토글**이 한다(배포 불필요). 따라서 v2.4 의
    #   `active:false` 총계 = 17 + 2 = **19**. ⚠️ 이 2종이 켜지는 순간 **획득 가능 LEGEND 의
    #   DF 0 · GK 0 갭이 닫힌다**(그때 PlayerCatalogV24SeedTest 의 갭 박제 테스트가 성공적으로 실패한다).
    # → **v2.5(현행 소비본, #405 W1)** = v2.4 와 **행·필드 전부 동일**(182행, 신규 채번 0)이고
    #   바뀐 축은 하나뿐이다: **능력치 9종을 신규 시작 밴드로 재롤**
    #   (BRONZE 32-42 / SILVER 41-51 / GOLD 50-60 / DIA 59-69 / LEGEND 68-78,
    #    `docs/plan-v5/growth-redesign.md` §2.2). 성장 여백을 만들기 위한 **초기 스탯 하향**이다.
    #   ⚠️ 성장 천장(72/78/84/90/95)은 이 파일에 없다 — 런타임 SoT 는 `GrowthTuning.bands.growCeil`(§2.8.1).
    #   ⚠️ 부팅 임포트가 기존 players 행을 덮으므로(PlayerCatalogService) 라이브 전환은 §2.7 순서를
    #      지켜야 한다(백업 → V38 스냅샷 → 이 경로 스위치 → 소급 백필). 그 배선은 후속 웨이브 소관.
    # 계약 = PlayerCatalogV24SeedTest(v2.4 고정) · V23/V22 SeedTest(구 발행물 임포트 회귀 가드).
    # ⚠️ 이 경로는 Dockerfile 의 HMB_DATA_PLAYERSFILE 과 **둘 다** 올려야 한다(v8 에서 실제로 어긋났다).
    players-file: ../data/players/players.v2.5.json
    # economy 는 **v3**(#209) — v2 그대로 + starterTop(가입 최상위 후보) 블록. 값은 #212 리스케일까지
    # 포함해 v2 와 동일하고(생성기 한 소스), 추가된 것은 그 블록 하나뿐이다.
    # ⚠️ 이 경로는 Dockerfile 의 HMB_DATA_ECONOMYFILE 과 **둘 다** 올려야 한다.
    economy-file: ../data/players/economy.v3.json
    bots-file:    ../data/players/bots.v3.json
    league-file:  ../data/players/league.v2.json       # 리그 클럽명·페르소나·보상표 + #252 디비전 사다리
  auth:
    session-ttl-hours: 720
    local:                           # P3 §A 자체 로그인(P3-D2) — 비번 평문 목업, 해시 전환은 백로그
      password-min-length: 4         # 가입 검증 하한(하드코딩 금지 — config)
      password-max-length: 64        # 상한(과대 입력 방어)
  admin:                             # P3 §C admin 격리(P3-D4) — 자격은 코드가 아니라 env 가 정한다.
    # 둘 다 비어 있으면 **admin 0명**(기본 안전). 부팅 시 잔존 is_admin 플래그도 회수한다.
    # 둘 다 채우면 그 닉네임 계정에만 is_admin=1 을 부여(계정이 없으면 생성). 하나만 채우면 부팅 실패.
    # ⚠️ 값을 여기 하드코딩하지 말 것 — 배포는 env 로만 주입한다(비번은 로그에 절대 찍지 않는다).
    nickname: ${HMB_ADMIN_NICKNAME:}
    password: ${HMB_ADMIN_PASSWORD:}
    catalog:                         # #207 파트 A 어드민 유닛 카탈로그 — 수치는 전부 여기(하드코딩 금지).
      page-size-default: 50          # GET /api/admin/units 기본 페이지 크기
      page-size-max: 200             # 상한 — 운영 도구라도 전량 덤프는 막는다(export 가 그 용도다)
      audit-recent-limit: 20         # 상세 응답에 실을 최근 감사 이력 건수
      reason-max-chars: 500          # 운영 사유 상한(AdminPointsService 와 동일 규약)
      name-max-chars: 60             # 유닛 이름 상한
      id-prefix: P                   # 자동 채번 접두(P173, P174 …). 기존 P001~P172 공간을 이어 쓴다
      id-digits: 3                   # 0 패딩 자릿수. 999 를 넘으면 자연스럽게 넓어진다(P1000)
      attr-min: 0                    # 능력치 하한(shared PlayerAttributes 계약)
      attr-max: 100                  # 능력치 상한
      create-retry:                  # #207 blocker B1 — POST /api/admin/units 동시 생성의 **잔여** 경합 흡수.
        # 1차 방어는 재시도가 아니다: 채번과 INSERT 가 한 문장(INSERT..SELECT MAX+1)이라 그게 트랜잭션의
        # 첫 문장이 되고, SQLite 가 처음부터 쓰기 잠금을 잡아 번호 경합·SQLITE_BUSY_SNAPSHOT 이
        # 애초에 생기지 않는다. 이 루프는 그 뒤에 남는 것(다른 커넥션의 쓰기 잠금 대기 초과 등)만 흡수한다.
        # SQLITE_BUSY 는 대기가 아니라 트랜잭션 통째 재시도만이 해법이다(hmb.trade.busy-retry 와 동일 사유, #152).
        # ⚠️ 멱등 백스톱(V15 유니크) 위반은 여기서 세지 않는다 — 그건 실패가 아니라 재전송이라
        # 즉시 200 재생/409 로 수렴한다(재시도 대상이 아니다).
        max-attempts: 8              # 최초 시도 포함 총 시도 횟수. 운영 도구라 동시 생성 폭은 작다
        backoff-ms: 20               # 회차 비례 선형 백오프(20/40/60…ms)
  deck:
    bench-max: 7
    player-prompt-max-chars: 500
    # 덱 팀 전체 프롬프트 상한(#253). 선수 문장과 같은 500자 — 매치 시점 팀 지시
    # (hmb.match.prompt-max-chars)와 같은 칸을 채우므로 상한을 어긋나게 두지 않는다.
    team-prompt-max-chars: 500
  starter:                           # #209 스타터/온보딩
    # 튜토리얼 완료 시 지급하는 기본 덱의 포메이션. 지급 덱은 "바로 뛸 수 있는" 기본값이고,
    # 유저는 덱 화면에서 언제든 바꾼다. 지원 목록 = StarterDeckBuilder.FORMATION_SLOTS.
    # ⚠️ 최상위 유닛 후보 목록은 여기가 아니라 **data 발행물**(economy.starterTop)이다 — #207 이
    #    갈아끼우는 지점이 서버 config 로 새면 무배포 교체가 깨진다.
    deck-formation: 4-3-3
  prewarm:                           # #215 W2 — 덱 저장 시 AI 인풋(A 베이스) 선실행
    # 왜 config 인가: 선실행은 최적화지 정합성 경로가 아니다. 예산·큐가 문제되면 재배포 없이 끄고
    # #215 이전 동작(매치 생성 시 프리페치만)으로 돌아갈 수 있어야 한다. 끄면 킥오프 폴백이 그대로 소유.
    enabled: true

  match:
    prompt-timer-sec: 180          # 표시용 (D5)
    enforce-prompt-timer: false    # 강제 전환 플래그
    halftime-subs-max: 3
    clock:                         # P4-D1/D2 서버 권위 시계 (#170, LLD-e2-flow-clock §5)
      # 하드코딩 0(AC-W3-2): 압축비·감독시간·seek 정책이 전부 여기 있다. 압축비는 노브가 아니라
      # 파생값 — 노브는 half-real-ms 이고 클라가 tickCount*msPerTick/halfRealMs 로 계산한다.
      enabled: true                # false = 롤백 스위치(시계 이전 즉시 전개 동작)
      # #216: **하이라이트 켬(연출) 모드의 실측 재생 길이**에 맞춘다. 구 240s 는 재생이 끝나기 한참
      # 전에 하프타임을 열었다(켬 모드 실측의 57%). 리얼 config 하프를 코어 페이싱
      # (크루즈 4x / 키장면 1x / 데드볼 홀드)으로 돌려 잰다.
      # (구 실측 = 90분·배속 1.0 시절 하프 2700틱: min 392s · p50 422s · max 463s.)
      # 총 경기 길이 조절 노브다. ⚠️ 줄인 만큼을 **되찾아 주는 장치는 없다**(#416) — 한때 여기
      # "web 이 배율(live-pace.paceRate)로 재생을 당겨 맞춘다"고 적혀 있었지만 그 함수는
      # 프로덕션 호출부가 0건인 휴면 함수다(재생 루프 = 고정 배속만). 줄이면 그만큼 안 보인다.
      # 구속력 있는 범위는 하나다 — `tools/pace-config.test.ts` 가 **엔진으로 직접 하프를 돌려**
      # 재생 길이를 재고 이 값과 ±20% 를 대조한다. 이 밖으로 나가려면 그 테스트도 함께 고쳐야 하고,
      # 그건 "재생과 창을 어긋나게 두겠다"는 의도적 결정이다.
      # ⚠️ 잘림이 시작되는 지점은 배율 상한 1.6 이 아니라 **1.0**(창 < 재생 길이)이다 — 위와 같은
      #   이유로 흡수 장치가 없다. 창보다 긴 하프는 그 차이만큼 끝이 안 보인 채 하프타임이 열린다.
      # ⚠️ #365 이후 이 값은 **폴백**이다. 운영 창은 러너가 준 그 하프의 실제 재생 길이
      #   (`SimulateResponse.playbackMs`)로 잡힌다 — 창 == 재생 길이라야 클라가 배속을 창에 맞춰
      #   보정할 필요가 없다(hero 확정: 고정 배속만). 러너가 값을 안 주면 여기로 떨어진다.
      # #365(하프 절대 3분): 엔진 45분(하프 1350틱) + 코어 배속 1.2. engine@0.30.0 실측
      #   (measure-playback-pace, 16하프) = min 156.1 / p50 183.1 / mean 184.7 / max 206.8 s
      #   → 창 180000. 창 대비 필요 배율 0.87~1.15 로 컨트롤러 [0.6,1.6] 안(여유 충분).
      # ── engine@0.34.0 재측정 (배포 발차, #377 트랙 D + #370 되돌림) ─────────────────────
      # 데드볼 정지가 짧아지고(#378 재개 게이트) 이벤트가 늘어(#370 되돌림) 재생이 길어졌다.
      # 실측(measure-playback-pace, 16하프) = min 205.5 / p50 221.8 / mean 221.8 / max 246.2 s
      #   → 폴백 창 **220000**. 180000 을 그대로 두면 `tools/pace-config.test.ts` 가 red 이고
      #   (실측/창 = 1.23, 상한 1.2), 폴백을 타는 경로에서 **창이 재생보다 짧아 하프가 잘린다**.
      # ⚠️ 이 값은 **폴백일 뿐**이다(바로 위 #365 주석 참조) — 운영 창은 러너가 준
      #   `SimulateResponse.playbackMs`(그 하프의 실제 재생 길이)로 잡히므로, 엔진이 또 바뀌어도
      #   운영은 자동 추종한다. 여기는 "러너가 값을 안 줬을 때 과도하게 짧지 않은가"만 지키면 된다.
      # ── engine@0.41.0 재측정 (#405·#407 머지 후, #416) ────────────────────────────────
      # 실측(measure-playback-pace, 16하프) = min 196.4 / p50 225.7 / mean 224.0 / max 246.1 s
      #   → 권장값(= mean 반올림) 그대로 **220000 유지**. 값은 안 바꾼다.
      # ⚠️ 220000 은 "안전해서"가 아니라 **평균에 맞춘 값**이다. 창 하나로 산포를 못 덮으므로
      #   폴백 경로에서 최장 하프(246.1s)는 끝 약 26s(11%)가 안 보이고, 최속 하프(196.4s)는
      #   약 24s 빈 시간이 생긴다. 둘을 가운데서 맞바꾼 값이다(배율 보정이 없어 둘 다 못 없앤다).
      # 계약 = MatchClockShippedDefaultsTest(밴드 = 위 실측 min~max) + tools/pace-config.test.ts.
      half-real-ms: 220000         # 하프당 실시간 재생 길이(폴백. 운영 창은 playbackMs)
      halftime-ms: 180000          # 감독시간(#216 hero 지시 = 3분. 구 60초)
      auto-resume-on-expiry: true  # 만료 시 후반 자동 시작(전반 프롬프트 승계)
      sweep-interval-ms: 1000      # 시계 스위퍼 주기(잡 스위퍼 10s 와 별도 — 초 단위 경계)
      sweep-parallelism: 4         # 만료 스윕 동시 매치 수(후반 시작이 동기 시뮬이라 순차면 서로를 막는다)
      seek:
        forward-blocked: true      # 라이브 앞서가기 금지(뒤로 스크럽은 자유)
        grace-ms: 1500             # 지연·클럭 스큐 허용 오차
    skip:                          # #421 경기 스킵 — 재생 창을 지금으로 당긴다(새 전이 엣지 0)
      # false = 롤백 스위치: POST /api/matches/{id}/skip 이 409 이고 재생 창은 한 밀리초도 안 움직인다
      # (= P4-D1 "전반 재생 중 후반 앞당기기 금지" 원 규칙으로 복귀). 이 기능은 그 규칙을 hero 지시로
      # 뒤집은 것이라 되돌리는 손잡이가 있어야 한다. 오토(#249)와 달리 200 no-op 이 아니라 409 인 이유:
      # 스킵은 요청이 곧 상태 변화라, 조용한 성공이면 클라가 다음 단계가 열렸다고 믿고 화면을 넘긴다.
      enabled: true
    auto:                          # #249 오토 모드 — 감독시간 없이 전반→후반 즉시
      # false = 롤백 스위치: 전반 종료 경계가 matches.auto_mode 를 보지 않는다(이미 켠 매치도 정상
      # 감독시간으로 복귀). 토글 API 는 계속 200 이라 스위치를 내려도 클라에 에러가 뜨지 않는다.
      enabled: true
    delta:                         # #193 라운드2 — 지시 델타 패치 vs 풀생성 라우팅(전부 config)
      # 블라인드 맞대결 라운드2 결과: 풀생성이 이긴 건 **다축 대변경 K1** 하나(델타 3.13 < 풀 4.75).
      # 소변경 K2 는 **델타가 이겼고**(4.63 > 풀 3.25), 돌발 3종·개인지시도 델타가 동급 이상.
      # → 오라우팅은 지연뿐 아니라 **품질 손실**이다. 대변경인 **그 사이드만** 풀생성으로 돌린다.
      enabled: true                # false = 롤백 스위치(promptDelta 미첨부 = 델타 이전 '풀 패치', 라우팅도 정지)
      # 대변경 판정 임계: 새 팀 지시가 언급하는 **서로 다른 전술 축의 수**가 이 값 이상이면 대변경
      # (OverhaulDetector — 압박/라인/템포/폭/오버랩/트랩/콤팩트/마킹/침투/패스/드리블/슛).
      # 3 = K1("초공격 전방압박, 라인 최대로, 풀백 오버랩" = 3축)은 잡고 K2(템포 1축)·돌발(0~1축)은 안 잡는 선.
      # 값이 클수록 엄격 — 99 처럼 축 개수보다 큰 값을 주면 라우팅만 꺼진다(델타는 유지, 진단·A/B 용).
      # 0 이면 팀 지시 변경 전부가 풀생성(반대편 A/B).
      # ⚠️ 구 `overhaul-similarity`(old/new 자카드)는 폐기 — 실 경로에서 old 가 항상 비어(덱에 팀 지시가
      #    없다) 유사도가 늘 0 이라 팀 지시가 있는 모든 킥오프를 풀생성으로 보냈다(라운드2와 정면 충돌).
      overhaul-axis-count: 3
      # 유효 지시 세트가 베이스(A/h1 인풋)와 **글자 단위로 같으면** 패치 대신 재사용(콜0) — #253.
      # 왜 켜는가: 덱에 팀 문장이 생기면서 web 브리핑이 그 문장을 그대로 pre 로 제출한다. 이게 없으면
      #   아무것도 바꾸지 않은 유저가 매 경기 패치 콜 하나를 물어 #215 의 "무변경이면 즉시 시작"이
      #   팀 문장을 쓴 유저에게만 사라진다.
      # ⚠️ 트레이드오프(독립검증 major-1): 재사용 경로가 쓰는 A 컨텍스트는 덱만 안다 — opponentRoster·
      #   conditions·relations·teamMorale 이 없다(A 는 매치 이전에 만들어지므로 원리상 못 가진다).
      #   즉 이 노브는 "이 경기에 대해 새로 말한 게 없는 유저"를 **지시가 아예 없는 유저와 같은 취급**으로
      #   묶는다(그쪽은 원래부터 상대 비의존 재사용이었다 — 새 성질이 아니라 적용 범위 확대다).
      #   상대를 보고 쓴 문장(브리핑에서 덱 문장과 다르게 쓴 경우)은 그대로 B 패치라 상대 컨텍스트를 받는다.
      # false = #253 이전 라우팅(같은 지시여도 패치) — AI 품질 우선, 콜0 포기. 코드 변경 없이 되돌린다.
      reuse-on-no-change: true
      # 대변경 풀생성 잡에만 실리는 effort 힌트(잡 컨텍스트 effortHint → 실행기 --effort).
      # 기본 "low" 근거: **다축 지시 풀생성은 effort low + 필수확인 서픽스에서 4.25/5 · 57.7s 실측**
      # (#193 라운드1 A1). 이 값이 라우팅이 피하려던 델타(3.13)보다 **확실히 높으면서**, 풀 effort
      # (4.75 · 121s)의 **절반 지연**이다 — 감독시간(match.clock.halftime-ms, #216 이후 180초) 안에 들어온다.
      # 품질 최우선(지연 2배 수용)이면 "" 로 올려라: 빈 문자열 = --effort 플래그 생략 = claude 세션
      # 기본 effort = 맞대결 4.75 를 낸 그 조건.
      overhaul-effort: "low"
    ai-job-timeout-sec: 240        # GEN 상태에서 이걸 넘으면 FAILED
    # ai_jobs 가시성 타임아웃. ⚠️ lease-sec 은 **AI 잡 실제 소요(p99) + 버퍼 이상**이어야 한다 —
    # 짧으면 아직 살아 일하는 워커의 잡을 스위퍼가 queued 로 되돌려 결과를 폐기하고 같은 잡을
    # 무한 재실행하는 라이브락이 된다(#193 D2. 실측 AI 잡 130~170s 인데 120s 였음).
    # ai-job-timeout-sec 이상으로 둔다: 그 전에 재배포해봐야 매치가 먼저 타임아웃돼 의미가 없고,
    # 워커 사망 복구는 타임아웃 후 retry 경로가 담당한다. (수용 게이트는 AiJobQueue.completable 이
    # 이중 안전망 — 만료 뒤 도착한 정상 결과도 버리지 않는다.)
    lease-sec: 300
    max-attempts: 3
    sweep-interval-ms: 10000       # JobLeaseSweeper 주기 (LLD §6: 10s)
    poll-interval-ms: 1000         # /internal/ai-jobs/poll long-poll 재조회 간격 (LLD §6: 1s)
    abandon:                       # #217 매치 잠금의 탈출구 — 영구 잠금 금지(AC3). 하드코딩 금지(루트 §2-4).
      # 라이브 단계가 "멈췄다"고 보고 유저에게 포기 버튼을 여는 유예(ms). 시계 스위퍼(1s)와 후반
      # 시뮬(동기 엔진 RPC) 을 넉넉히 덮어야 한다 — 짧으면 정상적인 후반 시작 대기에 포기가 열린다.
      stuck-grace-ms: 300000
      # 생성 단계(GEN1/GEN2)가 멈췄다고 보는 유예(ms) — 기준 = 그 매치 잡의 마지막 갱신 시각.
      # ⚠️ ai-job-timeout-sec(240s)보다 충분히 커야 한다: 정상적으로 늦는 잡은 JobLeaseSweeper 의
      # FAILED→retry 경로가 먼저 처리해야 하고, 이 값은 **그 경로조차 못 밟는 사고**(잡은 전부 done
      # 인데 전이 커밋 전에 프로세스가 죽은 경우 — 어느 스위퍼에도 안 걸린다)만 잡는 마지막 창이다.
      # 정상 GEN1 은 6~14초(대변경 1~2분), GEN2 는 0.3초라 근처도 못 온다.
      gen-stuck-ms: 900000
      # 비터미널 매치 자동 회수 나이(분). 정산 없이 12시간을 넘긴 매치는 사고다 — 정상 매치는
      # 브리핑 포함 수십 분 안에 끝나므로 정상 플레이를 건드릴 여지가 없다.
      stale-after-min: 720
      sweep-interval-ms: 600000    # 방치 스윕 주기(10분) — 시계(1s)·잡(10s) 과 달리 급할 게 없다
    condition:                     # AC-C1 컨디션 능력치 배율 (LLD-p2-server §3)
      min-mul: 0.85                # 6시(condition=0.0) = -15%
      max-mul: 1.10                # 12시(condition=1.0) = +10%
      zone: Asia/Seoul             # 컨디션 '당일' 판정 존(#98 계약 A) — 날짜시드 = userId:yyyy-MM-dd
  eligibility:                     # #296 노출 자격 — "게임 한 판이라도 한 유저만" 랭킹·원정 상대 풀에.
    # 왜: 랭킹은 users 전량을, 원정 후보는 "활성 덱 보유자"를 실었는데 **덱은 온보딩이 자동 지급**한다
    # (스타터 15장). 둘 다 사실상 "가입했음"이라 가입만 한 계정이 순위표와 상대 풀을 도배했다
    # (라이브 160계정 중 137, 원정 후보 40명 중 실플레이 9명 — 운영 조치 #288).
    # ⚠️ 이 필터는 **미래**를 막는다. 이미 쌓인 허수는 #288 의 레이팅 차감이 눌러두고 있다 —
    #    필터를 넣었다고 그 차감을 되돌리면 안 된다(스모크 계정도 대개 한 판은 돌리기 때문).
    # 되돌리는 법: enabled=false → 임계가 0 이 되어 필터 도입 전 동작으로 정확히 복귀(무배포 env 가능).
    enabled: true
    # 자격에 필요한 **완료된**(matches.result IS NOT NULL) 경기 수. 진행 중 매치를 세면 매치를
    # 열어놓기만 해도 목록에 들어오는 우회로가 된다. 모드는 가리지 않는다(연습 포함 — hero D1).
    min-finished-matches: 1
  away:                            # #245 원정(피침공) — hero 확정 2026-07-28. 수치 하드코딩 금지.
    rating:
      # 공격자·수비자 **둘 다** 이 값으로 움직인다(hero Q3 — 원 요구의 ±5 에서 상향·대칭화).
      # 대칭이라 레이팅이 "당하기만 하는" 비대칭 지표가 되지 않는다.
      # ⚠️ 값을 바꿔도 과거 리포트는 흔들리지 않는다 — away_reports.rating_delta 에 적용값을 박제한다.
      win: 10
      draw: 0
      loss: -10
    # 로비 팝업/전적에 한 번에 싣는 리포트 수. 부재중이 길면 수십 건이 쌓이는데 전량을 모달에
    # 그리면 스크롤 지옥이 된다 — 요약(summary)도 이 창 안에서 계산된다.
    report-list-limit: 20
    match:                           # hero E2/E3 — 무작위 2명 제시 + 레이팅 밴드 매칭
      # 한 번에 보여줄 상대 수. 2 = hero 지시("둘 중에 고르게"). 늘리면 정찰 이득이 커진다.
      candidate-count: 2
      # 레이팅 밴드 반폭. 내 레이팅 ±이 값 안에서 먼저 고르고, 부족하면 단계적으로 넓힌다
      # (오픈베타처럼 인원이 적으면 밴드만 고집하다 "상대 없음"이 되는 게 더 나쁘다).
      rating-band: 50
      # 제시가 유효한 시간(초). 지나면 다시 뽑아야 한다 — 오래된 제시로 나중에 골라 담지 못하게.
      offer-ttl-sec: 600
      # 하루 원정 횟수(hero 결정). **0 = 무제한**(= 롤백 스위치, 코드 변경 없이 끌 수 있다).
      # 목적은 파밍보다 **AI 비용·플레이 페이스** — 원정 한 판마다 AI 인풋 생성이 붙는다.
      # 리셋은 **KST 자정**(hmb.match.condition.zone 과 같은 기준 — 컨디션 갱신과 체감이 어긋나면
      # "어제 것"의 의미가 화면마다 달라진다).
      # env 로도 덮을 수 있다: HMB_AWAY_MATCH_DAILYLIMIT=0
      daily-limit: 10
    revenge:                         # #286 W4 — 나를 친 상대에게만 여는 지목 원정
      # 기록 하나당 도전 횟수(hero 확정 — 1회차에 이기면 2회차는 없다).
      # ⚠️ 이건 편의값이 아니라 **자물쇠의 눈금**이다. V22 가 닫은 지목 경로를 "나를 친 기록당 N판"
      #    으로만 여는 구조라, 이 수를 키우는 것은 어뷰징 창을 그만큼 넓히는 결정이다.
      attempts-max: 2
      # 복수 큐에 사는 기록 수(최근 N건 슬라이딩). 6번째 침공이 들어오면 가장 오래된 것이 밀려난다.
      # **표시 상한이 아니라 창 자체**다 — POST 도 이 창 밖의 기록을 거부한다(410 REVENGE_EXPIRED).
      queue-size: 5
    streak:                          # hero E4 연승 보너스
      # 연승 1회당 추가 레이팅(2연승부터 붙는다: (streak-1) × 이 값).
      bonus-per-win: 2
      # 보너스 상한 — 없으면 장기 연승이 밴드 매칭을 뚫고 혼자 달아난다.
      max-bonus: 10
    season:                          # hero E5 주간 시즌(보상 후 초기화)
      length-days: 7
      # 마감 스윕 주기(ms). 주 단위 경계라 급할 게 없다.
      sweep-interval-ms: 300000
      # 순위별 보상 포인트. 없는 순위는 participation 을 받는다(원정을 한 번이라도 한 유저만).
      rewards:
        1: 30000
        2: 20000
        3: 10000
      participation-reward: 2000
    reward:                          # hero E6/E7 — 돈은 리그 한 판과 같게, 수비자도 받는다
      # 어느 곡선을 쓸지(economy rewards.byMode 의 키). 'league' = 승 5000 / 무 2000 / 패 1000.
      # ⚠️ 값 자체는 data 발행물(economy)이 소유한다 — 여기선 **어떤 곡선을 쓸지만** 고른다.
      #    away 키를 economy 에 새로 만들지 않는 이유: data/** 는 이 모듈 소유가 아니고,
      #    "리그와 같게"라는 지시는 값 복제가 아니라 참조로 표현하는 게 정확하다.
      mode: league
      # 수비자가 **졌을 때** 보상을 주는가. hero: "덱 세팅 잘해두면 돈이 들어오고, 지면 남 좋은
      # 일만 하는 구조" → 패배는 0.
      defender-on-loss: false
  mission:                         # #408 원정 데일리 미션 (설계 SoT = docs/plan-v5/away-daily-mission.md)
    daily:
      # 하루에 주는 미션 수(hero 확정 Q2 = 완전 랜덤 2개, 14종 균등·중복만 금지).
      # ⚠️ **0 = 기능 끄기**(롤백 스위치, env HMB_MISSION_DAILY_COUNT=0). 새 미션이 생성되지 않고
      #    화면은 섹션을 통째로 안 그린다. 이미 달성한 미수령 보상은 그대로 남는다(§6.3).
      #    금액을 0 으로 내리는 방식은 쓰지 않는다 — 미션은 뜨는데 보상이 0 이면 고장으로 읽힌다(§9).
      count: 2
      # 슬롯당 리롤 횟수(hero 확정 1회 = 하루 2회). ⚠️ 이 값은 **배분 규칙과 한 쌍**이다(§5.1/§6.2):
      # 균등 추첨이라 "1판짜리 미션이 하나도 없는 날"이 40% 인데 리롤이 그날의 유일한 구제 장치다.
      # 좁히려면 배분 규칙을 같이 다시 봐야 한다.
      reroll-per-slot: 1
      # 미션 풀 14종 — **문구는 hero 산출물(§4 표)이라 임의 수정 금지**.
      # 티어→금액은 여기 없다. 그건 economy `mission.reward` 가 소유한다(무배포 조정 대상).
      # 개인 득점·어시스트·무승부 미션은 §4 "풀에서 뺀 것"의 근거로 **의도적으로 없다** —
      # 되살리려면 그 표의 근거를 먼저 뒤집어야 한다.
      catalog:
        # 쉬움(T1) — 1판이면 닿는다
        - { id: away_play_1,    tier: EASY,   rule: PLAY,             target: 1, title: "원정 경기를 1회 치른다" }
        - { id: away_win_1,     tier: EASY,   rule: WIN,              target: 1, title: "원정에서 1승" }
        - { id: away_goals_2,   tier: EASY,   rule: BEST_MATCH_GOALS, target: 2, title: "원정 한 경기에서 2골" }
        - { id: away_first_goal, tier: EASY,  rule: FIRST_GOAL,       target: 1, title: "원정 경기에서 선제골을 넣는다" }
        - { id: away_play_2,    tier: EASY,   rule: PLAY,             target: 2, title: "원정 경기를 2회 치른다" }
        # 보통(T2) — 2~3판
        - { id: away_win_2,     tier: NORMAL, rule: WIN,              target: 2, title: "원정에서 2승" }
        - { id: away_streak_2,  tier: NORMAL, rule: WIN_STREAK,       target: 2, title: "원정 2연승" }
        - { id: away_goals_3,   tier: NORMAL, rule: BEST_MATCH_GOALS, target: 3, title: "원정 한 경기에서 3골" }
        - { id: away_clean_win, tier: NORMAL, rule: CLEAN_WIN,        target: 1, title: "원정에서 무실점 승리" }
        - { id: away_play_3,    tier: NORMAL, rule: PLAY,             target: 3, title: "원정 경기를 3회 치른다" }
        # 어려움(T3) — 3~4판
        - { id: away_win_3,     tier: HARD,   rule: WIN,              target: 3, title: "원정에서 3승" }
        - { id: away_streak_3,  tier: HARD,   rule: WIN_STREAK,       target: 3, title: "원정 3연승" }
        - { id: away_margin_3,  tier: HARD,   rule: BEST_WIN_MARGIN,  target: 3, title: "3골차 이상으로 승리" }
        - { id: away_goals_4,   tier: HARD,   rule: BEST_MATCH_GOALS, target: 4, title: "원정 한 경기에서 4골" }
  relation:                        # AC-C4 관계/사기 변동 규칙 (LLD-p2-server §4) — 하드코딩 금지(config)
    starter-bonus: 2               # 선발 기용 +2
    win-bonus: 3                   # 승리 전원 +3
    loss-penalty: -2               # 패배 -2
    sub-out-penalty: -1            # 교체 아웃 -1
    absent-streak-penalty: -3      # 결장 연속 threshold 경기째부터 -3/경기
    absent-streak-threshold: 2     # 연속 2경기째부터
    morale-win: 8                  # 사기 승 +8
    morale-draw: 2                 # 사기 무 +2
    morale-loss: -8                # 사기 패 -8
  trade:                           # AC-D 트레이드 (#149 능동화) — 수치 SoT 는 economy.v2 trade 블록.
    # 레어도별 카운트다운은 economy trade.waitHours[grade](시간) 가 기본. 데모/로컬에서만 초 단위로
    # 줄이고 싶을 때 등급별 오버라이드를 준다(하드코딩 금지 — 값은 전부 config).
    # 기본은 비움 = 무회귀(waitHours 사용). env 로 주입: HMB_TRADE_WAITSECONDS_GOLD=10
    wait-seconds: {}               # 예) { BRONZE: 5, SILVER: 8, GOLD: 10, DIA: 15, LEGEND: 20 }
    busy-retry:                    # #152 동시 쓰기(SQLITE_BUSY_SNAPSHOT) 시 트랜잭션 통째 재시도.
      # WAL 에서 읽기→쓰기 승격이 막히면 SQLite 가 busy_timeout 을 무시하고 즉시 실패시키므로,
      # 대기가 아니라 롤백 후 재시도만이 해법이다. 소진 시 5xx 대신 TRADE_INVALID(계약 코드)로 내린다.
      max-attempts: 4              # 최초 시도 포함 총 시도 횟수
      backoff-ms: 20               # 회차 비례 선형 백오프(20/40/60ms)
  league:                          # AC-F 리그 (LLD-p2-server §6) — 봇전 간이결과 확률 모델 계수(하드코딩 금지)
    bot-team-count: 9              # 유저 제외 봇 팀 수(총 10팀 더블 라운드로빈 18R)
    roster-size: 15               # 봇 팀 로스터(선발 11 + 벤치 4)
    sim:                           # 봇 vs 봇 간이 결과(팀 파워 + 홈보정 → 푸아송 근사, docs/plan-v3/league-rules.md)
      base-goals: 1.10             # 파워 동일·중립 시 팀당 기대 득점
      # #252: 120 → 400. 근거 = docs/plan-v5/opponent-balance.md §1.4 BL-5 / §3.3.
      # 봇 파워 산포(라이브 실측 sd 126)에 비해 120 은 너무 작아 파워차 126 이 곧 기대득점차 1.05골이
      # 됐다 → 봇 9팀 중 최고가 16경기에 승점 44점(2.75 ppg), 최저 3점(0.19 ppg). 실제 리그는
      # 우승 2.2~2.4 / 최하위 0.7~0.9 다. 그 결과 **유저가 매치 승률 65% 를 찍어도 우승 확률 14.6%** 로,
      # 유저 경기를 아무리 쉽게 해도 리그 우승이 구조적으로 막혀 있었다.
      # 400 에서 봇 최고 2.19 / 최저 0.63 ppg = 실제 리그 밴드. 롤백 = 이 값을 120 으로.
      power-divisor: 400.0         # 파워차 → 기대 득점 변환(Δ기대 = (myPower-oppPower)/divisor)
      home-advantage: 0.35         # 홈 팀 기대 득점 가산(홈 어드밴티지)
      max-goals: 8                 # 한 팀 최대 득점 클램프(푸아송 꼬리 방어)
    division:                      # #252 승급/강등 컷. level 은 작을수록 상위(10=입문 … 1=최상위).
      # 사다리 표 자체(등급 슬롯·배율·표시명)는 data 발행물 league.v2.json 이 SoT — 여기엔 규칙만 둔다.
      promote-rank-max: 2          # 최종 1~2위 = 승급(level-1)
      relegate-rank-min: 9         # 최종 9~10위 = 강등(level+1). 3~8위는 유지
  cors:                              # CORS 허용 오리진(이슈 #128, 오픈 blocker B1) — /api/** 대상
    # 콤마 구분. env HMB_CORS_ALLOWEDORIGINS 로 재빌드 없이 교체(quick tunnel/Pages URL 은 재시작마다 바뀜).
    # 기본값 = 로컬 dev 오리진 하나(와일드카드 아님) — 미설정 시 아무 데서나 열리지 않게(무회귀).
    # 배포: HMB_CORS_ALLOWEDORIGINS="https://<pages>.pages.dev" (여러 개면 콤마).
    allowed-origins: ${HMB_CORS_ALLOWEDORIGINS:http://localhost:5173}
  servant:
    engine-runner-url: http://localhost:8790
    internal-token: change-me      # /internal/* shared secret (AC-Q3)
    simulate-timeout-sec: 30       # LLD §5.3
    simulate-retries: 1            # LLD §5.3: 실패 1회 재시도 후 FAILED

logging:
  level:
    # AC-A2 하드닝: 이 로거는 TRACE 에서 **SQL 바인딩 파라미터 값을 그대로** 찍는다
    # ("Setting SQL statement parameter value: ... parameter value [...]") — users.password 가
    # 평문인 P3-D2 동안에는 그게 곧 비번 유출이다. DEBUG 로 고정해 root 를 TRACE 로 올려도
    # 파라미터 값이 로그에 나오지 않게 한다(명시 레벨이 root 보다 우선). 비번 해시 전환 시 해소.
    org.springframework.jdbc.core.StatementCreatorUtils: DEBUG

springdoc:
  api-docs:
    path: /internal/openapi-generated
  swagger-ui:
    enabled: false
