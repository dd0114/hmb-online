server:
  port: 8080

spring:
  application:
    name: hmb-server
  task:
    scheduling:
      # @Scheduled 기본 풀은 1이라 시계 스위퍼가 오래 걸리면 JobLeaseSweeper 까지 멈춘다(#170).
      pool:
        size: 4
  threads:
    virtual:
      enabled: true   # W4: /internal/ai-jobs/poll long-poll가 블로킹으로 대기해도 요청 스레드 풀을 고갈시키지 않게 (LLD §6)
  datasource:
    url: jdbc:sqlite:${hmb.db.path:./.data/hmb.db}?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5   # WAL이라 동시 읽기는 가능, 쓰기 직렬화는 busy_timeout이 흡수
  flyway:
    enabled: true
    locations: classpath:db/migration
  # jackson 설정은 common/Json.java(@Primary ObjectMapper)가 단일 SoT — spring.jackson.* 키는
  # 커스텀 빈에 적용되지 않아(dead) 두지 않는다. (W1 검증 이월사항 b)

hmb:
  db:
    path: ./.data/hmb.db
  data:
    players-file: ../data/players/players.v2.1.json   # 부팅 임포트(버전 upsert, meta_kv 기록) — v2.1=실선수+성격(#94)
    economy-file: ../data/players/economy.v2.json      # 확률표·경제 수치 + trade/league 블록 로딩
    bots-file:    ../data/players/bots.v2.json
    league-file:  ../data/players/league.v1.json       # 리그 클럽명·페르소나·보상표(W3 소비, W1 로더만)
  auth:
    session-ttl-hours: 720
    local:                           # P3 §A 자체 로그인(P3-D2) — 비번 평문 목업, 해시 전환은 백로그
      password-min-length: 4         # 가입 검증 하한(하드코딩 금지 — config)
      password-max-length: 64        # 상한(과대 입력 방어)
  admin:                             # P3 §C admin 격리(P3-D4) — 자격은 코드가 아니라 env 가 정한다.
    # 둘 다 비어 있으면 **admin 0명**(기본 안전). 부팅 시 잔존 is_admin 플래그도 회수한다.
    # 둘 다 채우면 그 닉네임 계정에만 is_admin=1 을 부여(계정이 없으면 생성). 하나만 채우면 부팅 실패.
    # ⚠️ 값을 여기 하드코딩하지 말 것 — 배포는 env 로만 주입한다(비번은 로그에 절대 찍지 않는다).
    nickname: ${HMB_ADMIN_NICKNAME:}
    password: ${HMB_ADMIN_PASSWORD:}
  deck:
    bench-max: 7
    player-prompt-max-chars: 500
  match:
    prompt-timer-sec: 180          # 표시용 (D5)
    enforce-prompt-timer: false    # 강제 전환 플래그
    halftime-subs-max: 3
    clock:                         # P4-D1/D2 서버 권위 시계 (#170, LLD-e2-flow-clock §5)
      # 하드코딩 0(AC-W3-2): 압축비·감독시간·seek 정책이 전부 여기 있다. 압축비는 노브가 아니라
      # 파생값 — 노브는 half-real-ms 이고 클라가 tickCount*msPerTick/halfRealMs 로 계산한다.
      # 리얼 config(하프 2700틱) 기준 240s → 11.25배 압축.
      enabled: true                # false = 롤백 스위치(시계 이전 즉시 전개 동작)
      half-real-ms: 240000         # 하프당 실시간 재생 길이(≈4분)
      halftime-ms: 60000           # 감독시간(P4-D2 = 60초)
      auto-resume-on-expiry: true  # 만료 시 후반 자동 시작(전반 프롬프트 승계)
      sweep-interval-ms: 1000      # 시계 스위퍼 주기(잡 스위퍼 10s 와 별도 — 초 단위 경계)
      sweep-parallelism: 4         # 만료 스윕 동시 매치 수(후반 시작이 동기 시뮬이라 순차면 서로를 막는다)
      seek:
        forward-blocked: true      # 라이브 앞서가기 금지(뒤로 스크럽은 자유)
        grace-ms: 1500             # 지연·클럭 스큐 허용 오차
    ai-job-timeout-sec: 240        # GEN 상태에서 이걸 넘으면 FAILED
    lease-sec: 120                 # ai_jobs 가시성 타임아웃
    max-attempts: 3
    sweep-interval-ms: 10000       # JobLeaseSweeper 주기 (LLD §6: 10s)
    poll-interval-ms: 1000         # /internal/ai-jobs/poll long-poll 재조회 간격 (LLD §6: 1s)
    condition:                     # AC-C1 컨디션 능력치 배율 (LLD-p2-server §3)
      min-mul: 0.85                # 6시(condition=0.0) = -15%
      max-mul: 1.10                # 12시(condition=1.0) = +10%
      zone: Asia/Seoul             # 컨디션 '당일' 판정 존(#98 계약 A) — 날짜시드 = userId:yyyy-MM-dd
  relation:                        # AC-C4 관계/사기 변동 규칙 (LLD-p2-server §4) — 하드코딩 금지(config)
    starter-bonus: 2               # 선발 기용 +2
    win-bonus: 3                   # 승리 전원 +3
    loss-penalty: -2               # 패배 -2
    sub-out-penalty: -1            # 교체 아웃 -1
    absent-streak-penalty: -3      # 결장 연속 threshold 경기째부터 -3/경기
    absent-streak-threshold: 2     # 연속 2경기째부터
    morale-win: 8                  # 사기 승 +8
    morale-draw: 2                 # 사기 무 +2
    morale-loss: -8                # 사기 패 -8
  trade:                           # AC-D 트레이드 (#149 능동화) — 수치 SoT 는 economy.v2 trade 블록.
    # 레어도별 카운트다운은 economy trade.waitHours[grade](시간) 가 기본. 데모/로컬에서만 초 단위로
    # 줄이고 싶을 때 등급별 오버라이드를 준다(하드코딩 금지 — 값은 전부 config).
    # 기본은 비움 = 무회귀(waitHours 사용). env 로 주입: HMB_TRADE_WAITSECONDS_GOLD=10
    wait-seconds: {}               # 예) { BRONZE: 5, SILVER: 8, GOLD: 10, DIA: 15, LEGEND: 20 }
    busy-retry:                    # #152 동시 쓰기(SQLITE_BUSY_SNAPSHOT) 시 트랜잭션 통째 재시도.
      # WAL 에서 읽기→쓰기 승격이 막히면 SQLite 가 busy_timeout 을 무시하고 즉시 실패시키므로,
      # 대기가 아니라 롤백 후 재시도만이 해법이다. 소진 시 5xx 대신 TRADE_INVALID(계약 코드)로 내린다.
      max-attempts: 4              # 최초 시도 포함 총 시도 횟수
      backoff-ms: 20               # 회차 비례 선형 백오프(20/40/60ms)
  league:                          # AC-F 리그 (LLD-p2-server §6) — 봇전 간이결과 확률 모델 계수(하드코딩 금지)
    bot-team-count: 9              # 유저 제외 봇 팀 수(총 10팀 더블 라운드로빈 18R)
    roster-size: 15               # 봇 팀 로스터(선발 11 + 벤치 4)
    sim:                           # 봇 vs 봇 간이 결과(팀 파워 + 홈보정 → 푸아송 근사, docs/plan-v3/league-rules.md)
      base-goals: 1.10             # 파워 동일·중립 시 팀당 기대 득점
      power-divisor: 120.0         # 파워차 → 기대 득점 변환(Δ기대 = (myPower-oppPower)/divisor)
      home-advantage: 0.35         # 홈 팀 기대 득점 가산(홈 어드밴티지)
      max-goals: 8                 # 한 팀 최대 득점 클램프(푸아송 꼬리 방어)
  cors:                              # CORS 허용 오리진(이슈 #128, 오픈 blocker B1) — /api/** 대상
    # 콤마 구분. env HMB_CORS_ALLOWEDORIGINS 로 재빌드 없이 교체(quick tunnel/Pages URL 은 재시작마다 바뀜).
    # 기본값 = 로컬 dev 오리진 하나(와일드카드 아님) — 미설정 시 아무 데서나 열리지 않게(무회귀).
    # 배포: HMB_CORS_ALLOWEDORIGINS="https://<pages>.pages.dev" (여러 개면 콤마).
    allowed-origins: ${HMB_CORS_ALLOWEDORIGINS:http://localhost:5173}
  servant:
    engine-runner-url: http://localhost:8790
    internal-token: change-me      # /internal/* shared secret (AC-Q3)
    simulate-timeout-sec: 30       # LLD §5.3
    simulate-retries: 1            # LLD §5.3: 실패 1회 재시도 후 FAILED

logging:
  level:
    # AC-A2 하드닝: 이 로거는 TRACE 에서 **SQL 바인딩 파라미터 값을 그대로** 찍는다
    # ("Setting SQL statement parameter value: ... parameter value [...]") — users.password 가
    # 평문인 P3-D2 동안에는 그게 곧 비번 유출이다. DEBUG 로 고정해 root 를 TRACE 로 올려도
    # 파라미터 값이 로그에 나오지 않게 한다(명시 레벨이 root 보다 우선). 비번 해시 전환 시 해소.
    org.springframework.jdbc.core.StatementCreatorUtils: DEBUG

springdoc:
  api-docs:
    path: /internal/openapi-generated
  swagger-ui:
    enabled: false
